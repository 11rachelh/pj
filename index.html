            if (sampler.recordingPad === pad) {
              selectPad(pad);

              return;
            }

            const now = Date.now();

            const timeSinceLastTap = now - pad.lastTapTime;

            if (pad.lastTapTime > 0 && timeSinceLastTap < DOUBLE_TAP_TIME) {
              pad.lastTapTime = 0;

              pad.pendingDoubleTap = true;

              startRecording(pad);
            } else {
              pad.lastTapTime = now;

              pad.pendingDoubleTap = false;

              selectPad(pad);

              playPad(pad);
            }
          },
          { passive: false },
        );

        element.addEventListener(
          "pointermove",
          (event) => {
            /*
             * PLAY MODE：
             *
             * X / Y 同時控制效果。
             * 中央隱形正方形為乾聲基準區。
             */
            if (sampler.mode === "play") {
              event.preventDefault();

              if (pad.holding && pad.holdPointerId === event.pointerId) {
                updatePadEffectState(pad, event.clientX, event.clientY);
              }

              return;
            }

            if (sampler.mode !== "edit") {
              return;
            }

            if (pinchState && pinchState.target.element === element) {
              event.preventDefault();
              return;
            }

            if (action === null) {
              return;
            }

            if (sampler.recordingPad === pad) {
              return;
            }

            const dx = event.clientX - startX;

            const dy = event.clientY - startY;

            const distance = Math.sqrt(dx * dx + dy * dy);

            if (action === "resize") {
              moved = true;

              pad.width = Math.max(3, startWidth + pxToPercentX(dx));

              pad.height = Math.max(3, startHeight + pxToPercentY(dy));

              updatePad(pad);

              return;
            }

            if (distance > DRAG_THRESHOLD) {
              moved = true;

              action = "drag";

              pad.lastTapTime = 0;

              pad.x = startPadX + pxToPercentX(dx);

              pad.y = startPadY + pxToPercentY(dy);

              updatePad(pad);
            }
          },
          { passive: false },
        );

        element.addEventListener(
          "pointerup",
          (event) => {
            if (
              sampler.mode === "edit" &&
              performance.now() - pinchJustEndedAt < 250
            ) {
              action = null;
              moved = true;
              return;
            }

            if (sampler.mode === "play") {
              event.preventDefault();

              stopPadHold(pad, event.pointerId);

              try {
                element.releasePointerCapture(event.pointerId);
              } catch (error) {}

              return;
            }

            if (sampler.mode !== "edit") {
              return;
            }

            if (moved) {
              action = null;

              return;
            }

            if (sampler.recordingPad === pad && !pad.pendingDoubleTap) {
              stopRecording();

              action = null;

              return;
            }

            if (pad.pendingDoubleTap) {
              pad.pendingDoubleTap = false;

              action = null;

              return;
            }

            const duration = Date.now() - pointerDownTime;

            if (duration >= CLICK_TIME) {
              pad.lastTapTime = 0;

              action = null;

              return;
            }

            action = null;
          },
          { passive: false },
        );

        element.addEventListener(
          "pointercancel",
          (event) => {
            if (sampler.mode === "play") {
              event.preventDefault();

              stopPadHold(pad, event.pointerId);

              return;
            }

            action = null;

            pad.pendingDoubleTap = false;
          },
          { passive: false },
        );

        element.addEventListener("lostpointercapture", () => {
          if (sampler.mode === "play") {
            stopPadHold(pad);

            return;
          }

          action = null;

          pad.pendingDoubleTap = false;
        });
      }

      /* =====================================================
         BACKGROUND
      ===================================================== */

      /* =====================================================
         BACKGROUND MEDIA

         支援：JPG / PNG / GIF / WEBP / HEIC / HEIF / MP4 / MOV /
         WEBM / M4V。

         圖片維持原本的背景行為；影片使用 <video> 自動播放、
         靜音、inline、無限循環。影片不接受使用者操作，避免
         影響 PLAY MODE 的 PAD 手勢。
      ===================================================== */
      function isBackgroundVideo(file) {
        if (!file) return false;

        return (
          file.type.startsWith("video/") ||
          /\.(mp4|mov|webm|m4v)$/i.test(file.name)
        );
      }

      function stopAndRemoveBackgroundMedia() {
        const oldMedia = sampler.backgroundImageElement;

        if (oldMedia) {
          if (oldMedia.tagName === "VIDEO") {
            try {
              oldMedia.pause();
              oldMedia.removeAttribute("src");
              oldMedia.load();
            } catch (error) {}
          }

          try {
            oldMedia.remove();
          } catch (error) {}
        }

        sampler.backgroundImageElement = null;
      }

      function updateCanvasBackground() {
        if (!canvasBackground) return;

        canvasBackground.style.backgroundColor =
          sampler.backgroundColor || "#ffffff";

        if (!sampler.backgroundImageURL) {
          if (sampler.backgroundImageElement) {
            sampler.backgroundImageElement.style.display = "none";
          }
          return;
        }

        const wantedTag =
          sampler.backgroundMediaType === "video" ? "VIDEO" : "IMG";

        /* 如果媒體種類改變，就重建元素；同種類則重複使用。 */
        if (
          !sampler.backgroundImageElement ||
          sampler.backgroundImageElement.tagName !== wantedTag
        ) {
          stopAndRemoveBackgroundMedia();

          if (sampler.backgroundMediaType === "video") {
            const video = document.createElement("video");

            video.autoplay = true;
            video.loop = true;
            video.muted = true;
            video.defaultMuted = true;
            video.playsInline = true;
            video.preload = "auto";
            video.controls = false;

            video.setAttribute("autoplay", "");
            video.setAttribute("loop", "");
            video.setAttribute("muted", "");
            video.setAttribute("playsinline", "");

            video.addEventListener("loadeddata", () => {
              video.play().catch(() => {});
            });

            video.addEventListener("canplay", () => {
              if (video.paused) {
                video.play().catch(() => {});
              }
            });

            video.addEventListener("ended", () => {
              /* loop 通常會自動處理；這裡再保險一次。 */
              video.currentTime = 0;
              video.play().catch(() => {});
            });

            sampler.backgroundImageElement = video;
          } else {
            const img = document.createElement("img");
            img.draggable = false;
            sampler.backgroundImageElement = img;
          }

          sampler.backgroundImageElement.style.width = "100%";
          sampler.backgroundImageElement.style.height = "100%";
          sampler.backgroundImageElement.style.objectFit = "fill";
          sampler.backgroundImageElement.style.pointerEvents = "none";
          sampler.backgroundImageElement.style.display = "block";

          canvasBackground.appendChild(sampler.backgroundImageElement);
        }

        const media = sampler.backgroundImageElement;
        media.src = sampler.backgroundImageURL;
        media.style.display = "block";

        if (sampler.backgroundMediaType === "video") {
          media.muted = true;
          media.defaultMuted = true;
          media.loop = true;
          media.playsInline = true;
          media.play().catch(() => {});
        }
      }

      function setBackgroundColor(color) {
        if (!color) return;
        sampler.backgroundColor = color;
        updateCanvasBackground();
      }

      function setBackgroundImage(file) {
        if (!file) return;

        if (sampler.backgroundImageURL) {
          try {
            URL.revokeObjectURL(sampler.backgroundImageURL);
          } catch (error) {}
        }

        sampler.backgroundImageURL = URL.createObjectURL(file);
        sampler.backgroundMediaType = isBackgroundVideo(file)
          ? "video"
          : "image";

        updateCanvasBackground();
      }

      function clearBackground() {
        if (sampler.backgroundImageURL) {
          try {
            URL.revokeObjectURL(sampler.backgroundImageURL);
          } catch (error) {}
        }

        stopAndRemoveBackgroundMedia();

        sampler.backgroundImageURL = null;
        sampler.backgroundMediaType = null;
        sampler.backgroundColor = "#ffffff";
        backgroundColorInput.value = "#ffffff";
        updateCanvasBackground();
      }

      backgroundColorInput.addEventListener("input", (event) => {
        event.stopPropagation();
        if (sampler.mode === "edit") {
          setBackgroundColor(event.target.value);
        }
      });

      backgroundColorInput.addEventListener("change", (event) => {
        event.stopPropagation();
        if (sampler.mode === "edit") {
          setBackgroundColor(event.target.value);
        }
      });

      backgroundImageButton.addEventListener("click", () => {
        if (sampler.mode !== "edit") return;
        backgroundImageInput.value = "";
        backgroundImageInput.click();
      });

      backgroundImageInput.addEventListener("change", (event) => {
        if (sampler.mode !== "edit") return;
        const file = event.target.files?.[0];
        if (file) setBackgroundImage(file);
        backgroundImageInput.value = "";
      });

      clearBackgroundButton.addEventListener("click", () => {
        if (sampler.mode !== "edit") return;
        clearBackground();
      });

      updateCanvasBackground();

      /* =====================================================
         BACKGROUND VIDEO PLAYBACK RECOVERY

         部分瀏覽器在切回分頁／重新取得畫面後可能暫停影片；
         若目前背景是影片，就嘗試恢復播放。
      ===================================================== */
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState !== "visible") return;

        const video = sampler.backgroundImageElement;
        if (
          sampler.backgroundMediaType === "video" &&
          video &&
          video.tagName === "VIDEO"
        ) {
          video.play().catch(() => {});
        }
      });

      /* =====================================================
         IMAGE
      ===================================================== */

      addImageButton.addEventListener("click", () => {
        if (sampler.mode !== "edit") {
          return;
        }

        imageInput.value = "";

        imageInput.click();
      });

      imageInput.addEventListener("change", async (event) => {
        const files = Array.from(event.target.files || []);

        /* =====================================================
           HEIC / HEIF IMAGE IMPORT

           Normal images continue through the original path unchanged.
           HEIC / HEIF files are converted locally to JPEG first, because
           the browser's <img> element cannot reliably decode HEIC/HEIF.

           The conversion happens entirely in the browser; the image is
           not uploaded to a server.
        ===================================================== */
        for (const file of files) {
          try {
            const processedFile = await prepareImageFile(file);
            createImage(processedFile);
          } catch (error) {
            console.error("Failed to import image:", file.name, error);
            alert(
              `無法載入圖片：${file.name}\n\nHEIC / HEIF 轉換失敗，請確認網路連線後再試一次。`,
            );
          }
        }

        imageInput.value = "";
      });

      /* =====================================================
         HEIC / HEIF → JPEG

         只處理 HEIC / HEIF；JPG、PNG、GIF、WEBP、影片等原本的
         檔案完全不經過轉換，因此不改變既有圖片／影片流程。
      ===================================================== */
      async function prepareImageFile(file) {
        if (!file) {
          throw new Error("No image file provided.");
        }

        const isHEIC = await HeicTo.isHeic(file);

        if (!isHEIC) {
          return file;
        }

        if (
          typeof HeicTo !== "function" ||
          typeof HeicTo.isHeic !== "function"
        ) {
          throw new Error("HEIC converter library is unavailable.");
        }

        const converted = await HeicTo({
          blob: file,
          type: "image/jpeg",
          quality: 0.92,
        });

        /* HEIC bursts can return an array. For + IMAGE, keep the first
           converted frame so it behaves like one normal image layer. */
        const blob = Array.isArray(converted) ? converted[0] : converted;

        if (!(blob instanceof Blob)) {
          throw new Error("HEIC conversion did not return an image blob.");
        }

        return new File([blob], file.name.replace(/\.(heic|heif)$/i, ".jpg"), {
          type: "image/jpeg",
        });
      }

      function createImage(file) {
        if (!file) return;

        const id = sampler.nextImageId++;
        const url = URL.createObjectURL(file);
        const isVideo =
          file.type.startsWith("video/") ||
          /\.(mp4|webm|mov|m4v)$/i.test(file.name);

        const image = {
          id,
          x: 10 + Math.random() * 30,
          y: 10 + Math.random() * 30,
          width: 30,
          height: 30,
          url,
          mediaType: isVideo ? "video" : "image",
          element: null,
          mediaElement: null,
          invertOverlays: new Map(),
        };

        sampler.images.push(image);
        renderImage(image);
        selectImage(image);
      }

      /* =====================================================
         RENDER IMAGE
      ===================================================== */

      function renderImage(image) {
        const wrapper = document.createElement("div");
        wrapper.className = "imageItem";
        wrapper.style.left = image.x + "%";
        wrapper.style.top = image.y + "%";
        wrapper.style.width = image.width + "%";
        wrapper.style.height = image.height + "%";

        let media;

        if (image.mediaType === "video") {
          media = document.createElement("video");
          media.src = image.url;
          media.autoplay = true;
          media.loop = true;
          media.muted = true;
          media.defaultMuted = true;
          media.playsInline = true;
          media.preload = "auto";
          media.controls = false;
          media.setAttribute("autoplay", "");
          media.setAttribute("loop", "");
          media.setAttribute("muted", "");
          media.setAttribute("playsinline", "");
          media.addEventListener("loadeddata", () =>
            media.play().catch(() => {}),
          );
          media.addEventListener("canplay", () => {
            if (media.paused) media.play().catch(() => {});
          });
        } else {
          /* 一個原始 img 同時負責照片與 GIF，絕不因 PAD inverse 重建。 */
          media = document.createElement("img");
          media.src = image.url;
          media.draggable = false;
        }

        media.className = "imageMedia";
        media.draggable = false;
        media.style.width = "100%";
        media.style.height = "100%";
        media.style.objectFit = "fill";
        media.style.pointerEvents = "none";
        media.style.display = "block";

        const resizeHandle = document.createElement("div");
        resizeHandle.className = "imageResizeHandle";

        wrapper.appendChild(media);
        wrapper.appendChild(resizeHandle);
        canvas.appendChild(wrapper);

        image.element = wrapper;
        image.mediaElement = media;
        if (!image.invertOverlays) image.invertOverlays = new Map();

        setupImageInteraction(image, wrapper, resizeHandle);

        if (image.mediaType === "video") media.play().catch(() => {});
      }

      function updateImage(image) {
        if (!image.element) {
          return;
        }

        image.element.style.left = image.x + "%";

        image.element.style.top = image.y + "%";

        image.element.style.width = image.width + "%";

        image.element.style.height = image.height + "%";

        /*
         * 如果目前 PLAY MODE 有 inverse，
         * 尺寸變化後重新計算。
         */
        if (
          sampler.mode === "play" &&
          image.invertOverlays &&
          image.invertOverlays.size > 0
        ) {
          refreshAllPadImageInverts();
        }
      }

      /* =====================================================
         IMAGE INTERACTION
      ===================================================== */

      function setupImageInteraction(image, element, resizeHandle) {
        let startX;

        let startY;

        let startImageX;

        let startImageY;

        let startWidth;

        let startHeight;

        let action = null;

        element.addEventListener(
          "pointerdown",
          (event) => {
            if (sampler.mode !== "edit") {
              return;
            }

            event.preventDefault();

            if (pinchState && pinchState.target.element === element) {
              action = null;
              return;
            }

            try {
              element.setPointerCapture(event.pointerId);
            } catch (error) {}

            selectImage(image);

            startX = event.clientX;

            startY = event.clientY;

            startImageX = image.x;

            startImageY = image.y;

            startWidth = image.width;

            startHeight = image.height;

            if (event.target === resizeHandle) {
              action = "resize";
            } else {
              action = "drag";
            }
          },
          { passive: false },
        );

        element.addEventListener(
          "pointermove",
          (event) => {
            if (sampler.mode !== "edit") {
              return;
            }

            if (!action) {
              return;
            }

            event.preventDefault();

            const dx = event.clientX - startX;

            const dy = event.clientY - startY;

            if (action === "drag") {
              image.x = startImageX + pxToPercentX(dx);

              image.y = startImageY + pxToPercentY(dy);
            }

            if (action === "resize") {
              image.width = Math.max(3, startWidth + pxToPercentX(dx));

              image.height = Math.max(3, startHeight + pxToPercentY(dy));
            }

            updateImage(image);
          },
          { passive: false },
        );

        element.addEventListener("pointerup", () => {
          if (
            sampler.mode === "edit" &&
            performance.now() - pinchJustEndedAt < 250
          ) {
            action = null;
            return;
          }
          action = null;
        });

        element.addEventListener("pointercancel", () => {
          action = null;
        });

        element.addEventListener("lostpointercapture", () => {
          action = null;
        });
      }

      /* =====================================================
         DELETE
      ===================================================== */

      function deleteSelected() {
        if (sampler.selectedPad) {
          const pad = sampler.selectedPad;

          stopPadHold(pad);

          if (sampler.recordingPad === pad) {
            stopRecording();
          }

          /*
           * 清除這個 PAD 的 inverse。
           */
          clearPadImageInvert(pad);

          if (pad.audioURL) {
            URL.revokeObjectURL(pad.audioURL);
          }

          if (pad.element) {
            pad.element.remove();
          }

          sampler.pads = sampler.pads.filter((p) => p !== pad);

          sampler.selectedPad = null;

          return;
        }

        if (sampler.selectedImage) {
          const image = sampler.selectedImage;

          /*
           * 移除這張圖片上的
           * 所有 inverse overlay。
           */
          if (image.invertOverlays) {
            image.invertOverlays.forEach((overlay) => {
              if (overlay) {
                overlay.remove();
              }
            });

            image.invertOverlays.clear();
          }

          /*
           * 從所有 PAD 的
           * invertedImages 移除。
           */
          sampler.pads.forEach((pad) => {
            if (pad.invertedImages) {
              pad.invertedImages.delete(image);
            }
          });

          if (image.mediaElement && image.mediaType === "video") {
            try {
              image.mediaElement.pause();
              image.mediaElement.removeAttribute("src");
              image.mediaElement.load();
            } catch (error) {}
          }

          if (image.url) {
            URL.revokeObjectURL(image.url);
          }

          if (image.element) {
            image.element.remove();
          }

          sampler.images = sampler.images.filter((img) => img !== image);

          sampler.selectedImage = null;
        }
      }

      deleteButton.addEventListener("click", deleteSelected);

      /* =====================================================
         DELETE KEY
      ===================================================== */

      document.addEventListener("keydown", (event) => {
        if (sampler.mode !== "edit") {
          return;
        }

        if (event.key !== "Delete" && event.key !== "Backspace") {
          return;
        }

        const tag = document.activeElement?.tagName;

        if (tag === "INPUT" || tag === "TEXTAREA") {
          return;
        }

        event.preventDefault();

        deleteSelected();
      });

      /* =====================================================
         PAD RECORDING
      ===================================================== */

      async function startRecording(pad) {
        if (sampler.recordingPad) {
          return;
        }

        try {
          initAudio();

          if (!sampler.mediaStream) {
            sampler.mediaStream = await navigator.mediaDevices.getUserMedia({
              audio: true,
            });
          }

          await resumeAudio();

          if (typeof MediaRecorder === "undefined") {
            throw new Error("MediaRecorder unsupported");
          }

          if (sampler.recordingPad) {
            return;
          }

          const mimeType = getRecordingMimeType();

          const options = mimeType ? { mimeType } : undefined;

          sampler.recordingPad = pad;

          sampler.chunks = [];

          sampler.recorder = new MediaRecorder(sampler.mediaStream, options);

          sampler.recorder.ondataavailable = (event) => {
            if (event.data.size > 0) {
              sampler.chunks.push(event.data);
            }
          };

          sampler.recorder.onstop = async () => {
            try {
              const recorder = sampler.recorder;

              const actualType = recorder?.mimeType || mimeType || "audio/mp4";

              const blob = new Blob(sampler.chunks, {
                type: actualType,
              });

              if (pad.audioURL) {
                URL.revokeObjectURL(pad.audioURL);
              }

              pad.audioURL = URL.createObjectURL(blob);

              const arrayBuffer = await blob.arrayBuffer();

              const decodedBuffer =
                await sampler.audioContext.decodeAudioData(arrayBuffer);

              pad.audioBuffer = trimAudioBuffer(decodedBuffer);

              updatePadStatus(pad, "READY");
            } catch (error) {
              console.error("Audio decode error:", error);

              updatePadStatus(pad, "ERROR");
            }

            sampler.recordingPad = null;

            sampler.recorder = null;

            sampler.chunks = [];
          };

          sampler.recorder.start();

          sampler.recordingStartTime = Date.now();

          clearInterval(sampler.recordingTimer);

          sampler.recordingTimer = setInterval(updateRecordingTimer, 1000);

          pad.element.classList.add("recording");

          updateRecordingText(pad, "● REC 00:00");
        } catch (error) {
          console.error("Recording error:", error);

          sampler.recordingPad = null;

          sampler.recorder = null;

          clearInterval(sampler.recordingTimer);

          sampler.recordingTimer = null;

          if (pad.element) {
            pad.element.classList.remove("recording");
          }

          alert(
            "無法開始錄音。\n\n" + "請確認網站使用 HTTPS，並允許麥克風權限。",
          );
        }
      }

      function updateRecordingTimer() {
        if (!sampler.recordingPad) {
          return;
        }

        const elapsed = Math.floor(
          (Date.now() - sampler.recordingStartTime) / 1000,
        );

        const minutes = String(Math.floor(elapsed / 60)).padStart(2, "0");

        const seconds = String(elapsed % 60).padStart(2, "0");

        updateRecordingText(
          sampler.recordingPad,
          `● REC ${minutes}:${seconds}`,
        );
      }

      function stopRecording() {
        if (!sampler.recorder) {
          return;
        }

        if (sampler.recorder.state !== "inactive") {
          sampler.recorder.stop();
        }

        clearInterval(sampler.recordingTimer);

        sampler.recordingTimer = null;

        if (sampler.recordingPad) {
          sampler.recordingPad.element.classList.remove("recording");
        }
      }

      function updatePadStatus(pad, status) {
        const element = pad.element?.querySelector(".recordStatus");

        if (element) {
          element.textContent = status;
        }
      }

      function updatePadHoldSpeedUI(pad) {
        const element = pad.element?.querySelector(".recordStatus");

        if (!element) {
          return;
        }

        if (!pad.holding) {
          return;
        }

        element.textContent = `RETRIGGER ${Math.round(pad.holdInterval)}ms`;
      }

      function updateRecordingText(pad, text) {
        const element = pad.element?.querySelector(".recordStatus");

        if (element) {
          element.textContent = text;
        }
      }

      /* =====================================================
         PLAY MODE — AUDIO EFFECTS

         操作方式：
         - 中央隱形正方形：完全乾聲 / 原始頻率
         - 正方形左側：Reverb 越往左越重
         - 正方形右側：Distortion 越往右越重
         - 正方形上側：頻率越往上越高
         - 正方形下側：頻率越往下越低
         - 中央正方形不會畫出來，只作為控制基準區
      ===================================================== */

      /*
       * =====================================================
       * RESPONSIVE EFFECT CONTROL
       * =====================================================
       *
       * 原點永遠是「目前 PAD 的中心」。
       *
       * 中央 neutral zone 不再固定 75px，而是依裝置類型調整：
       * - 手機／小型觸控裝置：約 52px × 52px
       * - 桌機／滑鼠：約 44px × 44px
       *
       * EFFECT_X_RANGE / EFFECT_Y_RANGE 也不再是固定 pixel。
       * 它們會依目前 canvas 尺寸重新計算，讓效果區跟著螢幕大小縮放。
       *
       * 注意：這裡只改「座標 → 效果數值」的尺度，
       * 原本 X/Y 的手勢邏輯完全不變：
       * 左 = Reverb、右 = Distortion、上 = 高頻、下 = 低頻。
       */

      function getEffectControlSettings() {
        const width = Math.max(1, canvas.clientWidth);
        const height = Math.max(1, canvas.clientHeight);

        const shortSide = Math.min(width, height);

        const hasCoarsePointer =
          window.matchMedia && window.matchMedia("(pointer: coarse)").matches;

        const mobileUserAgent = /Android|iPhone|iPod|Windows Phone/i.test(
          navigator.userAgent,
        );

        const isSmallTouchDevice =
          (hasCoarsePointer || mobileUserAgent) && shortSide <= 900;

        if (isSmallTouchDevice) {
          /*
           * 手機：中央區稍微比一般手指接觸範圍大一點。
           * 最大效果距離也壓低，避免手機上要拖很遠才到最大值。
           */
          const neutralHalf = 26;

          const xRange = Math.max(120, Math.min(220, width * 0.45));
          const yRange = Math.max(120, Math.min(240, height * 0.45));

          return {
            neutralHalf,
            xRange,
            yRange,
            isSmallTouchDevice: true,
          };
        }

        /*
         * 桌機：使用稍小的中央乾聲區，
         * 並依 canvas 尺寸彈性調整最大效果距離。
         */
        const neutralHalf = 22;

        const xRange = Math.max(260, Math.min(520, width * 0.45));
        const yRange = Math.max(220, Math.min(440, height * 0.45));

        return {
          neutralHalf,
          xRange,
          yRange,
          isSmallTouchDevice: false,
        };
      }

      // 頻率變化範圍。刻意縮小，避免一點點移動就變很多。
      const MIN_PLAYBACK_RATE = 0.72;
      const MAX_PLAYBACK_RATE = 1.38;

      /* =====================================================
         LOOP / AUDIO STABILITY

         最多保留五層 Loop。
         這不是改變時間軸；只是避免無限制建立 scheduler / source。
      ===================================================== */
      const MAX_LOOP_LAYERS = 5;
      const LOOP_POLYPHONY_LIMIT = 6;
      const LOOP_SOURCE_POLYPHONY_LIMIT = 16;

      function getReverbImpulseBuffer() {
        const ctx = sampler.audioContext;
        if (!ctx) {
          return null;
        }

        if (!sampler.reverbImpulseBuffer) {
          sampler.reverbImpulseBuffer = makeReverbImpulse();
        }

        return sampler.reverbImpulseBuffer;
      }

      function makeReverbImpulse(duration = 2.8, decay = 2.2) {
        const ctx = sampler.audioContext;
        const length = Math.max(1, Math.floor(ctx.sampleRate * duration));
        const impulse = ctx.createBuffer(2, length, ctx.sampleRate);

        for (let channel = 0; channel < impulse.numberOfChannels; channel++) {
          const data = impulse.getChannelData(channel);
          for (let i = 0; i < length; i++) {
            const t = i / length;
            data[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, decay);
          }
        }
        return impulse;
      }

      function makeDistortionCurve(amount = 0) {
        const samples = 44100;
        const curve = new Float32Array(samples);

        if (amount <= 0.0001) {
          for (let i = 0; i < samples; i++) {
            curve[i] = (i * 2) / samples - 1;
          }
          return curve;
        }

        // 比上一版更容易聽出來，但仍然保持由左到右漸進。
        const k = 1 + amount * 80;
        for (let i = 0; i < samples; i++) {
          const x = (i * 2) / samples - 1;
          curve[i] = ((1 + k) * x) / (1 + k * Math.abs(x));
        }
        return curve;
      }

      function clamp01(value) {
        return Math.max(0, Math.min(1, Number(value) || 0));
      }

      function getPadEffectState(pad, currentX, currentY) {
        /*
         * 原點 = PAD 中心。
         * pointerdown 時記錄的 holdStartX / holdStartY
         * 就是這次手勢的起點，因此這裡不改原本手勢邏輯。
         */
        const dx = currentX - pad.holdStartX;
        const dy = currentY - pad.holdStartY;

        const settings = getEffectControlSettings();
        const neutralHalf = settings.neutralHalf;
        const effectXRange = settings.xRange;
        const effectYRange = settings.yRange;

        /*
         * 中央隱形方形：
         * |dx| <= neutralHalf 且 |dy| <= neutralHalf
         * 時完全保持乾聲／原始頻率。
         *
         * 這個範圍現在會依裝置大小改變，
         * 但仍然以 PAD 中心為原點。
         */
        const horizontalDistance = Math.max(0, Math.abs(dx) - neutralHalf);
        const verticalDistance = Math.max(0, Math.abs(dy) - neutralHalf);

        // 左邊只增加 Reverb，右邊只增加 Distortion。
        const reverb =
          dx < -neutralHalf ? clamp01(horizontalDistance / effectXRange) : 0;

        const distortion =
          dx > neutralHalf ? clamp01(horizontalDistance / effectXRange) : 0;

        // 上方提高頻率，下方降低頻率。
        let playbackRate = 1;

        if (dy < -neutralHalf) {
          const amount = clamp01(verticalDistance / effectYRange);
          playbackRate = 1 + amount * (MAX_PLAYBACK_RATE - 1);
        } else if (dy > neutralHalf) {
          const amount = clamp01(verticalDistance / effectYRange);
          playbackRate = 1 - amount * (1 - MIN_PLAYBACK_RATE);
        }

        return {
          reverb,
          distortion,
          playbackRate,
        };
      }

      function updatePadEffectState(pad, currentX, currentY) {
        if (!pad || !pad.holding) return;

        const state = getPadEffectState(pad, currentX, currentY);

        pad.holdReverb = state.reverb;
        pad.holdDistortion = state.distortion;
        pad.holdDistortionAmount = state.distortion;
        pad.holdFrequency = state.playbackRate;

        /*
         * VISUAL XY CONTROL — only the PAD intersection is affected.
         * Left  = blur.
         * Right = RGB glitch.
         * Up/Down = inverse flash frequency.
         */
        const dx = currentX - pad.holdStartX;
        const dy = currentY - pad.holdStartY;
        const settings = getEffectControlSettings();
        const horizontalDistance = Math.max(
          0,
          Math.abs(dx) - settings.neutralHalf,
        );
        const verticalDistance = Math.max(
          0,
          Math.abs(dy) - settings.neutralHalf,
        );
        const horizontalAmount = clamp01(horizontalDistance / settings.xRange);
        const verticalAmount = clamp01(verticalDistance / settings.yRange);

        const visualBlur =
          dx < -settings.neutralHalf ? horizontalAmount * 32 : 0;
        const visualGlitch = dx > settings.neutralHalf ? horizontalAmount : 0;

        // 上 = 閃爍變快；下 = 閃爍變慢。
        let visualFlashHz = 0;
        if (dy < -settings.neutralHalf) {
          const amount = clamp01(verticalDistance / settings.yRange);
          visualFlashHz = amount * 10;
        } else if (dy > settings.neutralHalf) {
          const amount = clamp01(verticalDistance / settings.yRange);
          // 往下仍然閃爍，但速度會變慢；最大約每 5 秒一次。
          visualFlashHz = 0.2 + (1 - amount) * 0.8;
        }

        setPadVisualEffect(pad, visualBlur, visualGlitch, visualFlashHz);
        updatePadEffectUI(pad);

        const ctx = sampler.audioContext;
        if (!ctx) return;
        const now = ctx.currentTime;

        /*
         * 不重新建立 source。
         *
         * 這是這版最重要的修正：
         * - 第一次按下產生的聲音就是「目前這一個 source」
         * - 拖曳時直接改它的 playbackRate / distortion / reverb
         * - 因此不會出現「原本乾聲 + 新效果聲」兩個聲音疊在一起
         * - 同時也不需要 stop()，所以音檔會完整播放完
         */

        const smoothing = 0.08;

        if (pad.holdReverbDry) {
          pad.holdReverbDry.gain.cancelScheduledValues(now);
          pad.holdReverbDry.gain.setTargetAtTime(
            Math.max(0.08, 1 - state.reverb * 0.72),
            now,
            smoothing,
          );
        }

        if (pad.holdReverbWet) {
          pad.holdReverbWet.gain.cancelScheduledValues(now);
          pad.holdReverbWet.gain.setTargetAtTime(
            state.reverb * 1.05,
            now,
            smoothing,
          );
        }

        if (pad.holdDistortion) {
          pad.holdDistortion.curve = makeDistortionCurve(state.distortion);
        }

        /* SAFETY MIX 2 — keep PAD loudness more stable as distortion rises. */
        if (pad.holdGain) {
          pad.holdGain.gain.cancelScheduledValues(now);
          pad.holdGain.gain.setTargetAtTime(
            pad.volume * getDistortionCompensation(state.distortion),
            now,
            smoothing,
          );
        }

        if (pad.holdSource) {
          try {
            pad.holdSource.playbackRate.cancelScheduledValues(now);
            pad.holdSource.playbackRate.setTargetAtTime(
              state.playbackRate,
              now,
              smoothing,
            );
          } catch (error) {}
        }
      }

      function updatePadEffectUI(pad) {
        const element = pad.element?.querySelector(".padEffectStatus");
        if (!element || !pad.holding) return;

        const reverb = Math.round(pad.holdReverb * 100);
        const distortion = Math.round(
          (pad.holdDistortion ?? pad.holdDistortionAmount ?? 0) * 100,
        );
        const freq = pad.holdFrequency.toFixed(2);

        if (pad.holdReverb > 0.02) {
          element.textContent = `REVERB ${reverb}%  •  FREQ ${freq}×`;
        } else if (pad.holdDistortion > 0.02) {
          element.textContent = `DIST ${distortion}%  •  FREQ ${freq}×`;
        } else {
          element.textContent = `FREQ ${freq}×`;
        }
      }

      /* =====================================================
         SAFETY MIX 2 — DISTORTION VOLUME COMPENSATION

         Distortion 會增加諧波與主觀音量。
         distortion 越高，這裡就稍微降低該 PAD 的輸出增益，
         讓效果變髒／變密時，不會同時突然變得過大聲。
      ===================================================== */
      function getDistortionCompensation(amount) {
        const distortion = clamp01(amount);
        return 1 - distortion * 0.35;
      }

      /* =====================================================
         SAFETY MIX 4 — PAD POLYPHONY / FADE

         保留原本的自然疊音。
         只有同一個 PAD 同時存在超過 6 個 source 時，
         才把最舊的一個用 15ms fade-out 移除，避免快速 hold / loop
         產生過多重疊聲音。
      ===================================================== */
      function registerPadSource(pad, source, chain, polyphonyLimit = null) {
        if (!pad || !source || !chain) return;

        if (!Array.isArray(pad.activeSources)) {
          pad.activeSources = [];
        }

        const entry = { source, chain };
        pad.activeSources.push(entry);

        const requestedLimit =
          polyphonyLimit !== null
            ? Number(polyphonyLimit)
            : Number(pad.maxPolyphony);

        const maxPolyphony = Math.max(
          1,
          Number.isFinite(requestedLimit) && requestedLimit > 0
            ? requestedLimit
            : LOOP_POLYPHONY_LIMIT,
        );

        while (pad.activeSources.length > maxPolyphony) {
          const oldest = pad.activeSources.shift();
          if (!oldest) break;

          const oldSource = oldest.source;
          const oldGain = oldest.chain?.padGain;
          const ctx = sampler.audioContext;

          try {
            if (oldGain && ctx) {
              const now = ctx.currentTime;
              oldGain.gain.cancelScheduledValues(now);
              oldGain.gain.setValueAtTime(
                Math.max(0.0001, oldGain.gain.value),
                now,
              );
              oldGain.gain.linearRampToValueAtTime(0, now + 0.015);
            }
          } catch (error) {}

          setTimeout(() => {
            try {
              oldSource.stop();
            } catch (error) {}
          }, 20);
        }
      }

      function unregisterPadSource(pad, source) {
        if (!pad || !Array.isArray(pad.activeSources)) return;

        const index = pad.activeSources.findIndex(
          (item) => item.source === source,
        );

        if (index !== -1) {
          pad.activeSources.splice(index, 1);
        }
      }

      /*
       * Loop source 的統一清理。
       *
       * 重要：停止 Loop 時不能只從 sampler.loopSources 移除，
       * 還要同步從 PAD 的 activeSources 移除，否則下一次手動點 PAD
       * 會把已經不存在的舊 source 當成仍在播放。
       */
      function cleanupLoopSource(loop, source, chain = null, pad = null) {
        if (!source) return;

        const actualPad = pad || source.__samplerPad || null;
        const actualChain = chain || source.__samplerChain || null;

        unregisterPadSource(actualPad, source);

        const globalIndex = sampler.loopSources.indexOf(source);
        if (globalIndex !== -1) {
          sampler.loopSources.splice(globalIndex, 1);
        }

        if (loop?.scheduledSources) {
          const loopIndex = loop.scheduledSources.indexOf(source);
          if (loopIndex !== -1) {
            loop.scheduledSources.splice(loopIndex, 1);
          }
        }

        try {
          source.disconnect();
        } catch (error) {}

        disconnectPadAudioChain(actualChain);

        try {
          delete source.__samplerPad;
          delete source.__samplerChain;
        } catch (error) {}
      }

      /* =====================================================
         PLAY MODE — AUDIO CHAIN
      ===================================================== */

      function connectPadAudioChain(source, pad, destination, options = {}) {
        const ctx = sampler.audioContext;

        const playbackRate =
          options.playbackRate !== undefined ? options.playbackRate : 1;

        const reverb =
          options.reverb !== undefined ? clamp01(options.reverb) : 0;

        const distortion =
          options.distortion !== undefined ? clamp01(options.distortion) : 0;

        const padGain = ctx.createGain();

        /* SAFETY MIX 2 — DISTORTION VOLUME COMPENSATION */
        const distortionCompensation = getDistortionCompensation(distortion);
        padGain.gain.value = pad.volume * distortionCompensation;

        const filter = ctx.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.value = 20000;
        filter.Q.value = 0.2;

        const distortionNode = ctx.createWaveShaper();
        distortionNode.oversample = "4x";
        distortionNode.curve = makeDistortionCurve(distortion);

        const dryGain = ctx.createGain();
        const wetGain = ctx.createGain();
        dryGain.gain.value = Math.max(0.08, 1 - reverb * 0.72);
        wetGain.gain.value = reverb * 1.05;

        const convolver = ctx.createConvolver();
        convolver.buffer = getReverbImpulseBuffer();

        /* =====================================================
           SAFETY MIX 3 — REVERB HIGH CUT

           只處理 Reverb 的 wet 路徑；dry 聲音不會被這個 high cut 影響。
           讓 distortion 產生的高頻諧波不會在多層 reverb 疊加後變得刺耳。
        ===================================================== */
        const reverbHighCut = ctx.createBiquadFilter();
        reverbHighCut.type = "lowpass";
        reverbHighCut.frequency.value = 7000;
        reverbHighCut.Q.value = 0.2;

        source.playbackRate.value = playbackRate;

        source.connect(filter);
        filter.connect(distortionNode);

        distortionNode.connect(dryGain);
        dryGain.connect(padGain);

        distortionNode.connect(convolver);
        convolver.connect(reverbHighCut);
        reverbHighCut.connect(wetGain);
        wetGain.connect(padGain);

        padGain.connect(destination);

        return {
          padGain,
          filter,
          distortionNode,
          dryGain,
          wetGain,
          convolver,
          reverbHighCut,
        };
      }

      function disconnectPadAudioChain(chain) {
        if (!chain) return;
        Object.values(chain).forEach((node) => {
          try {
            node.disconnect();
          } catch (error) {}
        });
      }

      /* =====================================================
         PLAY PAD — NORMAL PREVIEW
      ===================================================== */

      function playPad(pad, options = {}) {
        if (!pad.audioBuffer) {
          return null;
        }

        initAudio();

        if (
          sampler.audioContext.state === "suspended" ||
          sampler.audioContext.state === "interrupted"
        ) {
          sampler.audioContext.resume().catch(() => {});
        }

        const source = sampler.audioContext.createBufferSource();

        source.buffer = pad.audioBuffer;

        const chain = connectPadAudioChain(
          source,
          pad,
          options.destination || sampler.masterGain,
          {
            playbackRate:
              options.playbackRate !== undefined
                ? options.playbackRate
                : options.frequency !== undefined
                  ? options.frequency
                  : 1,
            reverb: options.reverb !== undefined ? options.reverb : 0,
            distortion:
              options.distortion !== undefined ? options.distortion : 0,
          },
        );

        const startTime =
          options.startTime !== undefined
            ? options.startTime
            : sampler.audioContext.currentTime;

        /* SAFETY MIX 4 — register every PAD source before it starts. */
        registerPadSource(pad, source, chain);

        source.start(startTime);

        if (pad.element) {
          pad.element.classList.add("playing");
        }

        if (options.isHoldSource) {
          pad.holdSource = source;
          pad.holdGain = chain.padGain;
          pad.holdFilter = chain.filter;
          pad.holdReverbDry = chain.dryGain;
          pad.holdReverbWet = chain.wetGain;
          pad.holdConvolver = chain.convolver;
          pad.holdDistortion = chain.distortionNode;
        }

        source.onended = () => {
          if (pad.element) {
            if (!pad.holding) {
              pad.element.classList.remove("playing");
            }
          }

          if (pad.holdSource === source) {
            pad.holdSource = null;
            pad.holdGain = null;
            pad.holdFilter = null;
            pad.holdReverbDry = null;
            pad.holdReverbWet = null;
            pad.holdConvolver = null;
            pad.holdDistortion = null;
          }

          unregisterPadSource(pad, source);

          try {
            source.disconnect();
          } catch (error) {}

          disconnectPadAudioChain(chain);
        };

        return source;
      }

      /* =====================================================
         LOOP EVENT RECORDING

         第一層：按下 LOOP 開始記錄，放開 LOOP 決定第一個 Loop 的長度。
         第二層以後：Loop 按鈕只是一個「開始收集事件」的開關；
         事件的位置永遠取自「目前正在播放的第一層時間軸」，
         絕不使用這次 LOOP 按鈕按了多久來決定位置或長度。
      ===================================================== */

      async function startLoopRecording() {
        if (sampler.loopRecording || sampler.mode !== "play") {
          return;
        }

        try {
          await resumeAudio();
        } catch (error) {
          console.error(error);
          return;
        }

        const now = sampler.audioContext.currentTime;

        sampler.loopRecording = true;
        sampler.cancelLoopRecording = false;
        sampler.loopEvents = [];

        // 只用來知道這次錄製 session 何時開始。
        // 它不會被拿來當第二層以後的 Loop 時間軸。
        sampler.loopRecordingStartTime = now;

        loopButton.classList.add("recording");
        loopButton.textContent = "REC";
        canvas.classList.add("loopRecording");
      }

      /* =====================================================
         RECORD PAD EVENT

         關鍵：
         - 第一層尚未有 Loop 時長：用第一層錄音開始時間記事件。
         - 第一層已經建立並正在播放：直接用「實際播放時間軸」
           計算現在位於 0 ~ loopDuration 的哪個位置。

         所以如果第一層是 5 秒：
             0 ---- 1 ---- 2 ---- 3 ---- 4 ---- 5
                                      ↑
                                  此刻按 PAD

         第二層不管 LOOP 按鈕按了 0.2 秒、1 秒或 10 秒，
         這個 PAD 都只會被固定在第 3 秒。
      ===================================================== */

      function recordPadEvent(pad) {
        if (!sampler.loopRecording || !pad || !sampler.audioContext) {
          return;
        }

        const now = sampler.audioContext.currentTime;

        let time;

        if (
          sampler.loopDuration !== null &&
          sampler.loopDuration > 0 &&
          sampler.loopMasterStartTime !== null
        ) {
          // 已經有播放中的 master Loop：以「播放起點」為唯一時間軸。
          const elapsed = now - sampler.loopMasterStartTime;
          const duration = sampler.loopDuration;

          time = ((elapsed % duration) + duration) % duration;

          // 只處理極小的 AudioContext 浮點誤差。
          const epsilon = 0.0005;
          if (time < epsilon || duration - time < epsilon) {
            time = 0;
          }
        } else {
          // 第一層：它本身負責建立 Loop 長度。
          const recordingStart = sampler.loopRecordingStartTime;
          if (recordingStart === null) {
            return;
          }
          time = Math.max(0, now - recordingStart);
        }

        sampler.loopEvents.push({
          pad: pad,
          time: time,
          playbackRate: pad.holdFrequency ?? 1,
          reverb: pad.holdReverb ?? 0,
          distortion: pad.holdDistortion ?? pad.holdDistortionAmount ?? 0,
        });
      }

      /* =====================================================
         STOP LOOP RECORDING
      ===================================================== */

      function stopLoopRecording() {
        if (!sampler.loopRecording) {
          return;
        }

        sampler.loopRecording = false;
        loopButton.classList.remove("recording");
        loopButton.textContent = "LOOP";
        canvas.classList.remove("loopRecording");

        if (sampler.cancelLoopRecording) {
          sampler.cancelLoopRecording = false;
          sampler.loopEvents = [];
          sampler.loopRecordingStartTime = null;
          return;
        }

        finishLoopRecording();
      }

      /* =====================================================
         FINISH LOOP

         只有第一層的「按下 → 放開」時間差會決定 Loop 長度。
         第二層以後完全忽略自己的錄製時長；它們只有事件位置。
      ===================================================== */

      function finishLoopRecording() {
        const events = sampler.loopEvents.map((event) => ({
          pad: event.pad,
          time: event.time,
          playbackRate: event.playbackRate ?? 1,
          reverb: event.reverb ?? 0,
          distortion: event.distortion ?? 0,
        }));

        const recordingStart = sampler.loopRecordingStartTime;
        const recordingEndTime = sampler.audioContext.currentTime;

        sampler.loopEvents = [];
        sampler.loopRecordingStartTime = null;

        if (recordingStart === null) {
          return;
        }

        // 只有第一層決定 duration。
        if (sampler.loopDuration === null) {
          sampler.loopDuration = Math.max(
            0.05,
            recordingEndTime - recordingStart,
          );
          updateLoopDurationUI();
        }

        const duration = sampler.loopDuration;

        if (!events.length) {
          console.warn("Loop contains no Pad events.");
          return;
        }

        if (sampler.loops.length >= MAX_LOOP_LAYERS) {
          console.warn(`Maximum ${MAX_LOOP_LAYERS} Loop layers reached.`);
          sampler.loopEvents = [];
          renderLoopLayers();
          return;
        }

        // 第一層的 event 是以 recordingStart 計算；
        // 第二層以後的 event 已經是 master playback timeline 的位置。
        const normalizedEvents = events
          .map((event) => {
            let time = event.time;

            if (duration > 0) {
              time = ((time % duration) + duration) % duration;

              const epsilon = 0.0005;
              if (time < epsilon || duration - time < epsilon) {
                time = 0;
              }
            } else {
              time = 0;
            }

            return { ...event, time };
          })
          .filter((event) => event.time >= 0 && event.time < duration);

        if (!normalizedEvents.length) {
          console.warn("Loop contains no valid Pad events.");
          return;
        }

        const loop = {
          id: sampler.nextLoopId++,
          duration: duration,
          events: normalizedEvents,
          muted: false,
          scheduledSources: [],
          gain: null,
          schedulerTimer: null,
          schedulerGeneration: 0,
          schedulerActive: false,
          startTime: null,
        };

        sampler.loops.push(loop);
        renderLoopLayers();
        startLoopScheduler(loop);
      }

      /* =====================================================
         STOP ONE LOOP
      ===================================================== */

      function stopLoopScheduler(loop) {
        if (!loop) {
          return;
        }

        loop.schedulerGeneration++;
        loop.schedulerActive = false;

        if (loop.schedulerTimer !== null) {
          clearTimeout(loop.schedulerTimer);
          loop.schedulerTimer = null;
        }

        if (loop.scheduledSources && loop.scheduledSources.length) {
          const sources = loop.scheduledSources.slice();

          sources.forEach((source) => {
            try {
              source.onended = null;
            } catch (error) {}

            const pad = source.__samplerPad || null;
            const chain = source.__samplerChain || null;

            try {
              source.stop();
            } catch (error) {}

            cleanupLoopSource(loop, source, chain, pad);
          });
        }

        loop.scheduledSources = [];

        if (loop.gain) {
          try {
            loop.gain.disconnect();
          } catch (error) {}
        }

        loop.gain = null;
        loop.startTime = null;
      }

      /* =====================================================
         STOP ALL LOOP SOURCES
      ===================================================== */

      function stopAllLoopSources() {
        sampler.loops.forEach((loop) => {
          stopLoopScheduler(loop);
        });

        // 防止 scheduler 之外殘留的 source 留在全域陣列。
        const leftovers = sampler.loopSources.slice();

        leftovers.forEach((source) => {
          try {
            source.onended = null;
          } catch (error) {}

          const pad = source.__samplerPad || null;
          const chain = source.__samplerChain || null;

          try {
            source.stop();
          } catch (error) {}

          cleanupLoopSource(null, source, chain, pad);
        });

        sampler.loopSources = [];
      }

      /* =====================================================
         START ONE LOOP
      ===================================================== */

      function startLoopScheduler(loop) {
        if (!loop || !sampler.loops.includes(loop) || !loop.events.length) {
          return;
        }

        initAudio();

        if (
          sampler.audioContext.state === "suspended" ||
          sampler.audioContext.state === "interrupted"
        ) {
          sampler.audioContext.resume().catch(() => {});
        }

        if (loop.schedulerActive) {
          return;
        }

        if (!sampler.loopDuration || sampler.loopDuration <= 0) {
          return;
        }

        loop.schedulerGeneration++;
        const generation = loop.schedulerGeneration;
        loop.schedulerActive = true;

        const gain = sampler.audioContext.createGain();
        gain.gain.setValueAtTime(
          loop.muted ? 0 : 1,
          sampler.audioContext.currentTime,
        );
        gain.connect(sampler.masterGain);
        loop.gain = gain;

        const now = sampler.audioContext.currentTime;
        const duration = sampler.loopDuration;

        /*
         * 第一層第一次開始播放時，才建立「真正的播放時間軸」。
         * 這點很重要：之後所有 Layer 的事件位置都是相對於
         * 這個實際開始播放的時間，而不是相對於各自按 LOOP 的時間。
         */
        if (sampler.loopMasterStartTime === null) {
          const firstStart = now + 0.05;
          sampler.loopMasterStartTime = firstStart;

          loop.startTime = firstStart;
          scheduleLoopCycle(loop, firstStart, generation);
          return;
        }

        /*
         * 已經存在播放中的 master clock。
         * 找到 master timeline 上「下一個共同循環邊界」。
         * 不重新設定 master clock，因此新 Layer 不會漂移。
         */
        const masterStart = sampler.loopMasterStartTime;
        const safety = 0.05;
        const targetTime = now + safety;

        let cycleIndex = Math.ceil((targetTime - masterStart) / duration);
        if (!Number.isFinite(cycleIndex)) {
          cycleIndex = 0;
        }
        if (cycleIndex < 0) {
          cycleIndex = 0;
        }

        const cycleStartTime = masterStart + cycleIndex * duration;

        loop.startTime = cycleStartTime;
        scheduleLoopCycle(loop, cycleStartTime, generation);
      }

      /* =====================================================
         LOOP CYCLE
      ===================================================== */

      function scheduleLoopCycle(loop, cycleStartTime, generation) {
        if (!loop.schedulerActive) {
          return;
        }

        if (loop.schedulerGeneration !== generation) {
          return;
        }

        if (!sampler.loops.includes(loop)) {
          return;
        }

        if (sampler.mode !== "play") {
          return;
        }

        if (!loop.events.length) {
          return;
        }

        if (!loop.gain) {
          return;
        }

        loop.events.forEach((event) => {
          if (!event.pad || !event.pad.audioBuffer) {
            return;
          }

          const source = sampler.audioContext.createBufferSource();

          source.buffer = event.pad.audioBuffer;

          const chain = connectPadAudioChain(source, event.pad, loop.gain, {
            playbackRate: event.playbackRate ?? 1,
            reverb: event.reverb ?? 0,
            distortion: event.distortion ?? 0,
          });

          const startTime = cycleStartTime + event.time;

          if (startTime < sampler.audioContext.currentTime) {
            try {
              source.disconnect();
            } catch (error) {}

            try {
              disconnectPadAudioChain(chain);
            } catch (error) {}

            return;
          }

          /*
           * Loop source 也必須進入 PAD polyphony 管理。
           * 這是穩定性的關鍵：五層 Loop 長時間循環時，
           * 同一個 PAD 不會無限制累積重疊 source。
           */
          source.__samplerPad = event.pad;
          source.__samplerChain = chain;

          registerPadSource(
            event.pad,
            source,
            chain,
            LOOP_SOURCE_POLYPHONY_LIMIT,
          );

          source.onended = () => {
            cleanupLoopSource(loop, source, chain, event.pad);
          };

          source.start(startTime);

          sampler.loopSources.push(source);
          loop.scheduledSources.push(source);
        });

        const nextCycle = cycleStartTime + loop.duration;

        const delay = Math.max(
          10,
          (nextCycle - sampler.audioContext.currentTime - 0.05) * 1000,
        );

        loop.schedulerTimer = setTimeout(() => {
          loop.schedulerTimer = null;

          if (!loop.schedulerActive) {
            return;
          }

          if (loop.schedulerGeneration !== generation) {
            return;
          }

          if (!sampler.loops.includes(loop)) {
            return;
          }

          if (sampler.mode !== "play") {
            return;
          }

          scheduleLoopCycle(loop, nextCycle, generation);
        }, delay);
      }

      /* =====================================================
         LEGACY COMPATIBILITY
      ===================================================== */

      function restartAllLoops() {
        if (!sampler.loops.length) {
          return;
        }

        stopAllLoopSources();

        sampler.loops.forEach((loop) => {
          startLoopScheduler(loop);
        });
      }

      /* =====================================================
         LOOP LAYERS
      ===================================================== */

      function renderLoopLayers() {
        loopLayers.innerHTML = "";

        sampler.loops.forEach((loop) => {
          const layer = document.createElement("div");

          layer.className = "loopLayer";

          if (loop.muted) {
            layer.classList.add("muted");
          }

          const name = document.createElement("div");

          name.className = "loopLayerName";

          name.textContent = `LOOP ${loop.id}`;

          const muteButton = document.createElement("button");

          muteButton.className = "muteButton";

          muteButton.textContent = loop.muted ? "MUTED" : "MUTE";

          if (loop.muted) {
            muteButton.classList.add("active");
          }

          muteButton.addEventListener("click", (event) => {
            event.stopPropagation();

            toggleLoopMute(loop);
          });

          layer.appendChild(name);

          layer.appendChild(muteButton);

          loopLayers.appendChild(layer);
        });

        if (sampler.loops.length > 0) {
          resetLoopButton.classList.add("visible");
        } else {
          resetLoopButton.classList.remove("visible");
        }
      }

      /* =====================================================
         MUTE
      ===================================================== */

      function toggleLoopMute(loop) {
        loop.muted = !loop.muted;

        if (loop.gain) {
          const now = sampler.audioContext.currentTime;

          loop.gain.gain.cancelScheduledValues(now);

          loop.gain.gain.setValueAtTime(loop.muted ? 0 : 1, now);
        }

        renderLoopLayers();
      }

      /* =====================================================
         LOOP DURATION UI
      ===================================================== */

      function updateLoopDurationUI() {
        const element = document.querySelector(".loopDuration");

        if (!sampler.loopDuration) {
          element.textContent = "LOOP: —";

          return;
        }

        element.textContent = `LOOP: ${sampler.loopDuration.toFixed(2)}s`;
      }

      /* =====================================================
         RESET LOOP
      ===================================================== */

      function resetLoops() {
        stopAllLoopSources();

        sampler.loops = [];

        sampler.nextLoopId = 1;

        sampler.loopDuration = null;

        sampler.loopMasterStartTime = null;

        sampler.loopRecording = false;

        sampler.loopRecordingStartTime = null;

        sampler.loopRecordingPointerId = null;

        sampler.loopPressing = false;

        sampler.spacePressed = false;

        sampler.loopEvents = [];

        sampler.cancelLoopRecording = false;

        sampler.loopSchedulerTimers.clear();

        sampler.loopSchedulerGeneration.clear();

        loopButton.classList.remove("recording");

        loopButton.textContent = "LOOP";

        canvas.classList.remove("loopRecording");

        updateLoopDurationUI();

        renderLoopLayers();
      }

      resetLoopButton.addEventListener("click", (event) => {
        event.preventDefault();

        event.stopPropagation();

        resetLoops();
      });

      /* =====================================================
         LOOP BUTTON — POINTER DOWN
      ===================================================== */

      loopButton.addEventListener(
        "pointerdown",
        async (event) => {
          if (sampler.mode !== "play") {
            return;
          }

          event.preventDefault();

          try {
            loopButton.setPointerCapture(event.pointerId);
          } catch (error) {}

          sampler.loopPressing = true;

          sampler.loopRecordingPointerId = event.pointerId;

          await startLoopRecording();
        },
        { passive: false },
      );

      /* =====================================================
         LOOP BUTTON — POINTER UP
      ===================================================== */

      loopButton.addEventListener(
        "pointerup",
        (event) => {
          if (sampler.loopRecordingPointerId !== event.pointerId) {
            return;
          }

          event.preventDefault();

          sampler.loopPressing = false;

          sampler.loopRecordingPointerId = null;

          stopLoopRecording();
        },
        { passive: false },
      );

      /* =====================================================
         POINTER CANCEL
      ===================================================== */

      loopButton.addEventListener("pointercancel", () => {
        sampler.loopPressing = false;

        sampler.loopRecordingPointerId = null;

        stopLoopRecording();
      });

      /* =====================================================
         LOST POINTER CAPTURE
      ===================================================== */

      loopButton.addEventListener("lostpointercapture", () => {
        if (sampler.loopPressing) {
          sampler.loopPressing = false;

          stopLoopRecording();
        }
      });

      /* =====================================================
         SPACE
      ===================================================== */

      document.addEventListener("keydown", (event) => {
        if (sampler.mode !== "play") {
          return;
        }

        if (event.code !== "Space") {
          return;
        }

        event.preventDefault();

        if (event.repeat || sampler.spacePressed) {
          return;
        }

        sampler.spacePressed = true;

        startLoopRecording();
      });

      document.addEventListener("keyup", (event) => {
        if (event.code !== "Space") {
          return;
        }

        event.preventDefault();

        sampler.spacePressed = false;

        if (sampler.mode === "play") {
          stopLoopRecording();
        }
      });

      /* =====================================================
         PLAY MODE
      ===================================================== */

      async function enablePlayMode() {
        if (sampler.recordingPad) {
          stopRecording();
        }

        sampler.mode = "play";

        clearSelection();

        canvas.classList.add("playMode");

        editModeButton.classList.remove("active");

        playModeButton.classList.add("active");

        addPadButton.style.display = "none";

        addImageButton.style.display = "none";

        importPadButton.style.display = "none";

        renamePadButton.style.display = "none";

        deleteButton.style.display = "none";
        backgroundColorButton.style.display = "none";
        backgroundImageButton.style.display = "none";
        clearBackgroundButton.style.display = "none";

        document.body.classList.add("playMode");

        loopArea.style.display = "flex";

        try {
          await resumeAudio();

          setMasterVolume(sampler.masterVolume);

          /*
           * 進入 PLAY MODE 時，
           * 如果有既有 hold 狀態，
           * 重新建立 inverse。
           */
          refreshAllPadImageInverts();

          if (sampler.loops.length > 0) {
            sampler.loops.forEach((loop) => {
              startLoopScheduler(loop);
            });
          }
        } catch (error) {
          console.error(error);
        }
      }

      /* =====================================================
         EDIT MODE
      ===================================================== */

      function enableEditMode() {
        /*
         * 停止所有長按 PAD。
         */
        stopAllPadHolds();

        /*
         * 清除所有 inverse overlay。
         */
        sampler.pads.forEach(clearPadImageInvert);

        if (sampler.loopRecording) {
          sampler.cancelLoopRecording = true;

          sampler.loopPressing = false;

          stopLoopRecording();
        }

        stopAllLoopSources();

        sampler.mode = "edit";

        removeAllPlayPointers();

        sampler.spacePressed = false;

        sampler.loopPressing = false;

        canvas.classList.remove("playMode");

        canvas.classList.remove("loopRecording");

        document.body.classList.remove("playMode");

        loopButton.classList.remove("recording");

        loopButton.textContent = "LOOP";

        loopArea.style.display = "none";

        editModeButton.classList.add("active");

        playModeButton.classList.remove("active");

        addPadButton.style.display = "block";

        addImageButton.style.display = "block";

        importPadButton.style.display = "block";

        renamePadButton.style.display = "block";

        deleteButton.style.display = "block";
        backgroundColorButton.style.display = "block";
        backgroundImageButton.style.display = "block";
        clearBackgroundButton.style.display = "block";
      }

      /* =====================================================
         MODE BUTTONS
      ===================================================== */

      editModeButton.addEventListener("click", enableEditMode);

      playModeButton.addEventListener("click", enablePlayMode);

      /* =====================================================
         ADD PAD
      ===================================================== */

      addPadButton.addEventListener("click", () => {
        if (sampler.mode !== "edit") {
          return;
        }

        createPad(10 + Math.random() * 50, 10 + Math.random() * 50);
      });

      /* =====================================================
         WINDOW RESIZE
      ===================================================== */

      window.addEventListener("resize", () => {
        sampler.pads.forEach(updatePad);

        sampler.images.forEach(updateImage);

        /*
         * window 尺寸改變後，
         * PAD / IMAGE 的實際 pixel
         * rectangle 都會改變。
         *
         * 所以重新計算 inverse。
         */
        refreshAllPadImageInverts();
      });

      /* =====================================================
         FULLSCREEN
         優先使用標準 Fullscreen API；Safari/WebKit 則使用前綴版本。
         注意：iPhone Safari 目前仍不允許一般網頁把「整個互動頁面」
         透過 element.requestFullscreen() 真正全螢幕，因此那裡會保留瀏覽器 UI。
      ===================================================== */

      function getFullscreenElement() {
        return (
          document.fullscreenElement ||
          document.webkitFullscreenElement ||
          document.mozFullScreenElement ||
          document.msFullscreenElement ||
          null
        );
      }

      async function enterFullscreen() {
        const element = document.documentElement;

        try {
          if (element.requestFullscreen) {
            await element.requestFullscreen({ navigationUI: "hide" });
            return true;
          }

          if (element.webkitRequestFullscreen) {
            element.webkitRequestFullscreen();
            return true;
          }

          if (element.mozRequestFullScreen) {
            element.mozRequestFullScreen();
            return true;
          }

          if (element.msRequestFullscreen) {
            element.msRequestFullscreen();
            return true;
          }
        } catch (error) {
          // 使用者拒絕或瀏覽器限制時，不中斷 sampler。
          console.warn("Fullscreen request was rejected:", error);
        }

        return false;
      }

      async function exitFullscreen() {
        try {
          if (document.exitFullscreen) {
            await document.exitFullscreen();
            return;
          }

          if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
            return;
          }

          if (document.mozCancelFullScreen) {
            document.mozCancelFullScreen();
            return;
          }

          if (document.msExitFullscreen) {
            document.msExitFullscreen();
          }
        } catch (error) {
          console.warn("Fullscreen exit failed:", error);
        }
      }

      function updateFullscreenButton() {
        const active = !!getFullscreenElement();
        fullscreenButton.classList.toggle("isFullscreen", active);
        fullscreenButton.textContent = active ? "" : "FULL";
        fullscreenButton.setAttribute(
          "aria-label",
          active ? "Exit fullscreen" : "Enter fullscreen",
        );
        fullscreenButton.title = active ? "EXIT FULLSCREEN" : "FULLSCREEN";
      }

      fullscreenButton.addEventListener("click", async (event) => {
        event.preventDefault();
        event.stopPropagation();

        if (getFullscreenElement()) {
          await exitFullscreen();
        } else {
          await enterFullscreen();
        }

        updateFullscreenButton();
      });

      document.addEventListener("fullscreenchange", updateFullscreenButton);
      document.addEventListener(
        "webkitfullscreenchange",
        updateFullscreenButton,
      );
      document.addEventListener("mozfullscreenchange", updateFullscreenButton);
      document.addEventListener("MSFullscreenChange", updateFullscreenButton);

      updateFullscreenButton();

      /* =====================================================
         PAGE VISIBILITY
      ===================================================== */

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          stopAllPadHolds();

          if (sampler.mode === "play") {
            stopAllLoopSources();
          }
        }

        if (
          !document.hidden &&
          sampler.mode === "play" &&
          sampler.loops.length > 0
        ) {
          resumeAudio().then(() => {
            sampler.loops.forEach((loop) => {
              startLoopScheduler(loop);
            });
          });
        }
      });

      /* =====================================================
         WINDOW BLUR
      ===================================================== */

      window.addEventListener("blur", () => {
        stopAllPadHolds();
      });

      /* =====================================================
         INITIAL PADS
      ===================================================== */

      createPad(10, 10);

      createPad(32, 18);

      /* =====================================================
         INITIAL LOOP UI
      ===================================================== */

      renderLoopLayers();

      updateLoopDurationUI();

      setMasterVolume(1);
    </script>
  </body>
</html>
