<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Visual Sampler</title>
    <style>
      * {
        box-sizing: border-box;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background: #fff;
        color: #000;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-text-size-adjust: 100%;
      }
      button,
      input {
        font-family: inherit;
      }
      button {
        touch-action: none;
      }
      .toolbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 60px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 15px;
        background: transparent;
        z-index: 1000;
        overflow: hidden;
        touch-action: none;
        mix-blend-mode: difference;
      }
      .toolbar * {
        mix-blend-mode: normal !important;
      }
      .toolbarActions {
        margin-left: auto;
        min-width: 0;
        max-width: calc(100% - 105px);
        height: 100%;
        display: flex;
        align-items: center;
        gap: 8px;
        overflow-x: auto;
        overflow-y: hidden;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
        touch-action: pan-x;
        flex-shrink: 1;
      }
      .toolbarActions::-webkit-scrollbar {
        display: none;
      }
      .toolbarActions > * {
        flex-shrink: 0;
      }
      button,
      label {
        flex-shrink: 0;
        border: 1px solid #fff;
        background: transparent;
        color: #fff;
        border-radius: 0;
        padding: 8px 14px;
        font-size: 14px;
        cursor: pointer;
      }
      button:hover,
      label:hover {
        background: #fff;
        color: #000;
      }
      button:active,
      label:active {
        transform: scale(0.94);
      }
      .toolbar button:hover,
      .loopArea button:hover {
        background: #fff !important;
        color: #000 !important;
      }
      .backgroundButton {
        display: none;
        padding: 8px 14px;
        font-size: 14px;
        color: #fff;
        cursor: pointer;
        line-height: normal;
      }
      body:not(.playMode) .backgroundButton {
        display: block;
      }
      #imageInput,
      #audioInput,
      #backgroundImageInput {
        position: fixed;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }
      #backgroundColorInput {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }
      #canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        overflow: hidden;
        background: #fff;
        touch-action: none;
      }
      #canvasBackground {
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
        background: #fff;
      }
      #canvasBackground img,
      #canvasBackground video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: fill;
        pointer-events: none;
      }
      .imageItem {
        position: absolute;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        touch-action: none;
        cursor: pointer;
        z-index: 2;
      }
      .imageItem.selected {
        outline: 2px dashed #fff;
        outline-offset: 2px;
      }
      .imageMedia {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: fill;
        pointer-events: none;
      }
      .imageInvertOverlay {
        position: absolute;
        pointer-events: none;
        z-index: 4;
        overflow: hidden;
        background: #fff;
        mix-blend-mode: difference;
        touch-action: none;
        --flash-duration: 1s;
      }
      .imageInvertOverlay.visualFlash {
        animation: padInverseFlash var(--flash-duration) steps(1, end) infinite;
      }
      @keyframes padInverseFlash {
        0%,
        49% {
          opacity: 1;
        }
        50%,
        100% {
          opacity: 0;
        }
      }
      .padVisualBlur {
        position: absolute;
        inset: 0;
        z-index: 5;
        width: 100%;
        height: 100%;
        display: block;
        pointer-events: none;
        opacity: 0;
        filter: blur(0px) invert(1);
        -webkit-filter: blur(0px) invert(1);
        transform: scale(1.04);
        transform-origin: center;
        will-change: filter, opacity;
      }
      .padVisualGlitch {
        position: absolute;
        inset: 0;
        z-index: 6;
        width: 100%;
        height: 100%;
        pointer-events: none;
        overflow: hidden;
        mix-blend-mode: normal;
        opacity: 0;
        will-change: transform, opacity;
        clip-path: inset(0);
      }
      .padVisualGlitchCanvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        image-rendering: auto;
      }
      .imageResizeHandle {
        position: absolute;
        width: 14px;
        height: 14px;
        right: -2px;
        bottom: -2px;
        background: #fff;
        cursor: nwse-resize;
        z-index: 5;
        mix-blend-mode: difference;
      }
      .pad {
        position: absolute;
        width: 15%;
        height: 15%;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        background: transparent;
        border: 2px solid #fff;
        border-radius: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        touch-action: none;
        cursor: pointer;
        z-index: 10;
        mix-blend-mode: difference;
      }
      .pad.selected {
        border: 4px solid #fff;
      }
      .pad.recording {
        border: 3px dashed #fff;
      }
      .pad.playing,
      .pad.holding {
        transform: scale(0.96);
      }
      .padContent {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        pointer-events: none;
        color: #fff;
        padding: 8px;
        mix-blend-mode: difference;
      }
      .padName {
        font-size: 16px;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .recordStatus {
        margin-top: 6px;
        font-size: 12px;
        opacity: 0.7;
      }
      .padEffectStatus {
        position: absolute;
        left: 8px;
        right: 8px;
        top: 6px;
        text-align: center;
        font-size: 10px;
        color: #fff;
        opacity: 0.75;
        pointer-events: none;
        mix-blend-mode: difference;
      }
      .padControls {
        position: absolute;
        left: 8px;
        right: 8px;
        bottom: 7px;
        display: flex;
        align-items: center;
        gap: 6px;
        z-index: 20;
        pointer-events: auto;
        touch-action: none;
      }
      .padVolumeLabel,
      .padVolumeValue {
        font-size: 10px;
        color: #fff;
      }
      .padVolumeValue {
        width: 34px;
        text-align: right;
      }
      .padVolume {
        flex: 1;
        min-width: 0;
        height: 18px;
        appearance: none;
        -webkit-appearance: none;
        background: transparent;
      }
      .padVolume::-webkit-slider-runnable-track,
      #masterVolumeSlider::-webkit-slider-runnable-track {
        height: 2px;
        background: #fff;
      }
      .padVolume::-webkit-slider-thumb,
      #masterVolumeSlider::-webkit-slider-thumb {
        appearance: none;
        -webkit-appearance: none;
        width: 10px;
        height: 10px;
        margin-top: -4px;
        border: 0;
        border-radius: 50%;
        background: #fff;
      }
      .padVolume::-moz-range-track,
      #masterVolumeSlider::-moz-range-track {
        height: 2px;
        background: #fff;
      }
      .padVolume::-moz-range-thumb,
      #masterVolumeSlider::-moz-range-thumb {
        width: 14px;
        height: 14px;
        border: 0;
        border-radius: 50%;
        background: #fff;
      }
      #canvas.playMode .padControls {
        display: none;
      }
      .resizeHandle {
        position: absolute;
        width: 10px;
        height: 10px;
        right: -2px;
        bottom: -2px;
        background: #fff;
        cursor: nwse-resize;
        z-index: 30;
        mix-blend-mode: difference;
      }
      #canvas.playMode .resizeHandle,
      #canvas.playMode .imageResizeHandle,
      #canvas.playMode .recordStatus {
        display: none;
      }
      #pointerOverlayLayer {
        position: fixed;
        inset: 0;
        z-index: 5000;
        pointer-events: none;
        overflow: hidden;
      }
      .playPointer {
        position: fixed;
        left: 0;
        top: 0;
        width: 34px;
        height: 34px;
        pointer-events: none;
        opacity: 0;
        transform: translate3d(-100px, -100px, 0);
        will-change: transform, opacity;
        transform-origin: top left;
        transition: opacity 90ms ease-out;
        z-index: 2;
        mix-blend-mode: difference;
      }
      .playPointer.visible {
        opacity: 1;
      }
      .playPointer.fadeOut {
        opacity: 0;
        transition: opacity 140ms ease-out;
      }
      .playPointer img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        filter: invert(1);
        pointer-events: none;
      }
      body:not(.playMode) #pointerOverlayLayer {
        display: none;
      }
      .loopArea {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        min-height: 72px;
        padding: 10px 15px calc(10px + env(safe-area-inset-bottom));
        display: none;
        align-items: center;
        gap: 15px;
        background: transparent;
        color: #fff;
        z-index: 2000;
        transform: translateZ(0);
        touch-action: none;
        mix-blend-mode: difference;
      }
      .loopArea * {
        mix-blend-mode: normal !important;
      }
      body.playMode .loopArea {
        display: flex;
      }
      .masterVolume {
        width: 150px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 4px;
      }
      .masterHeader {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 11px;
      }
      .masterValue {
        font-size: 11px;
        opacity: 0.65;
      }
      #masterVolumeSlider {
        width: 100%;
        height: 18px;
        appearance: none;
        -webkit-appearance: none;
        background: transparent;
        border: 0;
      }
      .loopButton {
        width: 80px;
        height: 48px;
        padding: 0;
        font-size: 14px;
        line-height: 1;
        white-space: nowrap;
        overflow: hidden;
        border: 2px solid #fff;
        background: transparent;
        color: #fff;
      }
      .loopButton.recording::before {
        content: "● ";
      }
      .resetLoopButton {
        height: 48px;
        padding: 0 12px;
        font-size: 12px;
        border: 1px solid #fff;
        background: transparent;
        color: #fff;
        display: none;
      }
      .resetLoopButton.visible {
        display: block;
      }
      .loopInfo {
        width: 100px;
        font-size: 12px;
        line-height: 1.5;
      }
      .loopDuration {
        font-size: 13px;
      }
      .loopHint {
        opacity: 0.5;
      }
      .loopLayers {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 8px;
        overflow-x: auto;
        scrollbar-width: none;
        touch-action: pan-x;
      }
      .loopLayer {
        min-width: 105px;
        height: 48px;
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 5px 7px;
        border: 1px solid #fff;
        background: transparent;
        color: #fff;
        flex-shrink: 0;
      }
      .loopLayer.muted {
        opacity: 0.35;
      }
      .loopLayerName {
        flex: 1;
        min-width: 0;
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .muteButton {
        padding: 5px 7px;
        font-size: 11px;
        border: 1px solid #fff;
        background: transparent;
        color: #fff;
      }
      .loopRecordingIndicator {
        position: fixed;
        left: 50%;
        bottom: calc(85px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        padding: 7px 12px;
        background: transparent;
        color: #fff;
        font-size: 12px;
        z-index: 2100;
        display: none;
        pointer-events: none;
        mix-blend-mode: difference;
      }
      #canvas.loopRecording .loopRecordingIndicator {
        display: block;
      }
      .help {
        position: absolute;
        left: 15px;
        bottom: 15px;
        font-size: 12px;
        color: #fff;
        opacity: 0.6;
        pointer-events: none;
        z-index: 50;
        mix-blend-mode: difference;
      }
      #canvas.playMode .help {
        display: none;
      }
      .fullscreenButton {
        position: fixed;
        right: 14px;
        bottom: 14px;
        z-index: 10000;
        width: 46px;
        height: 46px;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid #fff;
        background: transparent;
        color: #fff;
        font-size: 10px;
        cursor: pointer;
        mix-blend-mode: difference;
      }
      .fullscreenButton:hover {
        background: #fff;
        color: #000;
      }
      .fullscreenButton:active {
        transform: scale(0.94);
      }
      .fullscreenButton.isFullscreen {
        font-size: 0;
      }
      .fullscreenButton.isFullscreen:before {
        content: "×";
        font-size: 20px;
        font-weight: 300;
      }
      body.playMode .toolbar,
      body.playMode .loopArea,
      body.playMode .fullscreenButton {
        opacity: 0.6;
      }
      body.playMode,
      body.playMode * {
        -webkit-user-select: none !important;
        user-select: none !important;
        -webkit-touch-callout: none !important;
        -webkit-user-drag: none !important;
      }
      body.playMode img,
      body.playMode video {
        pointer-events: none !important;
        -webkit-user-drag: none !important;
      }
      :fullscreen {
        width: 100vw !important;
        height: 100vh !important;
        height: 100dvh !important;
        overflow: hidden !important;
      }
      :-webkit-full-screen {
        width: 100vw !important;
        height: 100vh !important;
        overflow: hidden !important;
      }
      @media (max-width: 800px) {
        .toolbar {
          gap: 6px;
          padding-left: 10px;
          padding-right: 10px;
        }
        .toolbarActions {
          max-width: calc(100% - 96px);
          gap: 6px;
        }
        .loopArea {
          min-height: 82px;
          padding-left: 10px;
          padding-right: 10px;
          gap: 8px;
        }
        .masterVolume {
          width: 120px;
        }
        .loopButton {
          width: 76px;
        }
        .loopInfo {
          width: 85px;
        }
        .loopLayer {
          min-width: 100px;
        }
      }
      @media (max-width: 500px) {
        .loopInfo {
          display: none;
        }
        .masterVolume {
          width: 105px;
        }
        .loopArea {
          gap: 6px;
        }
        .fullscreenButton {
          right: 10px;
          bottom: calc(10px + env(safe-area-inset-bottom));
          width: 42px;
          height: 42px;
        }
      }
    </style>
  </head>
  <body>
    <!-- =====================================================
         TOOLBAR
    ===================================================== -->

    <div class="toolbar">
      <button id="editMode" class="modeButton active">EDIT</button>

      <button id="playMode" class="modeButton">PLAY</button>

      <div class="toolbarActions">
        <button id="addPad">+ PAD</button>

        <button id="importPad">IMPORT PAD</button>

        <button id="addImage">+ IMAGE</button>

        <button id="renamePad">RENAME</button>

        <button id="deleteButton">DELETE</button>

        <label
          id="backgroundColorButton"
          class="backgroundButton"
          for="backgroundColorInput"
        >
          BG COLOR
        </label>
        <button id="backgroundImageButton" class="backgroundButton">
          BG MEDIA
        </button>
        <button id="clearBackgroundButton" class="backgroundButton">
          CLEAR BG
        </button>

        <input type="color" id="backgroundColorInput" value="#ffffff" />
        <input
          type="file"
          id="backgroundImageInput"
          accept="image/*,video/*,.heic,.heif,.mp4,.mov,.webm,.m4v"
        />

        <input
          type="file"
          id="audioInput"
          accept="
          .mp3,
          .m4a,
          .wav,
          .aac,
          .aiff,
          .aif,
          .mp4,
          audio/mpeg,
          audio/mp4,
          audio/wav,
          audio/x-wav,
          audio/aac,
          audio/aiff
        "
          multiple
        />

        <input
          type="file"
          id="imageInput"
          accept="image/*,.heic,.heif,video/*,.mp4,.webm,.mov,.m4v"
          multiple
        />
      </div>
    </div>

    <!-- =====================================================
         FULLSCREEN BUTTON
    ===================================================== -->
    <button
      id="fullscreenButton"
      class="fullscreenButton"
      type="button"
      aria-label="Toggle fullscreen"
      title="FULLSCREEN"
    >
      FULL
    </button>

    <!-- =====================================================
         CANVAS
    ===================================================== -->

    <div id="canvas">
      <div id="canvasBackground" aria-hidden="true"></div>
      <!-- =====================================================

      <div class="help">
        EDIT：單點預覽・雙擊錄音・拖曳移動・右下角調整大小・PLAY：長按 PAD，左右
        Reverb/Distortion，上下 Frequency
      </div>
    ===================================================== -->

      <div class="loopRecordingIndicator">● RECORDING LOOP</div>
    </div>

    <!-- =====================================================
           PLAY MODE — MULTI POINTER CURSOR LAYER
      ===================================================== -->
    <div id="pointerOverlayLayer" aria-hidden="true"></div>

    <!-- =====================================================
         LOOP AREA
    ===================================================== -->

    <div class="loopArea">
      <div class="masterVolume">
        <div class="masterHeader">
          <span class="masterLabel">MASTER</span>
          <span id="masterVolumeValue" class="masterValue"> 100% </span>
        </div>

        <input
          type="range"
          id="masterVolumeSlider"
          min="0"
          max="1"
          step="0.01"
          value="1"
        />
      </div>

      <button id="loopButton" class="loopButton">LOOP</button>

      <button id="resetLoopButton" class="resetLoopButton">RESET LOOP</button>

      <div class="loopInfo">
        <div class="loopDuration">LOOP: —</div>

        <div class="loopHint">Hold to record</div>
      </div>

      <div id="loopLayers" class="loopLayers"></div>
    </div>

    <!-- =====================================================
         HEIC / HEIF SUPPORT

         heic2any converts HEIC/HEIF locally in the browser to a
         browser-friendly JPEG. The original file is not uploaded.
      ===================================================== -->
    <script src="https://cdn.jsdelivr.net/npm/heic-to@1.5.2/dist/iife/heic-to.js"></script>

    <script>
      /* =====================================================
         SAMPLER STATE
      ===================================================== */

      const sampler = {
        mode: "edit",

        pads: [],

        selectedPad: null,

        images: [],

        selectedImage: null,

        backgroundColor: "#ffffff",
        backgroundImageURL: null,
        backgroundImageElement: null,

        nextPadId: 1,

        nextImageId: 1,

        audioContext: null,

        masterGain: null,

        /* =====================================================
           AUDIO RESOURCE CACHE

           Reuse the same reverb impulse buffer instead of generating a
           brand-new 2.8s stereo impulse for every Loop event.
           This does not change the reverb sound; it only avoids needless
           memory / CPU allocation during long sessions.
        ===================================================== */
        reverbImpulseBuffer: null,

        /* =====================================================
           SAFETY MIX 1 — MASTER COMPRESSOR + LIMITER
           ===================================================== */
        masterCompressor: null,
        masterLimiter: null,

        masterVolume: 1,

        mediaStream: null,

        recorder: null,

        recordingPad: null,

        chunks: [],

        recordingTimer: null,

        recordingStartTime: null,

        /* -------------------------
           LOOP
        ------------------------- */

        loops: [],

        nextLoopId: 1,

        loopRecording: false,

        loopRecordingStartTime: null,

        /*
         * 所有 Loop 共用的「第一層 Loop 時間軸」起點。
         * 第一層建立後就固定，不會因為第二／第三層按下 LOOP
         * 的時間而重新開始計算。
         */
        loopMasterStartTime: null,

        loopRecordingPointerId: null,

        loopDuration: null,

        loopSources: [],

        loopPressing: false,

        spacePressed: false,

        cancelLoopRecording: false,

        loopEvents: [],

        loopSchedulerTimers: new Map(),

        loopSchedulerGeneration: new Map(),
      };

      /* =====================================================
         DOM
      ===================================================== */

      const canvas = document.getElementById("canvas");
      const pointerOverlayLayer = document.getElementById(
        "pointerOverlayLayer",
      );

      const editModeButton = document.getElementById("editMode");

      const playModeButton = document.getElementById("playMode");

      const addPadButton = document.getElementById("addPad");

      const addImageButton = document.getElementById("addImage");

      const importPadButton = document.getElementById("importPad");

      const renamePadButton = document.getElementById("renamePad");

      const deleteButton = document.getElementById("deleteButton");

      const backgroundColorButton = document.getElementById(
        "backgroundColorButton",
      );
      const backgroundImageButton = document.getElementById(
        "backgroundImageButton",
      );
      const clearBackgroundButton = document.getElementById(
        "clearBackgroundButton",
      );
      const backgroundColorInput = document.getElementById(
        "backgroundColorInput",
      );
      const backgroundImageInput = document.getElementById(
        "backgroundImageInput",
      );
      const canvasBackground = document.getElementById("canvasBackground");

      const imageInput = document.getElementById("imageInput");

      const audioInput = document.getElementById("audioInput");

      const loopButton = document.getElementById("loopButton");

      const resetLoopButton = document.getElementById("resetLoopButton");

      const loopLayers = document.getElementById("loopLayers");

      const loopArea = document.querySelector(".loopArea");
      const fullscreenButton = document.getElementById("fullscreenButton");

      const masterVolumeSlider = document.getElementById("masterVolumeSlider");

      const masterVolumeValue = document.getElementById("masterVolumeValue");

      /* =====================================================
         PLAY MODE — MULTI POINTER CURSOR
      ===================================================== */

      const playPointers = new Map();
      const POINTER_CURSOR_SIZE = 34;
      const POINTER_MAX_SIZE = 110;
      const POINTER_GROW_DURATION = 5000;

      function createPlayPointer(pointerId) {
        if (playPointers.has(pointerId)) {
          return playPointers.get(pointerId);
        }

        const cursor = document.createElement("div");
        cursor.className = "playPointer";

        const cursorImage = document.createElement("img");
        cursorImage.src = "mouse.gif";
        cursorImage.alt = "";
        cursorImage.draggable = false;
        cursor.appendChild(cursorImage);

        pointerOverlayLayer.appendChild(cursor);

        const pointer = {
          cursor,
          x: -100,
          y: -100,
          visible: false,
          active: false,
          fadeTimer: null,
          pressStartTime: 0,
          growAnimationFrame: null,
        };

        playPointers.set(pointerId, pointer);
        return pointer;
      }

      function positionPlayPointerElement(
        element,
        x,
        y,
        size = POINTER_CURSOR_SIZE,
      ) {
        // 讓 mouse.gif 的「中心」對準實際滑鼠／手指位置
        element.style.transform = `
    translate3d(${x - size / 2}px, ${y - size / 2}px, 0)
    scale(${size / POINTER_CURSOR_SIZE})
  `;
      }

      function updatePlayPointerSize(pointer) {
        if (!pointer || !pointer.active) return;

        const elapsed = Math.max(0, performance.now() - pointer.pressStartTime);
        const progress = Math.min(1, elapsed / POINTER_GROW_DURATION);

        // 使用 ease-out：剛開始變化較明顯，接近 5 秒時慢慢接近最大值。
        const eased = 1 - Math.pow(1 - progress, 2);
        const size =
          POINTER_CURSOR_SIZE +
          (POINTER_MAX_SIZE - POINTER_CURSOR_SIZE) * eased;

        pointer.currentSize = size;
        positionPlayPointerElement(pointer.cursor, pointer.x, pointer.y, size);

        if (progress < 1 && pointer.active) {
          pointer.growAnimationFrame = requestAnimationFrame(() =>
            updatePlayPointerSize(pointer),
          );
        } else {
          pointer.growAnimationFrame = null;
        }
      }

      function showPlayPointer(pointerId, x, y) {
        if (sampler.mode !== "play") {
          return;
        }

        const pointer = createPlayPointer(pointerId);

        if (pointer.fadeTimer) {
          clearTimeout(pointer.fadeTimer);
          pointer.fadeTimer = null;
        }

        pointer.x = x;
        pointer.y = y;

        // 只有第一次按下才重新開始 0 → 最大尺寸的計時。
        if (!pointer.active) {
          pointer.active = true;
          pointer.pressStartTime = performance.now();
          pointer.currentSize = POINTER_CURSOR_SIZE;

          if (pointer.growAnimationFrame) {
            cancelAnimationFrame(pointer.growAnimationFrame);
          }
          pointer.growAnimationFrame = null;
        }

        positionPlayPointerElement(
          pointer.cursor,
          x,
          y,
          pointer.currentSize || POINTER_CURSOR_SIZE,
        );

        pointer.cursor.classList.remove("fadeOut");
        pointer.cursor.classList.add("visible");
        pointer.visible = true;

        // 長按期間持續更新大小；5 秒後維持最大尺寸。
        if (!pointer.growAnimationFrame) {
          updatePlayPointerSize(pointer);
        }
      }

      function hidePlayPointer(pointerId) {
        const pointer = playPointers.get(pointerId);
        if (!pointer) {
          return;
        }

        pointer.active = false;
        pointer.visible = false;

        if (pointer.growAnimationFrame) {
          cancelAnimationFrame(pointer.growAnimationFrame);
          pointer.growAnimationFrame = null;
        }

        pointer.cursor.classList.remove("visible");
        pointer.cursor.classList.add("fadeOut");

        if (pointer.fadeTimer) {
          clearTimeout(pointer.fadeTimer);
        }

        pointer.fadeTimer = setTimeout(() => {
          if (!playPointers.has(pointerId)) {
            return;
          }

          // 放開後移到畫面外，確保之後沒有任何滑鼠 hover 時仍顯示。
          pointer.cursor.style.transform = "translate3d(-100px, -100px, 0)";
          pointer.fadeTimer = null;
        }, 160);
      }

      function hideAllPlayPointers() {
        playPointers.forEach((_, pointerId) => {
          hidePlayPointer(pointerId);
        });
      }

      function removeAllPlayPointers() {
        playPointers.forEach((pointer) => {
          if (pointer.fadeTimer) {
            clearTimeout(pointer.fadeTimer);
          }
          if (pointer.growAnimationFrame) {
            cancelAnimationFrame(pointer.growAnimationFrame);
          }
          pointer.cursor.remove();
        });
        playPointers.clear();
      }

      /* =====================================================
         PLAY MODE — POINTER CURSOR

         游標只在「按下 → 長按 → 長按拖曳」期間顯示。
         放開／取消後快速淡出。

         使用 Pointer Events，因此：
         - 電腦滑鼠 = 一個 pointer
         - 一根手指 = 一個 pointer
         - 三根手指 = 三個獨立 mouse.png
         - 每個 pointer 都有自己的 active 狀態

         特別注意：pointerup 之後的普通滑鼠移動不會重新顯示游標。
      ===================================================== */
      document.addEventListener(
        "pointerdown",
        (event) => {
          if (sampler.mode !== "play") {
            return;
          }

          showPlayPointer(event.pointerId, event.clientX, event.clientY);
        },
        { passive: true },
      );

      document.addEventListener(
        "pointermove",
        (event) => {
          if (sampler.mode !== "play") {
            return;
          }

          const pointer = playPointers.get(event.pointerId);

          // 沒有按住時完全不顯示 mouse。
          if (!pointer || !pointer.active) {
            return;
          }

          showPlayPointer(event.pointerId, event.clientX, event.clientY);
        },
        { passive: true },
      );

      document.addEventListener(
        "pointerup",
        (event) => {
          if (sampler.mode !== "play") {
            return;
          }

          hidePlayPointer(event.pointerId);
        },
        { passive: true },
      );

      document.addEventListener(
        "pointercancel",
        (event) => {
          if (sampler.mode !== "play") {
            return;
          }

          hidePlayPointer(event.pointerId);
        },
        { passive: true },
      );

      window.addEventListener("blur", () => {
        hideAllPlayPointers();
      });

      /* =====================================================
         MOBILE PLAY MODE — DISABLE TEXT SELECTION / SHARE UI
      ===================================================== */

      ["contextmenu", "selectstart", "dragstart", "copy", "cut"].forEach(
        (type) => {
          document.addEventListener(
            type,
            (event) => {
              if (sampler.mode === "play") {
                event.preventDefault();
              }
            },
            { passive: false },
          );
        },
      );

      document.addEventListener(
        "gesturestart",
        (event) => {
          if (sampler.mode === "play") {
            event.preventDefault();
          }
        },
        { passive: false },
      );

      /* =====================================================
         EDIT MODE — TWO-FINGER PINCH TO RESIZE SELECTED PAD / IMAGE
      ===================================================== */

      const editTouchPointers = new Map();
      let pinchState = null;
      let pinchJustEndedAt = 0;

      function getPinchDistance(a, b) {
        return Math.hypot(b.x - a.x, b.y - a.y);
      }

      function getPinchTargetFromElement(element) {
        if (!element) return null;
        if (element.classList.contains("pad"))
          return { type: "pad", object: sampler.selectedPad, element };
        if (element.classList.contains("imageItem"))
          return { type: "image", object: sampler.selectedImage, element };
        return null;
      }

      function beginPinchIfPossible() {
        if (sampler.mode !== "edit" || editTouchPointers.size < 2 || pinchState)
          return;

        const points = Array.from(editTouchPointers.values());
        const first = points[0];
        const second = points[1];
        if (!first.target || first.target !== second.target) return;

        const target = first.target;
        if (!target.object || target.object.element !== target.element) return;

        const object = target.object;
        const centerX =
          target.type === "pad"
            ? object.x + object.width / 2
            : object.x + object.width / 2;
        const centerY =
          target.type === "pad"
            ? object.y + object.height / 2
            : object.y + object.height / 2;

        pinchState = {
          target,
          ids: [first.id, second.id],
          startDistance: Math.max(1, getPinchDistance(first, second)),
          startWidth: object.width,
          startHeight: object.height,
          centerX,
          centerY,
        };

        if (target.type === "pad") {
          selectPad(object);
        } else {
          selectImage(object);
        }
      }

      function updatePinch() {
        if (!pinchState) return;
        const a = editTouchPointers.get(pinchState.ids[0]);
        const b = editTouchPointers.get(pinchState.ids[1]);
        if (!a || !b) return;

        const distance = Math.max(1, getPinchDistance(a, b));
        const scale = distance / pinchState.startDistance;
        const object = pinchState.target.object;

        object.width = Math.max(
          3,
          Math.min(200, pinchState.startWidth * scale),
        );
        object.height = Math.max(
          3,
          Math.min(200, pinchState.startHeight * scale),
        );
        object.x = pinchState.centerX - object.width / 2;
        object.y = pinchState.centerY - object.height / 2;

        if (pinchState.target.type === "pad") {
          updatePad(object);
        } else {
          updateImage(object);
        }
      }

      document.addEventListener(
        "pointerdown",
        (event) => {
          if (sampler.mode !== "edit" || event.pointerType !== "touch") return;
          const element = event.target.closest?.(".pad, .imageItem");
          if (!element) return;

          if (
            element.classList.contains("pad") &&
            event.target.closest(".padControls")
          )
            return;
          const target = getPinchTargetFromElement(element);
          if (!target) return;

          editTouchPointers.set(event.pointerId, {
            id: event.pointerId,
            x: event.clientX,
            y: event.clientY,
            target,
          });
          beginPinchIfPossible();
        },
        { passive: false, capture: true },
      );

      document.addEventListener(
        "pointermove",
        (event) => {
          const point = editTouchPointers.get(event.pointerId);
          if (!point) return;
          point.x = event.clientX;
          point.y = event.clientY;
          if (pinchState && pinchState.ids.includes(event.pointerId)) {
            event.preventDefault();
            updatePinch();
          }
        },
        { passive: false, capture: true },
      );

      function endEditTouchPointer(event) {
        editTouchPointers.delete(event.pointerId);
        if (pinchState && pinchState.ids.includes(event.pointerId)) {
          pinchState = null;
          pinchJustEndedAt = performance.now();
        }
      }

      document.addEventListener("pointerup", endEditTouchPointer, {
        capture: true,
      });
      document.addEventListener("pointercancel", endEditTouchPointer, {
        capture: true,
      });

      /* =====================================================
         SETTINGS
      ===================================================== */

      const CLICK_TIME = 250;

      const DRAG_THRESHOLD = 5;

      const DOUBLE_TAP_TIME = 350;

      const TRIM_THRESHOLD = 0.02;

      const TRIM_PADDING = 0.015;

      const MIN_TRIM_DURATION = 0.02;

      /* =====================================================
         TABLET / MOBILE GESTURE LOCK
      ===================================================== */

      document.addEventListener(
        "selectstart",
        (event) => {
          event.preventDefault();
        },
        { passive: false },
      );

      document.addEventListener(
        "contextmenu",
        (event) => {
          event.preventDefault();
        },
        { passive: false },
      );

      document.addEventListener(
        "gesturestart",
        (event) => {
          event.preventDefault();
        },
        { passive: false },
      );

      document.addEventListener(
        "gesturechange",
        (event) => {
          event.preventDefault();
        },
        { passive: false },
      );

      document.addEventListener(
        "gestureend",
        (event) => {
          event.preventDefault();
        },
        { passive: false },
      );

      document.addEventListener(
        "dblclick",
        (event) => {
          event.preventDefault();
        },
        { passive: false },
      );

      document.addEventListener(
        "touchstart",
        (event) => {
          if (event.touches.length > 1) {
            event.preventDefault();
          }
        },
        { passive: false },
      );

      document.addEventListener(
        "touchmove",
        (event) => {
          if (event.touches.length > 1) {
            event.preventDefault();
          }
        },
        { passive: false },
      );

      /* =====================================================
         PERCENT HELPERS
      ===================================================== */

      function pxToPercentX(px) {
        return (px / canvas.clientWidth) * 100;
      }

      function pxToPercentY(px) {
        return (px / canvas.clientHeight) * 100;
      }

      /* =====================================================
         SELECTION
      ===================================================== */

      function clearSelection() {
        sampler.pads.forEach((pad) => {
          if (pad.element) {
            pad.element.classList.remove("selected");
          }
        });

        sampler.images.forEach((image) => {
          if (image.element) {
            image.element.classList.remove("selected");
          }
        });

        sampler.selectedPad = null;

        sampler.selectedImage = null;
      }

      function selectPad(pad) {
        clearSelection();

        sampler.selectedPad = pad;

        if (pad.element) {
          pad.element.classList.add("selected");
        }
      }

      function selectImage(image) {
        clearSelection();

        sampler.selectedImage = image;

        if (image.element) {
          image.element.classList.add("selected");
        }
      }

      /* =====================================================
         AUDIO
      ===================================================== */

      function initAudio() {
        if (!sampler.audioContext) {
          const AudioContextClass =
            window.AudioContext || window.webkitAudioContext;

          if (!AudioContextClass) {
            throw new Error("Web Audio API unsupported");
          }

          sampler.audioContext = new AudioContextClass();
          sampler.audioContext.addEventListener(
            "statechange",
            handleAudioContextStateChange,
          );
        }

        if (!sampler.masterGain) {
          sampler.masterGain = sampler.audioContext.createGain();

          sampler.masterGain.gain.value = sampler.masterVolume;

          /* =====================================================
             SAFETY MIX 1 — MASTER COMPRESSOR + LIMITER

             所有 PAD / LOOP 都先進 masterGain，
             再經過輕度 Compressor 與最後一道 Limiter。
             只在整體峰值過高時介入，不改變原本 PAD / LOOP 的播放邏輯。
          ===================================================== */
          sampler.masterCompressor =
            sampler.audioContext.createDynamicsCompressor();
          sampler.masterCompressor.threshold.value = -18;
          sampler.masterCompressor.knee.value = 12;
          sampler.masterCompressor.ratio.value = 2.5;
          sampler.masterCompressor.attack.value = 0.01;
          sampler.masterCompressor.release.value = 0.15;

          sampler.masterLimiter =
            sampler.audioContext.createDynamicsCompressor();
          sampler.masterLimiter.threshold.value = -1;
          sampler.masterLimiter.knee.value = 0;
          sampler.masterLimiter.ratio.value = 20;
          sampler.masterLimiter.attack.value = 0.001;
          sampler.masterLimiter.release.value = 0.08;

          sampler.masterGain.connect(sampler.masterCompressor);
          sampler.masterCompressor.connect(sampler.masterLimiter);
          sampler.masterLimiter.connect(sampler.audioContext.destination);
        }
      }

      async function resumeAudio() {
        initAudio();

        if (sampler.audioContext.state === "suspended") {
          await sampler.audioContext.resume();
        }

        // 某些瀏覽器在長時間 Web Audio 使用後可能暫時進入 interrupted。
        // 使用者下一次互動時再次要求 resume，不改變原本播放內容。
        if (sampler.audioContext.state === "interrupted") {
          try {
            await sampler.audioContext.resume();
          } catch (error) {}
        }
      }

      /*
       * 只在瀏覽器把 AudioContext 暫停 / interrupted 時嘗試恢復。
       * 不重建 AudioContext，避免既有 AudioBuffer 因跨 context 而失效。
       */
      function handleAudioContextStateChange() {
        if (!sampler.audioContext) return;

        if (
          sampler.mode === "play" &&
          (sampler.audioContext.state === "suspended" ||
            sampler.audioContext.state === "interrupted")
        ) {
          sampler.audioContext.resume().catch(() => {});
        }
      }

      /* =====================================================
         MASTER VOLUME
      ===================================================== */

      function setMasterVolume(value) {
        const volume = Math.max(0, Math.min(1, Number(value)));

        sampler.masterVolume = volume;

        masterVolumeSlider.value = volume;

        masterVolumeValue.textContent = Math.round(volume * 100) + "%";

        if (sampler.masterGain && sampler.audioContext) {
          const now = sampler.audioContext.currentTime;

          sampler.masterGain.gain.cancelScheduledValues(now);

          sampler.masterGain.gain.setTargetAtTime(volume, now, 0.01);
        }
      }

      masterVolumeSlider.addEventListener("input", (event) => {
        event.stopPropagation();

        setMasterVolume(event.target.value);
      });

      masterVolumeSlider.addEventListener("pointerdown", (event) => {
        event.stopPropagation();
      });

      /* =====================================================
         RECORDING MIME
      ===================================================== */

      function getRecordingMimeType() {
        const types = [
          "audio/mp4",
          "audio/webm;codecs=opus",
          "audio/webm",
          "audio/ogg;codecs=opus",
        ];

        for (const type of types) {
          if (
            typeof MediaRecorder !== "undefined" &&
            MediaRecorder.isTypeSupported &&
            MediaRecorder.isTypeSupported(type)
          ) {
            return type;
          }
        }

        return "";
      }

      /* =====================================================
         AUTO TRIM
      ===================================================== */

      function trimAudioBuffer(
        audioBuffer,
        threshold = TRIM_THRESHOLD,
        padding = TRIM_PADDING,
      ) {
        if (!audioBuffer) {
          return null;
        }

        const sampleRate = audioBuffer.sampleRate;

        const length = audioBuffer.length;

        const channels = audioBuffer.numberOfChannels;

        if (length === 0) {
          return audioBuffer;
        }

        let startSample = -1;

        for (let i = 0; i < length; i++) {
          let amplitude = 0;

          for (let channel = 0; channel < channels; channel++) {
            const data = audioBuffer.getChannelData(channel);

            amplitude = Math.max(amplitude, Math.abs(data[i]));
          }

          if (amplitude >= threshold) {
            startSample = i;

            break;
          }
        }

        if (startSample === -1) {
          return audioBuffer;
        }

        let endSample = -1;

        for (let i = length - 1; i >= 0; i--) {
          let amplitude = 0;

          for (let channel = 0; channel < channels; channel++) {
            const data = audioBuffer.getChannelData(channel);

            amplitude = Math.max(amplitude, Math.abs(data[i]));
          }

          if (amplitude >= threshold) {
            endSample = i;

            break;
          }
        }

        if (endSample === -1) {
          return audioBuffer;
        }

        const paddingSamples = Math.floor(padding * sampleRate);

        startSample = Math.max(0, startSample - paddingSamples);

        endSample = Math.min(length - 1, endSample + paddingSamples);

        const trimmedLength = endSample - startSample + 1;

        if (trimmedLength < sampleRate * MIN_TRIM_DURATION) {
          return audioBuffer;
        }

        if (startSample === 0 && endSample === length - 1) {
          return audioBuffer;
        }

        const trimmedBuffer = sampler.audioContext.createBuffer(
          channels,
          trimmedLength,
          sampleRate,
        );

        for (let channel = 0; channel < channels; channel++) {
          const sourceData = audioBuffer.getChannelData(channel);

          const targetData = trimmedBuffer.getChannelData(channel);

          targetData.set(sourceData.slice(startSample, endSample + 1));
        }

        console.log("Audio trimmed:", {
          originalDuration: audioBuffer.duration,

          trimmedDuration: trimmedBuffer.duration,
        });

        return trimmedBuffer;
      }

      /* =====================================================
         CREATE PAD
      ===================================================== */

      function createPad(x = 10, y = 10) {
        const id = sampler.nextPadId++;

        const pad = {
          id,

          name: `PAD ${id}`,

          x,

          y,

          width: 15,

          height: 15,

          audioURL: null,

          audioBuffer: null,

          volume: 1,

          element: null,

          lastTapTime: 0,

          pendingDoubleTap: false,

          holdSource: null,

          holdGain: null,

          /* =====================================================
             SAFETY MIX 4 — PAD POLYPHONY / FADE
             ===================================================== */
          activeSources: [],
          maxPolyphony: LOOP_POLYPHONY_LIMIT,

          holding: false,

          holdPointerId: null,

          holdStartY: 0,

          holdInterval: 600,

          holdLastTriggerTime: 0,

          holdRAF: null,

          holdNextTriggerIn: 600,

          /*
           * 目前這個 PAD 正在讓哪些圖片
           * 建立 inverse overlay。
           */
          invertedImages: new Set(),

          holdTimer: null,

          holdGeneration: 0,

          // 是否已離開中央乾聲區；第一次進入效果區時會立即換掉原本的乾聲 source。
          holdEffectZoneActive: false,

          // VISUAL EFFECTS
          visualBlur: 0,
          visualGlitch: 0,
          visualFlashHz: 0,
          visualFrame: null,
          visualLastFrameTime: 0,
          visualGlitchElements: new Map(),
        };

        sampler.pads.push(pad);

        renderPad(pad);

        selectPad(pad);

        return pad;
      }

      /* =====================================================
         IMPORT PAD
      ===================================================== */

      importPadButton.addEventListener("click", () => {
        if (sampler.mode !== "edit") {
          return;
        }

        audioInput.value = "";

        audioInput.click();
      });

      /* =====================================================
         AUDIO INPUT
      ===================================================== */

      audioInput.addEventListener("change", async (event) => {
        const files = Array.from(event.target.files || []);

        if (!files.length) {
          return;
        }

        for (const file of files) {
          await importAudioFileAsPad(file);
        }

        audioInput.value = "";
      });

      /* =====================================================
         IMPORT AUDIO FILE
      ===================================================== */

      async function importAudioFileAsPad(file) {
        if (!file) {
          return;
        }

        let pad = null;

        try {
          pad = createPad(10 + Math.random() * 50, 10 + Math.random() * 50);

          updatePadStatus(pad, "LOADING");

          pad.audioURL = URL.createObjectURL(file);

          initAudio();

          const arrayBuffer = await file.arrayBuffer();

          const decodedBuffer =
            await sampler.audioContext.decodeAudioData(arrayBuffer);

          pad.audioBuffer = trimAudioBuffer(decodedBuffer);

          updatePadStatus(pad, "READY");

          selectPad(pad);
        } catch (error) {
          console.error("Import audio error:", error);

          if (pad) {
            if (pad.audioURL) {
              URL.revokeObjectURL(pad.audioURL);
            }

            if (pad.element) {
              pad.element.remove();
            }

            sampler.pads = sampler.pads.filter((p) => p !== pad);

            if (sampler.selectedPad === pad) {
              sampler.selectedPad = null;
            }
          }

          alert(
            "無法匯入這個音檔。\n\n" +
              "請確認這是 MP3、M4A、WAV 或其他瀏覽器支援的音訊檔案。",
          );
        }
      }

      /* =====================================================
         RENDER PAD
      ===================================================== */

      function renderPad(pad) {
        const element = document.createElement("div");

        element.className = "pad";

        const content = document.createElement("div");

        content.className = "padContent";

        const name = document.createElement("div");

        name.className = "padName";

        name.textContent = pad.name;

        const status = document.createElement("div");

        status.className = "recordStatus";

        status.textContent = "NO SOUND";

        content.appendChild(name);

        content.appendChild(status);

        /* -------------------------
           PAD volume
        ------------------------- */

        const controls = document.createElement("div");

        controls.className = "padControls";

        const label = document.createElement("span");

        label.className = "padVolumeLabel";

        label.textContent = "VOL";

        const slider = document.createElement("input");

        slider.type = "range";

        slider.className = "padVolume";

        slider.min = "0";

        slider.max = "1";

        slider.step = "0.01";

        slider.value = pad.volume;

        const value = document.createElement("span");

        value.className = "padVolumeValue";

        value.textContent = Math.round(pad.volume * 100) + "%";

        controls.appendChild(label);

        controls.appendChild(slider);

        controls.appendChild(value);

        controls.addEventListener("pointerdown", (event) => {
          event.stopPropagation();
        });

        controls.addEventListener("pointermove", (event) => {
          event.stopPropagation();
        });

        controls.addEventListener("pointerup", (event) => {
          event.stopPropagation();
        });

        controls.addEventListener("click", (event) => {
          event.stopPropagation();
        });

        slider.addEventListener("input", (event) => {
          event.stopPropagation();

          setPadVolume(pad, event.target.value);
        });

        element.appendChild(content);

        element.appendChild(controls);

        const resizeHandle = document.createElement("div");

        resizeHandle.className = "resizeHandle";

        element.appendChild(resizeHandle);

        canvas.appendChild(element);

        pad.element = element;

        updatePad(pad);

        setupPadInteraction(pad, element, resizeHandle);
      }

      /* =====================================================
         PAD VOLUME
      ===================================================== */

      function setPadVolume(pad, value) {
        const volume = Math.max(0, Math.min(1, Number(value)));

        pad.volume = volume;

        if (!pad.element) {
          return;
        }

        const slider = pad.element.querySelector(".padVolume");

        const valueElement = pad.element.querySelector(".padVolumeValue");

        if (slider) {
          slider.value = volume;
        }

        if (valueElement) {
          valueElement.textContent = Math.round(volume * 100) + "%";
        }

        if (pad.holdGain) {
          const distortion =
            pad.holdDistortionAmount ?? pad.holdDistortion ?? 0;
          const compensatedVolume =
            volume * getDistortionCompensation(distortion);

          pad.holdGain.gain.setTargetAtTime(
            compensatedVolume,
            sampler.audioContext.currentTime,
            0.01,
          );
        }
      }

      /* =====================================================
         UPDATE PAD
      ===================================================== */

      function updatePad(pad) {
        if (!pad.element) {
          return;
        }

        pad.element.style.left = pad.x + "%";

        pad.element.style.top = pad.y + "%";

        pad.element.style.width = pad.width + "%";

        pad.element.style.height = pad.height + "%";

        /*
         * 如果 PLAY MODE 有 PAD 正在作用，
         * 尺寸改變後重新計算 inverse。
         */
        if (sampler.mode === "play" && pad.holding) {
          refreshAllPadImageInverts();
        }
      }

      /* =====================================================
         RENAME
      ===================================================== */

      function renameSelectedPad() {
        const pad = sampler.selectedPad;

        if (!pad) {
          alert("請先選取一個 PAD。");

          return;
        }

        const newName = window.prompt("輸入 PAD 名稱：", pad.name);

        if (newName === null) {
          return;
        }

        const trimmed = newName.trim();

        if (!trimmed) {
          return;
        }

        pad.name = trimmed;

        const nameElement = pad.element.querySelector(".padName");

        if (nameElement) {
          nameElement.textContent = pad.name;
        }
      }

      renamePadButton.addEventListener("click", renameSelectedPad);

      /* =====================================================
         PLAY MODE — PAD IMAGE INVERT
      ===================================================== */

      /*
       * 判斷兩個 DOM rectangle 是否有實際重疊。
       */
      function rectanglesOverlap(a, b) {
        return (
          a.left < b.right &&
          a.right > b.left &&
          a.top < b.bottom &&
          a.bottom > b.top
        );
      }

      /*
       * 找出 PAD 實際碰到的圖片。
       */
      function getImagesUnderPad(pad) {
        if (!pad || !pad.element) {
          return [];
        }

        const padRect = pad.element.getBoundingClientRect();

        return sampler.images.filter((image) => {
          if (!image.element) {
            return false;
          }

          const imageRect = image.element.getBoundingClientRect();

          return rectanglesOverlap(padRect, imageRect);
        });
      }

      /*
       * 移除某張圖片上，
       * 某一個 PAD 所建立的 inverse overlay。
       */
      function removeImageInvertOverlay(image, pad) {
        if (!image || !image.invertOverlays) {
          return;
        }

        const overlay = image.invertOverlays.get(pad);

        if (overlay) {
          if (overlay._glitchElement) {
            overlay._glitchElement.remove();
          }
          overlay.remove();
        }

        image.invertOverlays.delete(pad);
      }

      /*
       * =====================================================
       * CREATE IMAGE INVERT OVERLAY
       * =====================================================
       *
       * 核心：
       *
       *     IMAGE ∩ PAD
       *
       * 只在實際交集區域建立 overlay。
       */
      function createImageInvertOverlay(image, pad) {
        if (!image || !image.element || !pad || !pad.element) return null;

        removeImageInvertOverlay(image, pad);

        const imageRect = image.element.getBoundingClientRect();
        const padRect = pad.element.getBoundingClientRect();

        const intersectionLeft = Math.max(imageRect.left, padRect.left);
        const intersectionTop = Math.max(imageRect.top, padRect.top);
        const intersectionRight = Math.min(imageRect.right, padRect.right);
        const intersectionBottom = Math.min(imageRect.bottom, padRect.bottom);
        const intersectionWidth = intersectionRight - intersectionLeft;
        const intersectionHeight = intersectionBottom - intersectionTop;

        if (intersectionWidth <= 0 || intersectionHeight <= 0) return null;

        const overlay = document.createElement("div");
        overlay.className = "imageInvertOverlay";
        overlay.style.left = intersectionLeft - imageRect.left + "px";
        overlay.style.top = intersectionTop - imageRect.top + "px";
        overlay.style.width = intersectionWidth + "px";
        overlay.style.height = intersectionHeight + "px";

        overlay.style.setProperty("--flash-duration", "1s");

        image.element.appendChild(overlay);

        if (!image.invertOverlays) image.invertOverlays = new Map();
        image.invertOverlays.set(pad, overlay);
        return overlay;
      }

      function getPadOverlayElements(pad) {
        const result = [];
        if (!pad || !pad.invertedImages) return result;

        pad.invertedImages.forEach((image) => {
          const overlay = image.invertOverlays?.get(pad);
          if (overlay) result.push({ image, overlay });
        });
        return result;
      }

      function getMediaSourceSize(media) {
        return {
          width:
            media?.videoWidth || media?.naturalWidth || media?.clientWidth || 0,
          height:
            media?.videoHeight ||
            media?.naturalHeight ||
            media?.clientHeight ||
            0,
        };
      }

      function drawMediaCropToCanvas(image, overlay, canvasElement) {
        const media = image?.mediaElement;
        if (!media || !canvasElement || !overlay) return false;

        const rect = overlay.getBoundingClientRect();
        const imageRect = image.element.getBoundingClientRect();
        const source = getMediaSourceSize(media);

        if (
          !source.width ||
          !source.height ||
          !imageRect.width ||
          !imageRect.height
        ) {
          return false;
        }

        const w = Math.max(1, Math.round(rect.width));
        const h = Math.max(1, Math.round(rect.height));

        if (canvasElement.width !== w || canvasElement.height !== h) {
          canvasElement.width = w;
          canvasElement.height = h;
        }

        const ctx = canvasElement.getContext("2d");
        if (!ctx) return false;

        const sx = Math.max(
          0,
          ((rect.left - imageRect.left) / imageRect.width) * source.width,
        );
        const sy = Math.max(
          0,
          ((rect.top - imageRect.top) / imageRect.height) * source.height,
        );
        const sw = Math.min(
          source.width - sx,
          (rect.width / imageRect.width) * source.width,
        );
        const sh = Math.min(
          source.height - sy,
          (rect.height / imageRect.height) * source.height,
        );

        if (sw <= 0 || sh <= 0) return false;

        try {
          ctx.clearRect(0, 0, w, h);
          ctx.drawImage(media, sx, sy, sw, sh, 0, 0, w, h);
          return true;
        } catch (error) {
          return false;
        }
      }

      function setPadVisualEffect(pad, blurAmount, glitchAmount, flashHz) {
        if (!pad) return;

        pad.visualBlur = blurAmount;
        pad.visualGlitch = glitchAmount;
        pad.visualFlashHz = flashHz;

        getPadOverlayElements(pad).forEach(({ image, overlay }) => {
          overlay.style.setProperty(
            "--flash-duration",
            `${1 / Math.max(0.05, flashHz)}s`,
          );

          if (flashHz > 0.05) {
            overlay.classList.add("visualFlash");
            overlay.style.setProperty("--flash-duration", `${1 / flashHz}s`);
          } else {
            overlay.classList.remove("visualFlash");
            overlay.style.opacity = "1";
          }

          const blurCanvas = ensurePadBlurCanvas(pad, image, overlay);
          if (blurCanvas) {
            blurCanvas.style.opacity = blurAmount > 0.01 ? "1" : "0";
            blurCanvas.style.filter = `blur(${blurAmount}px) invert(1)`;
            blurCanvas.style.webkitFilter = `blur(${blurAmount}px) invert(1)`;
            if (blurAmount > 0.01) {
              drawMediaCropToCanvas(image, overlay, blurCanvas);
            }
          }

          if (glitchAmount > 0.01) {
            ensurePadGlitchCanvas(pad, image, overlay);
            const glitch = image.invertOverlays?.get(pad)?._glitchElement;
            if (glitch)
              glitch.style.opacity = String(Math.min(1, glitchAmount));
          } else {
            const glitch = image.invertOverlays?.get(pad)?._glitchElement;
            if (glitch) glitch.style.opacity = "0";
          }
        });

        if (glitchAmount > 0.01 || blurAmount > 0.01) {
          startPadVisualGlitchLoop(pad);
        } else {
          stopPadVisualGlitchLoop(pad);
        }
      }

      function ensurePadBlurCanvas(pad, image, overlay) {
        if (overlay._blurCanvas) return overlay._blurCanvas;

        const canvasElement = document.createElement("canvas");
        canvasElement.className = "padVisualBlur";
        overlay.appendChild(canvasElement);

        overlay._blurCanvas = canvasElement;
        overlay._blurImage = image;
        overlay._blurPad = pad;
        return canvasElement;
      }

      function ensurePadGlitchCanvas(pad, image, overlay) {
        if (overlay._glitchElement) return overlay._glitchElement;

        const glitch = document.createElement("div");
        glitch.className = "padVisualGlitch";

        const canvasElement = document.createElement("canvas");
        canvasElement.className = "padVisualGlitchCanvas";
        glitch.appendChild(canvasElement);
        overlay.appendChild(glitch);

        overlay._glitchElement = glitch;
        overlay._glitchCanvas = canvasElement;
        overlay._glitchImage = image;
        overlay._glitchPad = pad;
        return glitch;
      }

      function renderPadVisual(pad, timestamp = performance.now()) {
        if (!pad || !pad.holding || sampler.mode !== "play") return;
        if (pad.visualGlitch <= 0.01 && pad.visualBlur <= 0.01) return;

        const entries = getPadOverlayElements(pad);
        const amount = pad.visualGlitch;

        entries.forEach(({ image, overlay }) => {
          if (pad.visualBlur > 0.01 && overlay._blurCanvas) {
            drawMediaCropToCanvas(image, overlay, overlay._blurCanvas);
          }

          if (amount <= 0.01) return;

          const glitch = overlay._glitchElement;
          const c = overlay._glitchCanvas;
          const media = image.mediaElement;
          if (!glitch || !c || !media) return;

          const rect = overlay.getBoundingClientRect();
          const w = Math.max(1, Math.round(rect.width));
          const h = Math.max(1, Math.round(rect.height));

          if (c.width !== w || c.height !== h) {
            c.width = w;
            c.height = h;
          }

          const ctx = c.getContext("2d", { willReadFrequently: true });
          if (!ctx) return;

          const source = getMediaSourceSize(media);
          const imageRect = image.element.getBoundingClientRect();
          if (
            !source.width ||
            !source.height ||
            !imageRect.width ||
            !imageRect.height
          )
            return;

          const sx = Math.max(
            0,
            ((rect.left - imageRect.left) / imageRect.width) * source.width,
          );
          const sy = Math.max(
            0,
            ((rect.top - imageRect.top) / imageRect.height) * source.height,
          );
          const sw = Math.min(
            source.width - sx,
            (rect.width / imageRect.width) * source.width,
          );
          const sh = Math.min(
            source.height - sy,
            (rect.height / imageRect.height) * source.height,
          );
          if (sw <= 0 || sh <= 0) return;

          try {
            ctx.clearRect(0, 0, w, h);
            ctx.drawImage(media, sx, sy, sw, sh, 0, 0, w, h);

            const data = ctx.getImageData(0, 0, w, h);
            const src = data.data;
            const original = new Uint8ClampedArray(src);
            const maxShift = Math.max(1, Math.round(2 + amount * 18));
            const sliceCount = Math.max(3, Math.round(3 + amount * 10));

            for (let slice = 0; slice < sliceCount; slice++) {
              const y0 = Math.floor((slice / sliceCount) * h);
              const y1 = Math.floor(((slice + 1) / sliceCount) * h);
              const shift = Math.round((Math.random() * 2 - 1) * maxShift);

              for (let y = y0; y < y1; y++) {
                for (let x = 0; x < w; x++) {
                  const i = (y * w + x) * 4;
                  const rX = Math.max(0, Math.min(w - 1, x + shift));
                  const bX = Math.max(0, Math.min(w - 1, x - shift));
                  const rI = (y * w + rX) * 4;
                  const bI = (y * w + bX) * 4;

                  src[i] = original[rI];
                  src[i + 1] = original[i + 1];
                  src[i + 2] = original[bI + 2];
                }
              }
            }

            ctx.putImageData(data, 0, 0);
            glitch.style.transform = `translate(${(Math.random() - 0.5) * amount * 6}px, ${(Math.random() - 0.5) * amount * 2}px)`;
          } catch (error) {
            // Keep the normal inverse layer working if a browser blocks frame access.
          }
        });
      }

      function startPadVisualGlitchLoop(pad) {
        if (!pad || pad.visualFrame) return;

        const tick = (timestamp) => {
          pad.visualFrame = requestAnimationFrame(tick);
          if (timestamp - pad.visualLastFrameTime < 50) return;
          pad.visualLastFrameTime = timestamp;
          renderPadVisual(pad, timestamp);
        };

        pad.visualLastFrameTime = 0;
        pad.visualFrame = requestAnimationFrame(tick);
      }

      function stopPadVisualGlitchLoop(pad) {
        if (!pad) return;
        if (pad.visualFrame) {
          cancelAnimationFrame(pad.visualFrame);
          pad.visualFrame = null;
        }
        pad.visualLastFrameTime = 0;

        if (pad.invertedImages) {
          pad.invertedImages.forEach((image) => {
            const overlay = image.invertOverlays?.get(pad);
            if (!overlay) return;
            if (overlay._glitchElement) {
              overlay._glitchElement.remove();
              delete overlay._glitchElement;
              delete overlay._glitchCanvas;
            }
            if (overlay._blurCanvas) {
              overlay._blurCanvas.remove();
              delete overlay._blurCanvas;
            }
          });
        }
      }

      function applyPadImageInvert(pad) {
        if (!pad || sampler.mode !== "play") {
          return;
        }

        /*
         * 先清除舊的。
         */
        clearPadImageInvert(pad);

        const images = getImagesUnderPad(pad);

        /*
         * 記住這個 PAD 目前作用在哪些圖片。
         */
        pad.invertedImages = new Set(images);

        images.forEach((image) => {
          createImageInvertOverlay(image, pad);
        });

        setPadVisualEffect(pad, 0, 0, 0);
      }

      /*
       * =====================================================
       * CLEAR PAD IMAGE INVERT
       * =====================================================
       */
      function clearPadImageInvert(pad) {
        if (!pad) {
          return;
        }

        stopPadVisualGlitchLoop(pad);
        pad.visualBlur = 0;
        pad.visualGlitch = 0;
        pad.visualFlashHz = 0;

        if (pad.invertedImages) {
          pad.invertedImages.forEach((image) => {
            removeImageInvertOverlay(image, pad);
          });

          pad.invertedImages.clear();
        }

        /*
         * 保險清除。
         */
        sampler.images.forEach((image) => {
          removeImageInvertOverlay(image, pad);
        });
      }

      /*
       * =====================================================
       * REFRESH ALL PAD INVERT OVERLAYS
       * =====================================================
       *
       * PAD / IMAGE 的 pixel rectangle 改變時，
       * 重新計算 inverse 範圍。
       */
      function refreshAllPadImageInverts() {
        if (sampler.mode !== "play") {
          return;
        }

        sampler.pads.forEach((pad) => {
          if (!pad.holding) {
            return;
          }

          /*
           * 先移除目前 overlay。
           */
          const oldImages = pad.invertedImages
            ? Array.from(pad.invertedImages)
            : [];

          oldImages.forEach((image) => {
            removeImageInvertOverlay(image, pad);
          });

          /*
           * 重新找圖片。
           */
          const images = getImagesUnderPad(pad);

          pad.invertedImages = new Set(images);

          images.forEach((image) => {
            createImageInvertOverlay(image, pad);
          });

          setPadVisualEffect(
            pad,
            pad.visualBlur || 0,
            pad.visualGlitch || 0,
            pad.visualFlashHz || 0,
          );
        });
      }

      /* =====================================================
         PLAY MODE — HOLD PLAY
      ===================================================== */

      const HOLD_BASE_INTERVAL = 600;

      const HOLD_MIN_INTERVAL = 70;

      const HOLD_MAX_INTERVAL = 1400;

      const HOLD_INTERVAL_PER_PIXEL = 4;

      function getHoldIntervalFromY(pad, currentY) {
        const dy = currentY - pad.holdStartY;

        const interval = HOLD_BASE_INTERVAL + dy * HOLD_INTERVAL_PER_PIXEL;

        return Math.max(
          HOLD_MIN_INTERVAL,
          Math.min(HOLD_MAX_INTERVAL, interval),
        );
      }

      function updatePadHoldSpeed(pad, currentY) {
        if (!pad || !pad.holding) {
          return;
        }

        const newInterval = getHoldIntervalFromY(pad, currentY);

        pad.holdInterval = newInterval;

        updatePadHoldSpeedUI(pad);
      }

      function stopCurrentPadHoldSource(pad) {
        if (!pad) return;

        const source = pad.holdSource;

        if (!source) return;

        pad.holdSource = null;

        try {
          source.onended = null;
        } catch (error) {}

        try {
          source.stop();
        } catch (error) {}

        try {
          source.disconnect();
        } catch (error) {}

        if (pad.holdGain) {
          try {
            pad.holdGain.disconnect();
          } catch (error) {}
        }

        pad.holdGain = null;
        pad.holdFilter = null;
        pad.holdReverbDry = null;
        pad.holdReverbWet = null;
        pad.holdConvolver = null;
        pad.holdDistortion = null;
      }

      function runPadHoldScheduler(pad) {
        if (!pad || !pad.holding) {
          return;
        }

        if (!pad.audioBuffer) {
          return;
        }

        if (sampler.mode !== "play") {
          return;
        }

        const now = performance.now();

        if (now - pad.holdLastTriggerTime >= pad.holdInterval) {
          pad.holdLastTriggerTime = now;

          // 每次重新觸發都讓自己的聲音完整播放，
          // 不停止前一個 source；不同次觸發可以自然重疊。
          recordPadEvent(pad);

          playPad(pad, {
            isHoldSource: true,
            playbackRate: pad.holdFrequency ?? 1,
            reverb: pad.holdReverb ?? 0,
            distortion: pad.holdDistortion ?? 0,
          });
        }

        pad.holdRAF = requestAnimationFrame(() => {
          runPadHoldScheduler(pad);
        });
      }

      function scheduleNextPadHold(pad) {
        if (!pad || !pad.holding) {
          return;
        }

        if (!pad.audioBuffer) {
          return;
        }

        if (pad.holdRAF !== null) {
          cancelAnimationFrame(pad.holdRAF);

          pad.holdRAF = null;
        }

        pad.holdLastTriggerTime = performance.now();

        pad.holdRAF = requestAnimationFrame(() => {
          runPadHoldScheduler(pad);
        });
      }

      async function startPadHold(pad, pointerId, startX, startY) {
        if (sampler.mode !== "play") {
          return;
        }

        if (pad.holding) {
          return;
        }

        if (!pad.audioBuffer) {
          return;
        }

        pad.holdPointerId = pointerId;

        pad.holdStartY = startY;
        pad.holdStartX = startX;

        pad.holdFrequency = 1;
        pad.holdReverb = 0;
        pad.holdDistortionAmount = 0;
        pad.holdDistortion = 0;

        pad.holdInterval = HOLD_BASE_INTERVAL;

        pad.holdLastTriggerTime = 0;

        pad.holdGeneration++;
        pad.holdEffectZoneActive = false;
        pad.visualBlur = 0;
        pad.visualGlitch = 0;
        pad.visualFlashHz = 0;
        pad.visualLastFrameTime = 0;

        const generation = pad.holdGeneration;

        try {
          await resumeAudio();
        } catch (error) {
          console.error("Cannot resume audio:", error);

          pad.holdPointerId = null;

          return;
        }

        if (sampler.mode !== "play") {
          pad.holdPointerId = null;

          return;
        }

        if (pad.holdGeneration !== generation) {
          pad.holdPointerId = null;

          return;
        }

        if (pad.holdPointerId !== pointerId) {
          return;
        }

        pad.holding = true;

        /*
         * 第一下立即播放。
         */
        recordPadEvent(pad);

        playPad(pad, {
          isHoldSource: true,
          playbackRate: pad.holdFrequency,
          reverb: pad.holdReverb,
          distortion: pad.holdDistortionAmount,
        });

        if (pad.element) {
          pad.element.classList.add("holding");
        }

        updatePadEffectUI(pad);

        scheduleNextPadHold(pad);

        /*
         * resumeAudio() 是 async，
         * 為避免開始播放後 overlay 因為 layout
         * 尚未完成而位置不準，再算一次。
         */
        refreshAllPadImageInverts();
      }

      /* =====================================================
         RELEASE PAD
      ===================================================== */

      function stopPadHold(pad, pointerId = null) {
        if (!pad) {
          return;
        }

        if (
          pointerId !== null &&
          pad.holdPointerId !== null &&
          pad.holdPointerId !== pointerId
        ) {
          return;
        }

        pad.holding = false;

        pad.holdPointerId = null;

        pad.holdGeneration++;

        if (pad.holdRAF !== null) {
          cancelAnimationFrame(pad.holdRAF);

          pad.holdRAF = null;
        }

        if (pad.holdTimer !== null) {
          clearTimeout(pad.holdTimer);

          pad.holdTimer = null;
        }

        // 放開 PAD 不截斷正在播放的聲音。
        // 每一次觸發都讓音檔完整播放完畢。
        pad.holdEffectZoneActive = false;
        pad.visualBlur = 0;
        pad.visualGlitch = 0;
        pad.visualFlashHz = 0;
        stopPadVisualGlitchLoop(pad);

        /*
         * 放開 PAD：
         * 清除這個 PAD 的所有 inverse。
         */
        clearPadImageInvert(pad);

        if (pad.element) {
          pad.element.classList.remove("holding");

          if (!pad.holding) {
            pad.element.classList.remove("playing");
          }
        }
      }

      /* =====================================================
         STOP ALL PAD HOLDS
      ===================================================== */

      function stopAllPadHolds() {
        sampler.pads.forEach((pad) => {
          stopPadHold(pad);
        });
      }

      /* =====================================================
         PAD INTERACTION
      ===================================================== */

      function setupPadInteraction(pad, element, resizeHandle) {
        let startX = 0;

        let startY = 0;

        let startPadX = 0;

        let startPadY = 0;

        let startWidth = 0;

        let startHeight = 0;

        let pointerDownTime = 0;

        let moved = false;

        let action = null;

        element.addEventListener(
          "pointerdown",
          async (event) => {
            /*
             * PLAY MODE
             */
            if (sampler.mode === "play") {
              if (event.target.closest(".padControls")) {
                return;
              }

              event.preventDefault();

              try {
                element.setPointerCapture(event.pointerId);
              } catch (error) {}

              /*
               * 按下瞬間：
               *
               * PAD 多大，
               * 就只 inverse PAD 範圍。
               */
              applyPadImageInvert(pad);

              await startPadHold(
                pad,
                event.pointerId,
                event.clientX,
                event.clientY,
              );

              return;
            }

            /*
             * EDIT MODE
             */
            if (sampler.mode !== "edit") {
              return;
            }

            if (event.target.closest(".padControls")) {
              return;
            }

            event.preventDefault();

            if (pinchState && pinchState.target.element === element) {
              action = null;
              return;
            }

            try {
              element.setPointerCapture(event.pointerId);
            } catch (error) {}

            startX = event.clientX;

            startY = event.clientY;

            startPadX = pad.x;

            startPadY = pad.y;

            startWidth = pad.width;

            startHeight = pad.height;

            pointerDownTime = Date.now();

            moved = false;

            if (event.target === resizeHandle) {
              action = "resize";

              selectPad(pad);

              return;
            }

            action = "none";
