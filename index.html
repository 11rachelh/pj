<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <title>Visual Sampler</title>

    <style>
      /* =====================================================
         GLOBAL
      ===================================================== */

      * {
        box-sizing: border-box;

        /*
         * 禁止所有文字選取。
         */
        -webkit-user-select: none;
        user-select: none;

        /*
         * 禁止 iOS 長按叫出選單。
         */
        -webkit-touch-callout: none;

        /*
         * 禁止瀏覽器預設 touch gesture。
         */
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        margin: 0;
        padding: 0;

        width: 100%;
        height: 100%;

        overflow: hidden;

        font-family: Arial, sans-serif;

        background: white;
        color: black;

        overscroll-behavior: none;

        /*
         * 防止雙擊縮放 / pinch zoom。
         */
        touch-action: none;

        /*
         * iOS Safari。
         */
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }

      body {
        -webkit-user-select: none;
        user-select: none;

        -webkit-touch-callout: none;

        touch-action: none;
      }

      /*
       * 所有文字元素都禁止選取。
       */
      body,
      div,
      span,
      button,
      label,
      input,
      img {
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }

      button,
      input {
        font-family: inherit;
      }

      button {
        /*
         * 禁止瀏覽器自行處理 touch gesture。
         */
        touch-action: none;
      }

      /* =====================================================
         TOOLBAR
      ===================================================== */

      .toolbar {
        position: fixed;

        top: 0;
        left: 0;
        right: 0;

        height: 60px;

        display: flex;
        align-items: center;

        gap: 8px;

        padding: 10px 15px;

        background: white;

        border-bottom: 1px solid black;

        z-index: 1000;

        overflow-x: auto;
        overflow-y: hidden;

        -webkit-overflow-scrolling: touch;

        /*
         * Toolbar 需要橫向滑動。
         */
        touch-action: pan-x;
      }

      button {
        flex-shrink: 0;

        border: 1px solid black;

        background: white;
        color: black;

        border-radius: 0;

        padding: 8px 14px;

        font-size: 14px;

        cursor: pointer;

        -webkit-tap-highlight-color: transparent;
      }

      button:hover {
        background: #eee;
      }

      button:active {
        background: #ddd;
      }

      .modeButton.active {
        background: black;
        color: white;
      }

      #addPad {
        margin-left: auto;
      }

      #imageInput,
      #audioInput {
        position: fixed;

        width: 1px;
        height: 1px;

        opacity: 0;

        pointer-events: none;
      }

      /* =====================================================
         CANVAS
      ===================================================== */

      #canvas {
        position: fixed;

        left: 0;
        right: 0;

        top: 60px;
        bottom: 0;

        width: 100%;

        overflow: hidden;

        background: white;

        /*
         * 完全禁止 canvas 區域的瀏覽器手勢。
         */
        touch-action: none;

        -webkit-user-select: none;
        user-select: none;
      }

      /* =====================================================
         IMAGE OBJECT
      ===================================================== */

      .imageItem {
        position: absolute;

        user-select: none;
        -webkit-user-select: none;

        touch-action: none;

        cursor: pointer;

        z-index: 2;

        -webkit-touch-callout: none;
      }

      .imageItem.selected {
        outline: 2px dashed black;
        outline-offset: 2px;
      }

      .imageResizeHandle {
        position: absolute;

        width: 14px;
        height: 14px;

        right: -2px;
        bottom: -2px;

        background: black;

        cursor: nwse-resize;

        touch-action: none;

        z-index: 5;
      }

      /* =====================================================
         PAD
      ===================================================== */

      .pad {
        position: absolute;

        width: 15%;
        height: 15%;

        background: transparent;

        border: 2px solid white;

        border-radius: 0;

        display: flex;

        align-items: center;
        justify-content: center;

        user-select: none;
        -webkit-user-select: none;

        /*
         * 最重要：
         * PAD 不允許瀏覽器自己處理 touch。
         */
        touch-action: none;

        cursor: pointer;

        z-index: 10;

        mix-blend-mode: difference;

        -webkit-tap-highlight-color: transparent;

        -webkit-touch-callout: none;
      }

      .pad.selected {
        border: 4px solid white;
      }

      .pad.recording {
        border: 3px dashed white;
      }

      /*
       * PAD 正在被長按播放。
       */
      .pad.playing {
        transform: scale(0.96);
      }

      /*
       * 長按播放時增加一點視覺提示。
       */
      .pad.holding {
        transform: scale(0.96);
      }

      .padContent {
        width: 100%;
        height: 100%;

        display: flex;
        flex-direction: column;

        align-items: center;
        justify-content: center;

        text-align: center;

        pointer-events: none;

        color: white;

        padding: 8px;
      }

      .padName {
        font-size: 16px;

        max-width: 100%;

        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .recordStatus {
        margin-top: 6px;

        font-size: 12px;

        opacity: 0.7;
      }

      /* =====================================================
         PAD VOLUME CONTROL
      ===================================================== */

      .padControls {
        position: absolute;

        left: 8px;
        right: 8px;
        bottom: 7px;

        display: flex;
        align-items: center;

        gap: 6px;

        z-index: 20;

        pointer-events: auto;

        /*
         * Slider 本身需要可以操作。
         */
        touch-action: none;
      }

      .padVolumeLabel {
        flex-shrink: 0;

        font-size: 10px;

        color: white;

        opacity: 0.8;

        mix-blend-mode: difference;
      }

      .padVolume {
        flex: 1;

        min-width: 0;

        height: 16px;

        margin: 0;

        accent-color: black;

        cursor: pointer;

        /*
         * range input 保留自己的操作。
         */
        touch-action: auto;

        pointer-events: auto;
      }

      .padVolumeValue {
        width: 34px;

        flex-shrink: 0;

        font-size: 10px;

        color: white;

        text-align: right;

        mix-blend-mode: difference;
      }

      /*
       * Play Mode 不需要看到個別 PAD volume。
       */
      #canvas.playMode .padControls {
        display: none;
      }

      /* =====================================================
         PAD RESIZE
      ===================================================== */

      .resizeHandle {
        position: absolute;

        width: 14px;
        height: 14px;

        right: -2px;
        bottom: -2px;

        background: white;

        cursor: nwse-resize;

        touch-action: none;

        z-index: 30;

        mix-blend-mode: difference;
      }

      /* =====================================================
         PLAY MODE
      ===================================================== */

      #canvas.playMode .resizeHandle,
      #canvas.playMode .imageResizeHandle {
        display: none;
      }

      #canvas.playMode .recordStatus {
        display: none;
      }

      /* =====================================================
         LOOP AREA
      ===================================================== */

      .loopArea {
        position: fixed;

        left: 0;
        right: 0;
        bottom: 0;

        min-height: 72px;

        padding: 10px 15px calc(10px + env(safe-area-inset-bottom));

        display: none;

        align-items: center;

        gap: 15px;

        background: white;

        border-top: 1px solid black;

        z-index: 2000;

        -webkit-transform: translateZ(0);
        transform: translateZ(0);

        touch-action: none;
      }

      body.playMode .loopArea {
        display: flex;
      }

      /* =====================================================
         MASTER VOLUME
      ===================================================== */

      .masterVolume {
        width: 150px;

        flex-shrink: 0;

        display: flex;
        flex-direction: column;

        justify-content: center;

        gap: 4px;
      }

      .masterHeader {
        display: flex;
        align-items: center;
        justify-content: space-between;

        font-size: 11px;
      }

      .masterLabel {
        font-size: 12px;
      }

      .masterValue {
        font-size: 11px;

        opacity: 0.65;
      }

      #masterVolumeSlider {
        width: 100%;

        height: 18px;

        margin: 0;

        accent-color: black;

        cursor: pointer;

        touch-action: auto;
      }

      /* =====================================================
         LOOP BUTTON
      ===================================================== */

      .loopButton {
        width: 80px;
        height: 48px;

        flex-shrink: 0;

        padding: 0;

        font-size: 14px;

        border: 2px solid black;

        background: white;

        user-select: none;
        -webkit-user-select: none;

        touch-action: none;

        -webkit-tap-highlight-color: transparent;
      }

      .loopButton.recording {
        background: black;
        color: white;
      }

      .loopButton.recording::before {
        content: "● ";
      }

      /* =====================================================
         RESET LOOP
      ===================================================== */

      .resetLoopButton {
        height: 48px;

        flex-shrink: 0;

        padding: 0 12px;

        font-size: 12px;

        border: 1px solid black;

        background: white;

        display: none;

        touch-action: none;
      }

      .resetLoopButton.visible {
        display: block;
      }

      .resetLoopButton:hover {
        background: #eee;
      }

      /* =====================================================
         LOOP INFO
      ===================================================== */

      .loopInfo {
        width: 100px;

        flex-shrink: 0;

        font-size: 12px;

        line-height: 1.5;
      }

      .loopDuration {
        font-size: 13px;
      }

      .loopHint {
        opacity: 0.5;
      }

      /* =====================================================
         LOOP LAYERS
      ===================================================== */

      .loopLayers {
        flex: 1;

        min-width: 0;

        display: flex;

        align-items: center;

        gap: 8px;

        overflow-x: auto;
        overflow-y: hidden;

        scrollbar-width: none;

        -webkit-overflow-scrolling: touch;

        touch-action: pan-x;
      }

      .loopLayers::-webkit-scrollbar {
        display: none;
      }

      .loopLayer {
        min-width: 105px;

        height: 48px;

        display: flex;

        align-items: center;

        gap: 7px;

        padding: 5px 7px;

        border: 1px solid black;

        background: white;

        flex-shrink: 0;
      }

      .loopLayer.muted {
        opacity: 0.35;
      }

      .loopLayerName {
        flex: 1;

        min-width: 0;

        font-size: 12px;

        white-space: nowrap;

        overflow: hidden;

        text-overflow: ellipsis;
      }

      .muteButton {
        padding: 5px 7px;

        font-size: 11px;

        flex-shrink: 0;

        touch-action: none;
      }

      .muteButton.active {
        background: black;
        color: white;
      }

      /* =====================================================
         RECORDING INDICATOR
      ===================================================== */

      .loopRecordingIndicator {
        position: fixed;

        left: 50%;

        bottom: calc(85px + env(safe-area-inset-bottom));

        transform: translateX(-50%);

        padding: 7px 12px;

        background: black;
        color: white;

        font-size: 12px;

        z-index: 2100;

        display: none;

        pointer-events: none;
      }

      #canvas.loopRecording .loopRecordingIndicator {
        display: block;
      }

      /* =====================================================
         HELP
      ===================================================== */

      .help {
        position: absolute;

        left: 15px;
        bottom: 15px;

        font-size: 12px;

        opacity: 0.6;

        pointer-events: none;

        z-index: 50;
      }

      #canvas.playMode .help {
        display: none;
      }

      /* =====================================================
         SMALL SCREEN
      ===================================================== */

      @media (max-width: 800px) {
        .toolbar {
          gap: 6px;

          padding-left: 10px;
          padding-right: 10px;
        }

        button {
          padding: 8px 10px;

          font-size: 13px;
        }

        #addPad {
          margin-left: 0;
        }

        .loopArea {
          min-height: 82px;

          padding-left: 10px;
          padding-right: 10px;

          gap: 8px;
        }

        .masterVolume {
          width: 120px;
        }

        .loopButton {
          width: 76px;
          height: 48px;
        }

        .resetLoopButton {
          padding: 0 8px;
        }

        .loopInfo {
          width: 85px;
        }

        .loopLayers {
          gap: 6px;
        }

        .loopLayer {
          min-width: 100px;
        }
      }

      @media (max-width: 500px) {
        .loopInfo {
          display: none;
        }

        .masterVolume {
          width: 105px;
        }

        .loopArea {
          gap: 6px;
        }

        .masterLabel {
          font-size: 11px;
        }
      }
    </style>
  </head>

  <body>
    <!-- =====================================================
         TOOLBAR
    ===================================================== -->

    <div class="toolbar">
      <button id="editMode" class="modeButton active">EDIT</button>

      <button id="playMode" class="modeButton">PLAY</button>

      <button id="addPad">+ PAD</button>

      <button id="importPad">IMPORT PAD</button>

      <button id="addImage">+ IMAGE</button>

      <button id="renamePad">RENAME</button>

      <button id="deleteButton">DELETE</button>

      <input
        type="file"
        id="audioInput"
        accept="
          .mp3,
          .m4a,
          .wav,
          .aac,
          .aiff,
          .aif,
          .mp4,
          audio/mpeg,
          audio/mp4,
          audio/wav,
          audio/x-wav,
          audio/aac,
          audio/aiff
        "
        multiple
      />

      <input type="file" id="imageInput" accept="image/*" multiple />
    </div>

    <!-- =====================================================
         CANVAS
    ===================================================== -->

    <div id="canvas">
      <div class="help">EDIT：單點預覽・雙擊錄音・拖曳移動・右下角調整大小</div>

      <div class="loopRecordingIndicator">● RECORDING LOOP</div>
    </div>

    <!-- =====================================================
         LOOP AREA
    ===================================================== -->

    <div class="loopArea">
      <div class="masterVolume">
        <div class="masterHeader">
          <span class="masterLabel">MASTER</span>
          <span id="masterVolumeValue" class="masterValue">100%</span>
        </div>

        <input
          type="range"
          id="masterVolumeSlider"
          min="0"
          max="1"
          step="0.01"
          value="1"
        />
      </div>

      <button id="loopButton" class="loopButton">LOOP</button>

      <button id="resetLoopButton" class="resetLoopButton">RESET LOOP</button>

      <div class="loopInfo">
        <div class="loopDuration">LOOP: —</div>

        <div class="loopHint">Hold to record</div>
      </div>

      <div id="loopLayers" class="loopLayers"></div>
    </div>

    <script>
      /* =====================================================
         SAMPLER STATE
      ===================================================== */

      const sampler = {
        mode: "edit",

        pads: [],

        selectedPad: null,

        images: [],

        selectedImage: null,

        nextPadId: 1,

        nextImageId: 1,

        audioContext: null,

        masterGain: null,

        masterVolume: 1,

        mediaStream: null,

        recorder: null,

        recordingPad: null,

        chunks: [],

        recordingTimer: null,

        recordingStartTime: null,

        /* -------------------------
           LOOP
        ------------------------- */

        loops: [],

        nextLoopId: 1,

        loopRecording: false,

        loopRecordingStartTime: null,

        loopRecordingPointerId: null,

        loopDuration: null,

        loopSources: [],

        loopPressing: false,

        spacePressed: false,

        cancelLoopRecording: false,

        loopEvents: [],

        loopSchedulerTimers: new Map(),

        loopSchedulerGeneration: new Map(),
      };

      /* =====================================================
         DOM
      ===================================================== */

      const canvas = document.getElementById("canvas");

      const editModeButton = document.getElementById("editMode");

      const playModeButton = document.getElementById("playMode");

      const addPadButton = document.getElementById("addPad");

      const addImageButton = document.getElementById("addImage");

      const importPadButton = document.getElementById("importPad");

      const renamePadButton = document.getElementById("renamePad");

      const deleteButton = document.getElementById("deleteButton");

      const imageInput = document.getElementById("imageInput");

      const audioInput = document.getElementById("audioInput");

      const loopButton = document.getElementById("loopButton");

      const resetLoopButton = document.getElementById("resetLoopButton");

      const loopLayers = document.getElementById("loopLayers");

      const loopArea = document.querySelector(".loopArea");

      const masterVolumeSlider = document.getElementById("masterVolumeSlider");

      const masterVolumeValue = document.getElementById("masterVolumeValue");

      /* =====================================================
         SETTINGS
      ===================================================== */

      const CLICK_TIME = 250;

      const DRAG_THRESHOLD = 5;

      const DOUBLE_TAP_TIME = 350;

      const TRIM_THRESHOLD = 0.02;

      const TRIM_PADDING = 0.015;

      const MIN_TRIM_DURATION = 0.02;

      /* =====================================================
         TABLET / MOBILE GESTURE LOCK
      ===================================================== */

      /*
       * 防止選取文字。
       */
      document.addEventListener(
        "selectstart",
        (event) => {
          event.preventDefault();
        },
        { passive: false },
      );

      /*
       * 防止右鍵 / 長按選單。
       */
      document.addEventListener(
        "contextmenu",
        (event) => {
          event.preventDefault();
        },
        { passive: false },
      );

      /*
       * 防止 iOS Safari gesture zoom。
       */
      document.addEventListener(
        "gesturestart",
        (event) => {
          event.preventDefault();
        },
        { passive: false },
      );

      document.addEventListener(
        "gesturechange",
        (event) => {
          event.preventDefault();
        },
        { passive: false },
      );

      document.addEventListener(
        "gestureend",
        (event) => {
          event.preventDefault();
        },
        { passive: false },
      );

      /*
       * 防止 double-click 的瀏覽器預設行為。
       */
      document.addEventListener(
        "dblclick",
        (event) => {
          event.preventDefault();
        },
        { passive: false },
      );

      /*
       * 防止多指觸控。
       *
       * 注意：
       * range slider 不會走這裡的阻擋邏輯。
       */
      document.addEventListener(
        "touchstart",
        (event) => {
          if (event.touches.length > 1) {
            event.preventDefault();
          }
        },
        { passive: false },
      );

      document.addEventListener(
        "touchmove",
        (event) => {
          if (event.touches.length > 1) {
            event.preventDefault();
          }
        },
        { passive: false },
      );

      /* =====================================================
         PERCENT HELPERS
      ===================================================== */

      function pxToPercentX(px) {
        return (px / canvas.clientWidth) * 100;
      }

      function pxToPercentY(px) {
        return (px / canvas.clientHeight) * 100;
      }

      /* =====================================================
         SELECTION
      ===================================================== */

      function clearSelection() {
        sampler.pads.forEach((pad) => {
          if (pad.element) {
            pad.element.classList.remove("selected");
          }
        });

        sampler.images.forEach((image) => {
          if (image.element) {
            image.element.classList.remove("selected");
          }
        });

        sampler.selectedPad = null;

        sampler.selectedImage = null;
      }

      function selectPad(pad) {
        clearSelection();

        sampler.selectedPad = pad;

        if (pad.element) {
          pad.element.classList.add("selected");
        }
      }

      function selectImage(image) {
        clearSelection();

        sampler.selectedImage = image;

        if (image.element) {
          image.element.classList.add("selected");
        }
      }

      /* =====================================================
         AUDIO
      ===================================================== */

      function initAudio() {
        if (!sampler.audioContext) {
          const AudioContextClass =
            window.AudioContext || window.webkitAudioContext;

          if (!AudioContextClass) {
            throw new Error("Web Audio API unsupported");
          }

          sampler.audioContext = new AudioContextClass();
        }

        if (!sampler.masterGain) {
          sampler.masterGain = sampler.audioContext.createGain();

          sampler.masterGain.gain.value = sampler.masterVolume;

          sampler.masterGain.connect(sampler.audioContext.destination);
        }
      }

      async function resumeAudio() {
        initAudio();

        if (sampler.audioContext.state === "suspended") {
          await sampler.audioContext.resume();
        }
      }

      /* =====================================================
         MASTER VOLUME
      ===================================================== */

      function setMasterVolume(value) {
        const volume = Math.max(0, Math.min(1, Number(value)));

        sampler.masterVolume = volume;

        masterVolumeSlider.value = volume;

        masterVolumeValue.textContent = Math.round(volume * 100) + "%";

        if (sampler.masterGain && sampler.audioContext) {
          const now = sampler.audioContext.currentTime;

          sampler.masterGain.gain.cancelScheduledValues(now);

          sampler.masterGain.gain.setTargetAtTime(volume, now, 0.01);
        }
      }

      masterVolumeSlider.addEventListener("input", (event) => {
        event.stopPropagation();

        setMasterVolume(event.target.value);
      });

      masterVolumeSlider.addEventListener("pointerdown", (event) => {
        event.stopPropagation();
      });

      /* =====================================================
         RECORDING MIME
      ===================================================== */

      function getRecordingMimeType() {
        const types = [
          "audio/mp4",
          "audio/webm;codecs=opus",
          "audio/webm",
          "audio/ogg;codecs=opus",
        ];

        for (const type of types) {
          if (
            typeof MediaRecorder !== "undefined" &&
            MediaRecorder.isTypeSupported &&
            MediaRecorder.isTypeSupported(type)
          ) {
            return type;
          }
        }

        return "";
      }

      /* =====================================================
         AUTO TRIM
      ===================================================== */

      function trimAudioBuffer(
        audioBuffer,
        threshold = TRIM_THRESHOLD,
        padding = TRIM_PADDING,
      ) {
        if (!audioBuffer) {
          return null;
        }

        const sampleRate = audioBuffer.sampleRate;

        const length = audioBuffer.length;

        const channels = audioBuffer.numberOfChannels;

        if (length === 0) {
          return audioBuffer;
        }

        let startSample = -1;

        for (let i = 0; i < length; i++) {
          let amplitude = 0;

          for (let channel = 0; channel < channels; channel++) {
            const data = audioBuffer.getChannelData(channel);

            amplitude = Math.max(amplitude, Math.abs(data[i]));
          }

          if (amplitude >= threshold) {
            startSample = i;

            break;
          }
        }

        if (startSample === -1) {
          return audioBuffer;
        }

        let endSample = -1;

        for (let i = length - 1; i >= 0; i--) {
          let amplitude = 0;

          for (let channel = 0; channel < channels; channel++) {
            const data = audioBuffer.getChannelData(channel);

            amplitude = Math.max(amplitude, Math.abs(data[i]));
          }

          if (amplitude >= threshold) {
            endSample = i;

            break;
          }
        }

        if (endSample === -1) {
          return audioBuffer;
        }

        const paddingSamples = Math.floor(padding * sampleRate);

        startSample = Math.max(0, startSample - paddingSamples);

        endSample = Math.min(length - 1, endSample + paddingSamples);

        const trimmedLength = endSample - startSample + 1;

        if (trimmedLength < sampleRate * MIN_TRIM_DURATION) {
          return audioBuffer;
        }

        if (startSample === 0 && endSample === length - 1) {
          return audioBuffer;
        }

        const trimmedBuffer = sampler.audioContext.createBuffer(
          channels,
          trimmedLength,
          sampleRate,
        );

        for (let channel = 0; channel < channels; channel++) {
          const sourceData = audioBuffer.getChannelData(channel);

          const targetData = trimmedBuffer.getChannelData(channel);

          targetData.set(sourceData.slice(startSample, endSample + 1));
        }

        console.log("Audio trimmed:", {
          originalDuration: audioBuffer.duration,
          trimmedDuration: trimmedBuffer.duration,
        });

        return trimmedBuffer;
      }

      /* =====================================================
         CREATE PAD
      ===================================================== */

      function createPad(x = 10, y = 10) {
        const id = sampler.nextPadId++;

        const pad = {
          id,

          name: `PAD ${id}`,

          x,

          y,

          width: 15,

          height: 15,

          audioURL: null,

          audioBuffer: null,

          volume: 1,

          element: null,

          lastTapTime: 0,

          pendingDoubleTap: false,

          /*
           * PLAY MODE 長按播放。
           *
           * holdSource = 目前正在 loop 的 source
           * holdGain   = 這次播放的 volume gain
           * holding    = 是否正在按住
           */
          /*
           * PLAY MODE 長按重複播放。
           *
           * 不使用 source.loop，而是每次重新建立
           * BufferSource。這樣即使下一次開始時間
           * 早於上一個音檔結束，也可以自然重疊播放。
           */
          holdSource: null,

          holdGain: null,

          holding: false,

          holdPointerId: null,

          holdStartY: 0,

          holdInterval: 600,

          holdTimer: null,

          holdGeneration: 0,
        };

        sampler.pads.push(pad);

        renderPad(pad);

        selectPad(pad);

        return pad;
      }

      /* =====================================================
         IMPORT PAD
      ===================================================== */

      importPadButton.addEventListener("click", () => {
        if (sampler.mode !== "edit") {
          return;
        }

        audioInput.value = "";

        audioInput.click();
      });

      /* =====================================================
         AUDIO INPUT
      ===================================================== */

      audioInput.addEventListener("change", async (event) => {
        const files = Array.from(event.target.files || []);

        if (!files.length) {
          return;
        }

        for (const file of files) {
          await importAudioFileAsPad(file);
        }

        audioInput.value = "";
      });

      /* =====================================================
         IMPORT AUDIO FILE
      ===================================================== */

      async function importAudioFileAsPad(file) {
        if (!file) {
          return;
        }

        let pad = null;

        try {
          pad = createPad(10 + Math.random() * 50, 10 + Math.random() * 50);

          updatePadStatus(pad, "LOADING");

          pad.audioURL = URL.createObjectURL(file);

          initAudio();

          const arrayBuffer = await file.arrayBuffer();

          const decodedBuffer =
            await sampler.audioContext.decodeAudioData(arrayBuffer);

          pad.audioBuffer = trimAudioBuffer(decodedBuffer);

          updatePadStatus(pad, "READY");

          selectPad(pad);
        } catch (error) {
          console.error("Import audio error:", error);

          if (pad) {
            if (pad.audioURL) {
              URL.revokeObjectURL(pad.audioURL);
            }

            if (pad.element) {
              pad.element.remove();
            }

            sampler.pads = sampler.pads.filter((p) => p !== pad);

            if (sampler.selectedPad === pad) {
              sampler.selectedPad = null;
            }
          }

          alert(
            "無法匯入這個音檔。\n\n" +
              "請確認這是 MP3、M4A、WAV 或其他瀏覽器支援的音訊檔案。",
          );
        }
      }

      /* =====================================================
         RENDER PAD
      ===================================================== */

      function renderPad(pad) {
        const element = document.createElement("div");

        element.className = "pad";

        const content = document.createElement("div");

        content.className = "padContent";

        const name = document.createElement("div");

        name.className = "padName";

        name.textContent = pad.name;

        const status = document.createElement("div");

        status.className = "recordStatus";

        status.textContent = "NO SOUND";

        content.appendChild(name);

        content.appendChild(status);

        /* -------------------------
           PAD volume
        ------------------------- */

        const controls = document.createElement("div");

        controls.className = "padControls";

        const label = document.createElement("span");

        label.className = "padVolumeLabel";

        label.textContent = "VOL";

        const slider = document.createElement("input");

        slider.type = "range";

        slider.className = "padVolume";

        slider.min = "0";

        slider.max = "1";

        slider.step = "0.01";

        slider.value = pad.volume;

        const value = document.createElement("span");

        value.className = "padVolumeValue";

        value.textContent = Math.round(pad.volume * 100) + "%";

        controls.appendChild(label);

        controls.appendChild(slider);

        controls.appendChild(value);

        controls.addEventListener("pointerdown", (event) => {
          event.stopPropagation();
        });

        controls.addEventListener("pointermove", (event) => {
          event.stopPropagation();
        });

        controls.addEventListener("pointerup", (event) => {
          event.stopPropagation();
        });

        controls.addEventListener("click", (event) => {
          event.stopPropagation();
        });

        slider.addEventListener("input", (event) => {
          event.stopPropagation();

          setPadVolume(pad, event.target.value);
        });

        element.appendChild(content);

        element.appendChild(controls);

        const resizeHandle = document.createElement("div");

        resizeHandle.className = "resizeHandle";

        element.appendChild(resizeHandle);

        canvas.appendChild(element);

        pad.element = element;

        updatePad(pad);

        setupPadInteraction(pad, element, resizeHandle);
      }

      /* =====================================================
         PAD VOLUME
      ===================================================== */

      function setPadVolume(pad, value) {
        const volume = Math.max(0, Math.min(1, Number(value)));

        pad.volume = volume;

        if (!pad.element) {
          return;
        }

        const slider = pad.element.querySelector(".padVolume");

        const valueElement = pad.element.querySelector(".padVolumeValue");

        if (slider) {
          slider.value = volume;
        }

        if (valueElement) {
          valueElement.textContent = Math.round(volume * 100) + "%";
        }

        /*
         * 如果正在長按播放，
         * 音量即時跟著 slider 改。
         */
        if (pad.holdGain) {
          pad.holdGain.gain.setTargetAtTime(
            volume,
            sampler.audioContext.currentTime,
            0.01,
          );
        }
      }

      /* =====================================================
         UPDATE PAD
      ===================================================== */

      function updatePad(pad) {
        if (!pad.element) {
          return;
        }

        pad.element.style.left = pad.x + "%";

        pad.element.style.top = pad.y + "%";

        pad.element.style.width = pad.width + "%";

        pad.element.style.height = pad.height + "%";
      }

      /* =====================================================
         RENAME
      ===================================================== */

      function renameSelectedPad() {
        const pad = sampler.selectedPad;

        if (!pad) {
          alert("請先選取一個 PAD。");

          return;
        }

        const newName = window.prompt("輸入 PAD 名稱：", pad.name);

        if (newName === null) {
          return;
        }

        const trimmed = newName.trim();

        if (!trimmed) {
          return;
        }

        pad.name = trimmed;

        const nameElement = pad.element.querySelector(".padName");

        if (nameElement) {
          nameElement.textContent = pad.name;
        }
      }

      renamePadButton.addEventListener("click", renameSelectedPad);

      /* =====================================================
         PLAY MODE — HOLD PLAY
      ===================================================== */

      /*
       * ============================================================
       * PLAY MODE — HOLD RETRIGGER
       * ============================================================
       *
       * 長按 PAD：
       *
       *   1. 第一下立即播放。
       *   2. 手指繼續按住時，不斷重新觸發同一個 PAD。
       *   3. 手指往上移 → interval 變短 → 觸發越快。
       *   4. 手指往下移 → interval 變長 → 觸發越慢。
       *
       * 重要：
       * 這裡刻意不用 AudioBufferSourceNode.loop。
       * 每一次 retrigger 都建立新的 BufferSource，
       * 所以「下一次開始」不需要等「上一次結束」。
       * 因此 interval 小於音檔長度時，聲音會重疊。
       */

      const HOLD_BASE_INTERVAL = 600;

      const HOLD_MIN_INTERVAL = 70;

      const HOLD_MAX_INTERVAL = 1400;

      /*
       * 每移動 1px，interval 改變多少毫秒。
       *
       * 往上：
       *   dy < 0
       *   interval 變短
       *
       * 往下：
       *   dy > 0
       *   interval 變長
       */
      const HOLD_INTERVAL_PER_PIXEL = 4;

      function getHoldIntervalFromY(pad, currentY) {
        const dy = currentY - pad.holdStartY;

        const interval = HOLD_BASE_INTERVAL + dy * HOLD_INTERVAL_PER_PIXEL;

        return Math.max(
          HOLD_MIN_INTERVAL,
          Math.min(HOLD_MAX_INTERVAL, interval),
        );
      }

      function updatePadHoldSpeed(pad, currentY) {
        if (!pad || !pad.holding) {
          return;
        }

        const newInterval = getHoldIntervalFromY(pad, currentY);

        pad.holdInterval = newInterval;

        /*
         * 速度改變後，重新安排下一次 retrigger。
         *
         * 不是等舊 timer 跑完，所以滑動速度會立即生效。
         */
        scheduleNextPadHold(pad, true);
      }

      function scheduleNextPadHold(pad, immediateReschedule = false) {
        if (!pad || !pad.holding) {
          return;
        }

        if (!pad.audioBuffer) {
          return;
        }

        if (pad.holdTimer !== null) {
          clearTimeout(pad.holdTimer);

          pad.holdTimer = null;
        }

        const generation = pad.holdGeneration;

        /*
         * 用目前 interval 決定下一次開始。
         *
         * 如果 interval = 200ms，
         * 就是每 200ms 開始一次。
         *
         * 不管前一個音檔是不是已經播放完。
         */
        const delay = immediateReschedule
          ? Math.max(10, Math.min(pad.holdInterval, 120))
          : pad.holdInterval;

        pad.holdTimer = setTimeout(() => {
          pad.holdTimer = null;

          if (!pad.holding) {
            return;
          }

          if (pad.holdGeneration !== generation) {
            return;
          }

          if (sampler.mode !== "play") {
            return;
          }

          /*
           * 這一次新的播放可以和上一個聲音重疊。
           */
          playPad(pad);

          /*
           * 繼續下一次。
           */
          scheduleNextPadHold(pad);
        }, delay);
      }

      async function startPadHold(pad, pointerId, startY) {
        if (sampler.mode !== "play") {
          return;
        }

        if (pad.holding) {
          return;
        }

        if (!pad.audioBuffer) {
          return;
        }

        /*
         * 先記住 pointer 狀態。
         *
         * 因為 resumeAudio() 是 async，
         * 使用者可能在它完成前就放手。
         */
        pad.holdPointerId = pointerId;

        pad.holdStartY = startY;

        pad.holdInterval = HOLD_BASE_INTERVAL;

        pad.holdGeneration++;

        const generation = pad.holdGeneration;

        try {
          await resumeAudio();
        } catch (error) {
          console.error("Cannot resume audio:", error);

          pad.holdPointerId = null;

          return;
        }

        /*
         * 如果使用者已經放開，或 mode 已經切換，
         * 就不要開始長按播放。
         */
        if (sampler.mode !== "play") {
          pad.holdPointerId = null;

          return;
        }

        if (pad.holdGeneration !== generation) {
          pad.holdPointerId = null;

          return;
        }

        if (pad.holdPointerId !== pointerId) {
          return;
        }

        pad.holding = true;

        /*
         * 第一下立即播放。
         */
        playPad(pad);

        if (pad.element) {
          pad.element.classList.add("holding");
        }

        updatePadHoldSpeedUI(pad);

        /*
         * 開始 retrigger。
         */
        scheduleNextPadHold(pad);
      }

      /* =====================================================
         PLAY MODE — RELEASE PAD
      ===================================================== */

      function stopPadHold(pad, pointerId = null) {
        if (!pad) {
          return;
        }

        /*
         * 如果指定 pointerId，
         * 只有目前這根手指可以停止它。
         */
        if (
          pointerId !== null &&
          pad.holdPointerId !== null &&
          pad.holdPointerId !== pointerId
        ) {
          return;
        }

        pad.holding = false;

        pad.holdPointerId = null;

        pad.holdGeneration++;

        if (pad.holdTimer !== null) {
          clearTimeout(pad.holdTimer);

          pad.holdTimer = null;
        }

        /*
         * holdSource 保留作為相容欄位。
         * 新版 retrigger 不依賴單一 loop source。
         */
        const source = pad.holdSource;

        const gain = pad.holdGain;

        pad.holdSource = null;

        pad.holdGain = null;

        if (source) {
          try {
            source.stop();
          } catch (error) {}

          try {
            source.disconnect();
          } catch (error) {}
        }

        if (gain) {
          try {
            gain.disconnect();
          } catch (error) {}
        }

        if (pad.element) {
          pad.element.classList.remove("holding");

          /*
           * 這裡只移除 hold 的視覺狀態。
           *
           * playPad() 自己建立的短暫 source
           * 會在 onended 時自行清理。
           */
          if (!pad.holding) {
            pad.element.classList.remove("playing");
          }
        }
      }

      /* =====================================================
         STOP ALL PAD HOLDS
      ===================================================== */

      function stopAllPadHolds() {
        sampler.pads.forEach((pad) => {
          stopPadHold(pad);
        });
      }

      /* =====================================================
         PAD INTERACTION
      ===================================================== */

      function setupPadInteraction(pad, element, resizeHandle) {
        let startX = 0;

        let startY = 0;

        let startPadX = 0;

        let startPadY = 0;

        let startWidth = 0;

        let startHeight = 0;

        let pointerDownTime = 0;

        let moved = false;

        let action = null;

        element.addEventListener(
          "pointerdown",
          async (event) => {
            /*
             * =================================================
             * PLAY MODE
             * =================================================
             *
             * 長按 PAD：
             *
             *   第一聲立即播放。
             *
             *   手指往上移：
             *     retrigger interval 變短
             *     → 播放越來越快。
             *
             *   手指往下移：
             *     retrigger interval 變長
             *     → 播放越來越慢。
             *
             * 注意：
             * 每一次都是新的 BufferSource，
             * 所以不需要等待上一個音檔播完。
             */
            if (sampler.mode === "play") {
              if (event.target.closest(".padControls")) {
                return;
              }

              event.preventDefault();

              try {
                element.setPointerCapture(event.pointerId);
              } catch (error) {}

              /*
               * 一次 pointerdown = 一次 loop event。
               *
               * 長按期間的 retrigger 不會一直
               * 重複寫入 Loop 錄音事件。
               */
              recordPadEvent(pad);

              await startPadHold(pad, event.pointerId, event.clientY);

              return;
            }

            /*
             * EDIT MODE
             */
            if (sampler.mode !== "edit") {
              return;
            }

            if (event.target.closest(".padControls")) {
              return;
            }

            event.preventDefault();

            try {
              element.setPointerCapture(event.pointerId);
            } catch (error) {}

            startX = event.clientX;

            startY = event.clientY;

            startPadX = pad.x;

            startPadY = pad.y;

            startWidth = pad.width;

            startHeight = pad.height;

            pointerDownTime = Date.now();

            moved = false;

            if (event.target === resizeHandle) {
              action = "resize";

              selectPad(pad);

              return;
            }

            action = "none";

            if (sampler.recordingPad === pad) {
              selectPad(pad);

              return;
            }

            const now = Date.now();

            const timeSinceLastTap = now - pad.lastTapTime;

            /*
             * 第二次點擊：
             * 啟動錄音。
             */
            if (pad.lastTapTime > 0 && timeSinceLastTap < DOUBLE_TAP_TIME) {
              pad.lastTapTime = 0;

              pad.pendingDoubleTap = true;

              startRecording(pad);
            } else {
              /*
               * 第一次點擊：
               * 選取 + 預覽。
               */
              pad.lastTapTime = now;

              pad.pendingDoubleTap = false;

              selectPad(pad);

              playPad(pad);
            }
          },
          { passive: false },
        );

        element.addEventListener(
          "pointermove",
          (event) => {
            /*
             * PLAY MODE：
             *
             * 不拖曳 PAD。
             *
             * Y 軸移動用來控制 retrigger speed。
             */
            if (sampler.mode === "play") {
              event.preventDefault();

              if (pad.holding && pad.holdPointerId === event.pointerId) {
                updatePadHoldSpeed(pad, event.clientY);
              }

              return;
            }

            if (sampler.mode !== "edit") {
              return;
            }

            if (action === null) {
              return;
            }

            if (sampler.recordingPad === pad) {
              return;
            }

            const dx = event.clientX - startX;

            const dy = event.clientY - startY;

            const distance = Math.sqrt(dx * dx + dy * dy);

            if (action === "resize") {
              moved = true;

              pad.width = Math.max(3, startWidth + pxToPercentX(dx));

              pad.height = Math.max(3, startHeight + pxToPercentY(dy));

              updatePad(pad);

              return;
            }

            if (distance > DRAG_THRESHOLD) {
              moved = true;

              action = "drag";

              pad.lastTapTime = 0;

              pad.x = startPadX + pxToPercentX(dx);

              pad.y = startPadY + pxToPercentY(dy);

              updatePad(pad);
            }
          },
          { passive: false },
        );

        element.addEventListener(
          "pointerup",
          (event) => {
            /*
             * PLAY MODE：
             * 放開就停止 retrigger。
             */
            if (sampler.mode === "play") {
              event.preventDefault();

              stopPadHold(pad, event.pointerId);

              try {
                element.releasePointerCapture(event.pointerId);
              } catch (error) {}

              return;
            }

            if (sampler.mode !== "edit") {
              return;
            }

            if (moved) {
              action = null;

              return;
            }

            if (sampler.recordingPad === pad && !pad.pendingDoubleTap) {
              stopRecording();

              action = null;

              return;
            }

            if (pad.pendingDoubleTap) {
              pad.pendingDoubleTap = false;

              action = null;

              return;
            }

            const duration = Date.now() - pointerDownTime;

            if (duration >= CLICK_TIME) {
              pad.lastTapTime = 0;

              action = null;

              return;
            }

            action = null;
          },
          { passive: false },
        );

        element.addEventListener(
          "pointercancel",
          (event) => {
            if (sampler.mode === "play") {
              event.preventDefault();

              stopPadHold(pad, event.pointerId);

              return;
            }

            action = null;

            pad.pendingDoubleTap = false;
          },
          { passive: false },
        );

        /*
         * iPad Safari / pointer capture 特別重要。
         *
         * 如果手指滑出 PAD 後 Safari 發生
         * lostpointercapture，也必須停止聲音。
         */
        element.addEventListener("lostpointercapture", () => {
          if (sampler.mode === "play") {
            stopPadHold(pad);

            return;
          }

          action = null;

          pad.pendingDoubleTap = false;
        });
      }

      /* =====================================================
         IMAGE
      ===================================================== */

      addImageButton.addEventListener("click", () => {
        if (sampler.mode !== "edit") {
          return;
        }

        imageInput.value = "";

        imageInput.click();
      });

      imageInput.addEventListener("change", (event) => {
        const files = Array.from(event.target.files || []);

        files.forEach((file) => {
          createImage(file);
        });

        imageInput.value = "";
      });

      function createImage(file) {
        const id = sampler.nextImageId++;

        const image = {
          id,

          x: 10 + Math.random() * 30,

          y: 10 + Math.random() * 30,

          width: 30,

          height: 30,

          url: URL.createObjectURL(file),

          element: null,
        };

        sampler.images.push(image);

        renderImage(image);

        selectImage(image);
      }

      function renderImage(image) {
        const wrapper = document.createElement("div");

        wrapper.className = "imageItem";

        wrapper.style.left = image.x + "%";

        wrapper.style.top = image.y + "%";

        wrapper.style.width = image.width + "%";

        wrapper.style.height = image.height + "%";

        const img = document.createElement("img");

        img.src = image.url;

        img.draggable = false;

        img.style.width = "100%";

        img.style.height = "100%";

        img.style.objectFit = "fill";

        img.style.pointerEvents = "none";

        const resizeHandle = document.createElement("div");

        resizeHandle.className = "imageResizeHandle";

        wrapper.appendChild(img);

        wrapper.appendChild(resizeHandle);

        canvas.appendChild(wrapper);

        image.element = wrapper;

        setupImageInteraction(image, wrapper, resizeHandle);
      }

      function updateImage(image) {
        if (!image.element) {
          return;
        }

        image.element.style.left = image.x + "%";

        image.element.style.top = image.y + "%";

        image.element.style.width = image.width + "%";

        image.element.style.height = image.height + "%";
      }

      /* =====================================================
         IMAGE INTERACTION
      ===================================================== */

      function setupImageInteraction(image, element, resizeHandle) {
        let startX;

        let startY;

        let startImageX;

        let startImageY;

        let startWidth;

        let startHeight;

        let action = null;

        element.addEventListener(
          "pointerdown",
          (event) => {
            if (sampler.mode !== "edit") {
              return;
            }

            event.preventDefault();

            try {
              element.setPointerCapture(event.pointerId);
            } catch (error) {}

            selectImage(image);

            startX = event.clientX;

            startY = event.clientY;

            startImageX = image.x;

            startImageY = image.y;

            startWidth = image.width;

            startHeight = image.height;

            if (event.target === resizeHandle) {
              action = "resize";
            } else {
              action = "drag";
            }
          },
          { passive: false },
        );

        element.addEventListener(
          "pointermove",
          (event) => {
            if (sampler.mode !== "edit") {
              return;
            }

            if (!action) {
              return;
            }

            event.preventDefault();

            const dx = event.clientX - startX;

            const dy = event.clientY - startY;

            if (action === "drag") {
              image.x = startImageX + pxToPercentX(dx);

              image.y = startImageY + pxToPercentY(dy);
            }

            if (action === "resize") {
              image.width = Math.max(3, startWidth + pxToPercentX(dx));

              image.height = Math.max(3, startHeight + pxToPercentY(dy));
            }

            updateImage(image);
          },
          { passive: false },
        );

        element.addEventListener("pointerup", () => {
          action = null;
        });

        element.addEventListener("pointercancel", () => {
          action = null;
        });

        element.addEventListener("lostpointercapture", () => {
          action = null;
        });
      }

      /* =====================================================
         DELETE
      ===================================================== */

      function deleteSelected() {
        if (sampler.selectedPad) {
          const pad = sampler.selectedPad;

          stopPadHold(pad);

          if (sampler.recordingPad === pad) {
            stopRecording();
          }

          if (pad.audioURL) {
            URL.revokeObjectURL(pad.audioURL);
          }

          if (pad.element) {
            pad.element.remove();
          }

          sampler.pads = sampler.pads.filter((p) => p !== pad);

          sampler.selectedPad = null;

          return;
        }

        if (sampler.selectedImage) {
          const image = sampler.selectedImage;

          if (image.url) {
            URL.revokeObjectURL(image.url);
          }

          if (image.element) {
            image.element.remove();
          }

          sampler.images = sampler.images.filter((img) => img !== image);

          sampler.selectedImage = null;
        }
      }

      deleteButton.addEventListener("click", deleteSelected);

      /* =====================================================
         DELETE KEY
      ===================================================== */

      document.addEventListener("keydown", (event) => {
        if (sampler.mode !== "edit") {
          return;
        }

        if (event.key !== "Delete" && event.key !== "Backspace") {
          return;
        }

        const tag = document.activeElement?.tagName;

        if (tag === "INPUT" || tag === "TEXTAREA") {
          return;
        }

        event.preventDefault();

        deleteSelected();
      });

      /* =====================================================
         PAD RECORDING
      ===================================================== */

      async function startRecording(pad) {
        if (sampler.recordingPad) {
          return;
        }

        try {
          initAudio();

          if (!sampler.mediaStream) {
            sampler.mediaStream = await navigator.mediaDevices.getUserMedia({
              audio: true,
            });
          }

          await resumeAudio();

          if (typeof MediaRecorder === "undefined") {
            throw new Error("MediaRecorder unsupported");
          }

          if (sampler.recordingPad) {
            return;
          }

          const mimeType = getRecordingMimeType();

          const options = mimeType ? { mimeType } : undefined;

          sampler.recordingPad = pad;

          sampler.chunks = [];

          sampler.recorder = new MediaRecorder(sampler.mediaStream, options);

          sampler.recorder.ondataavailable = (event) => {
            if (event.data.size > 0) {
              sampler.chunks.push(event.data);
            }
          };

          sampler.recorder.onstop = async () => {
            try {
              const recorder = sampler.recorder;

              const actualType = recorder?.mimeType || mimeType || "audio/mp4";

              const blob = new Blob(sampler.chunks, {
                type: actualType,
              });

              if (pad.audioURL) {
                URL.revokeObjectURL(pad.audioURL);
              }

              pad.audioURL = URL.createObjectURL(blob);

              const arrayBuffer = await blob.arrayBuffer();

              const decodedBuffer =
                await sampler.audioContext.decodeAudioData(arrayBuffer);

              pad.audioBuffer = trimAudioBuffer(decodedBuffer);

              updatePadStatus(pad, "READY");
            } catch (error) {
              console.error("Audio decode error:", error);

              updatePadStatus(pad, "ERROR");
            }

            sampler.recordingPad = null;

            sampler.recorder = null;

            sampler.chunks = [];
          };

          sampler.recorder.start();

          sampler.recordingStartTime = Date.now();

          clearInterval(sampler.recordingTimer);

          sampler.recordingTimer = setInterval(updateRecordingTimer, 1000);

          pad.element.classList.add("recording");

          updateRecordingText(pad, "● REC 00:00");
        } catch (error) {
          console.error("Recording error:", error);

          sampler.recordingPad = null;

          sampler.recorder = null;

          clearInterval(sampler.recordingTimer);

          sampler.recordingTimer = null;

          if (pad.element) {
            pad.element.classList.remove("recording");
          }

          alert(
            "無法開始錄音。\n\n" + "請確認網站使用 HTTPS，並允許麥克風權限。",
          );
        }
      }

      function updateRecordingTimer() {
        if (!sampler.recordingPad) {
          return;
        }

        const elapsed = Math.floor(
          (Date.now() - sampler.recordingStartTime) / 1000,
        );

        const minutes = String(Math.floor(elapsed / 60)).padStart(2, "0");

        const seconds = String(elapsed % 60).padStart(2, "0");

        updateRecordingText(
          sampler.recordingPad,
          `● REC ${minutes}:${seconds}`,
        );
      }

      function stopRecording() {
        if (!sampler.recorder) {
          return;
        }

        if (sampler.recorder.state !== "inactive") {
          sampler.recorder.stop();
        }

        clearInterval(sampler.recordingTimer);

        sampler.recordingTimer = null;

        if (sampler.recordingPad) {
          sampler.recordingPad.element.classList.remove("recording");
        }
      }

      function updatePadStatus(pad, status) {
        const element = pad.element?.querySelector(".recordStatus");

        if (element) {
          element.textContent = status;
        }
      }

      function updatePadHoldSpeedUI(pad) {
        const element = pad.element?.querySelector(".recordStatus");

        if (!element) {
          return;
        }

        if (!pad.holding) {
          return;
        }

        element.textContent = `RETRIGGER ${Math.round(pad.holdInterval)}ms`;
      }

      function updateRecordingText(pad, text) {
        const element = pad.element?.querySelector(".recordStatus");

        if (element) {
          element.textContent = text;
        }
      }

      /* =====================================================
         PLAY PAD — NORMAL PREVIEW
      ===================================================== */

      function playPad(pad, options = {}) {
        if (!pad.audioBuffer) {
          return null;
        }

        initAudio();

        if (sampler.audioContext.state === "suspended") {
          sampler.audioContext.resume();
        }

        const padGain = sampler.audioContext.createGain();

        padGain.gain.value = pad.volume;

        padGain.connect(sampler.masterGain);

        const source = sampler.audioContext.createBufferSource();

        source.buffer = pad.audioBuffer;

        source.connect(padGain);

        const startTime =
          options.startTime !== undefined
            ? options.startTime
            : sampler.audioContext.currentTime;

        source.start(startTime);

        if (pad.element) {
          pad.element.classList.add("playing");
        }

        source.onended = () => {
          if (pad.element) {
            /*
             * 如果此時不是 hold，
             * 才移除 playing。
             */
            if (!pad.holding) {
              pad.element.classList.remove("playing");
            }
          }

          try {
            source.disconnect();
          } catch (error) {}

          try {
            padGain.disconnect();
          } catch (error) {}
        };

        return source;
      }

      /* =====================================================
         LOOP EVENT RECORDING
      ===================================================== */

      async function startLoopRecording() {
        if (sampler.loopRecording) {
          return;
        }

        if (sampler.mode !== "play") {
          return;
        }

        try {
          await resumeAudio();
        } catch (error) {
          console.error(error);

          return;
        }

        sampler.loopRecording = true;

        sampler.cancelLoopRecording = false;

        sampler.loopEvents = [];

        sampler.loopRecordingStartTime = sampler.audioContext.currentTime;

        loopButton.classList.add("recording");

        loopButton.textContent = "RECORDING";

        canvas.classList.add("loopRecording");
      }

      /* =====================================================
         RECORD PAD EVENT
      ===================================================== */

      function recordPadEvent(pad) {
        if (!sampler.loopRecording) {
          return;
        }

        if (sampler.loopRecordingStartTime === null) {
          return;
        }

        const now = sampler.audioContext.currentTime;

        const time = now - sampler.loopRecordingStartTime;

        sampler.loopEvents.push({
          pad: pad,
          time: Math.max(0, time),
        });
      }

      /* =====================================================
         STOP LOOP RECORDING
      ===================================================== */

      function stopLoopRecording() {
        if (!sampler.loopRecording) {
          return;
        }

        sampler.loopRecording = false;

        loopButton.classList.remove("recording");

        loopButton.textContent = "LOOP";

        canvas.classList.remove("loopRecording");

        if (sampler.cancelLoopRecording) {
          sampler.cancelLoopRecording = false;

          sampler.loopEvents = [];

          sampler.loopRecordingStartTime = null;

          return;
        }

        finishLoopRecording();
      }

      /* =====================================================
         FINISH LOOP
      ===================================================== */

      function finishLoopRecording() {
        const events = sampler.loopEvents.map((event) => ({
          pad: event.pad,
          time: event.time,
        }));

        const recordingStart = sampler.loopRecordingStartTime;

        const recordingEndTime = sampler.audioContext.currentTime;

        sampler.loopEvents = [];

        sampler.loopRecordingStartTime = null;

        if (recordingStart === null) {
          return;
        }

        let duration = recordingEndTime - recordingStart;

        duration = Math.max(0.05, duration);

        if (sampler.loopDuration === null) {
          sampler.loopDuration = duration;

          updateLoopDurationUI();
        }

        duration = sampler.loopDuration;

        if (!events.length) {
          console.warn("Loop contains no Pad events.");

          return;
        }

        const validEvents = events.filter(
          (event) => event.time >= 0 && event.time < duration,
        );

        if (!validEvents.length) {
          console.warn("Loop contains no valid Pad events.");

          return;
        }

        const loop = {
          id: sampler.nextLoopId++,

          duration: duration,

          events: validEvents,

          muted: false,

          scheduledSources: [],

          gain: null,

          schedulerTimer: null,

          schedulerGeneration: 0,

          schedulerActive: false,

          startTime: null,
        };

        sampler.loops.push(loop);

        renderLoopLayers();

        startLoopScheduler(loop);
      }

      /* =====================================================
         STOP ONE LOOP
      ===================================================== */

      function stopLoopScheduler(loop) {
        if (!loop) {
          return;
        }

        loop.schedulerGeneration++;

        loop.schedulerActive = false;

        if (loop.schedulerTimer !== null) {
          clearTimeout(loop.schedulerTimer);

          loop.schedulerTimer = null;
        }

        if (loop.scheduledSources && loop.scheduledSources.length) {
          loop.scheduledSources.forEach((source) => {
            try {
              source.onended = null;
            } catch (error) {}

            try {
              source.stop();
            } catch (error) {}

            try {
              source.disconnect();
            } catch (error) {}

            const index = sampler.loopSources.indexOf(source);

            if (index !== -1) {
              sampler.loopSources.splice(index, 1);
            }
          });
        }

        loop.scheduledSources = [];

        if (loop.gain) {
          try {
            loop.gain.disconnect();
          } catch (error) {}
        }

        loop.gain = null;

        loop.startTime = null;
      }

      /* =====================================================
         STOP ALL LOOP SOURCES
      ===================================================== */

      function stopAllLoopSources() {
        sampler.loops.forEach((loop) => {
          stopLoopScheduler(loop);
        });

        sampler.loopSources.forEach((source) => {
          try {
            source.onended = null;
          } catch (error) {}

          try {
            source.stop();
          } catch (error) {}

          try {
            source.disconnect();
          } catch (error) {}
        });

        sampler.loopSources = [];
      }

      /* =====================================================
         START ONE LOOP
      ===================================================== */

      function startLoopScheduler(loop) {
        if (!loop) {
          return;
        }

        if (!sampler.loops.includes(loop)) {
          return;
        }

        if (!loop.events.length) {
          return;
        }

        initAudio();

        if (sampler.audioContext.state === "suspended") {
          sampler.audioContext.resume();
        }

        if (loop.schedulerActive) {
          return;
        }

        loop.schedulerGeneration++;

        const generation = loop.schedulerGeneration;

        loop.schedulerActive = true;

        const gain = sampler.audioContext.createGain();

        gain.gain.setValueAtTime(
          loop.muted ? 0 : 1,
          sampler.audioContext.currentTime,
        );

        gain.connect(sampler.masterGain);

        loop.gain = gain;

        loop.startTime = sampler.audioContext.currentTime + 0.05;

        scheduleLoopCycle(loop, loop.startTime, generation);
      }

      /* =====================================================
         LOOP CYCLE
      ===================================================== */

      function scheduleLoopCycle(loop, cycleStartTime, generation) {
        if (!loop.schedulerActive) {
          return;
        }

        if (loop.schedulerGeneration !== generation) {
          return;
        }

        if (!sampler.loops.includes(loop)) {
          return;
        }

        if (sampler.mode !== "play") {
          return;
        }

        if (!loop.events.length) {
          return;
        }

        if (!loop.gain) {
          return;
        }

        loop.events.forEach((event) => {
          if (!event.pad || !event.pad.audioBuffer) {
            return;
          }

          const source = sampler.audioContext.createBufferSource();

          source.buffer = event.pad.audioBuffer;

          const padGain = sampler.audioContext.createGain();

          padGain.gain.value = event.pad.volume;

          padGain.connect(loop.gain);

          source.connect(padGain);

          const startTime = cycleStartTime + event.time;

          if (startTime < sampler.audioContext.currentTime) {
            try {
              source.disconnect();
            } catch (error) {}

            try {
              padGain.disconnect();
            } catch (error) {}

            return;
          }

          source.start(startTime);

          sampler.loopSources.push(source);

          loop.scheduledSources.push(source);

          source.onended = () => {
            const globalIndex = sampler.loopSources.indexOf(source);

            if (globalIndex !== -1) {
              sampler.loopSources.splice(globalIndex, 1);
            }

            const loopIndex = loop.scheduledSources.indexOf(source);

            if (loopIndex !== -1) {
              loop.scheduledSources.splice(loopIndex, 1);
            }

            try {
              source.disconnect();
            } catch (error) {}

            try {
              padGain.disconnect();
            } catch (error) {}
          };
        });

        const nextCycle = cycleStartTime + loop.duration;

        const delay = Math.max(
          10,
          (nextCycle - sampler.audioContext.currentTime - 0.05) * 1000,
        );

        loop.schedulerTimer = setTimeout(() => {
          loop.schedulerTimer = null;

          if (!loop.schedulerActive) {
            return;
          }

          if (loop.schedulerGeneration !== generation) {
            return;
          }

          if (!sampler.loops.includes(loop)) {
            return;
          }

          if (sampler.mode !== "play") {
            return;
          }

          scheduleLoopCycle(loop, nextCycle, generation);
        }, delay);
      }

      /* =====================================================
         LEGACY COMPATIBILITY
      ===================================================== */

      function restartAllLoops() {
        if (!sampler.loops.length) {
          return;
        }

        stopAllLoopSources();

        sampler.loops.forEach((loop) => {
          startLoopScheduler(loop);
        });
      }

      /* =====================================================
         LOOP LAYERS
      ===================================================== */

      function renderLoopLayers() {
        loopLayers.innerHTML = "";

        sampler.loops.forEach((loop) => {
          const layer = document.createElement("div");

          layer.className = "loopLayer";

          if (loop.muted) {
            layer.classList.add("muted");
          }

          const name = document.createElement("div");

          name.className = "loopLayerName";

          name.textContent = `LOOP ${loop.id}`;

          const muteButton = document.createElement("button");

          muteButton.className = "muteButton";

          muteButton.textContent = loop.muted ? "MUTED" : "MUTE";

          if (loop.muted) {
            muteButton.classList.add("active");
          }

          muteButton.addEventListener("click", (event) => {
            event.stopPropagation();

            toggleLoopMute(loop);
          });

          layer.appendChild(name);

          layer.appendChild(muteButton);

          loopLayers.appendChild(layer);
        });

        if (sampler.loops.length > 0) {
          resetLoopButton.classList.add("visible");
        } else {
          resetLoopButton.classList.remove("visible");
        }
      }

      /* =====================================================
         MUTE
      ===================================================== */

      function toggleLoopMute(loop) {
        loop.muted = !loop.muted;

        if (loop.gain) {
          const now = sampler.audioContext.currentTime;

          loop.gain.gain.cancelScheduledValues(now);

          loop.gain.gain.setValueAtTime(loop.muted ? 0 : 1, now);
        }

        renderLoopLayers();
      }

      /* =====================================================
         LOOP DURATION UI
      ===================================================== */

      function updateLoopDurationUI() {
        const element = document.querySelector(".loopDuration");

        if (!sampler.loopDuration) {
          element.textContent = "LOOP: —";

          return;
        }

        element.textContent = `LOOP: ${sampler.loopDuration.toFixed(2)}s`;
      }

      /* =====================================================
         RESET LOOP
      ===================================================== */

      function resetLoops() {
        stopAllLoopSources();

        sampler.loops = [];

        sampler.nextLoopId = 1;

        sampler.loopDuration = null;

        sampler.loopRecording = false;

        sampler.loopRecordingStartTime = null;

        sampler.loopRecordingPointerId = null;

        sampler.loopPressing = false;

        sampler.spacePressed = false;

        sampler.loopEvents = [];

        sampler.cancelLoopRecording = false;

        sampler.loopSchedulerTimers.clear();

        sampler.loopSchedulerGeneration.clear();

        loopButton.classList.remove("recording");

        loopButton.textContent = "LOOP";

        canvas.classList.remove("loopRecording");

        updateLoopDurationUI();

        renderLoopLayers();
      }

      resetLoopButton.addEventListener("click", (event) => {
        event.preventDefault();

        event.stopPropagation();

        resetLoops();
      });

      /* =====================================================
         LOOP BUTTON — POINTER DOWN
      ===================================================== */

      loopButton.addEventListener(
        "pointerdown",
        async (event) => {
          if (sampler.mode !== "play") {
            return;
          }

          event.preventDefault();

          try {
            loopButton.setPointerCapture(event.pointerId);
          } catch (error) {}

          sampler.loopPressing = true;

          sampler.loopRecordingPointerId = event.pointerId;

          await startLoopRecording();
        },
        { passive: false },
      );

      /* =====================================================
         LOOP BUTTON — POINTER UP
      ===================================================== */

      loopButton.addEventListener(
        "pointerup",
        (event) => {
          if (sampler.loopRecordingPointerId !== event.pointerId) {
            return;
          }

          event.preventDefault();

          sampler.loopPressing = false;

          sampler.loopRecordingPointerId = null;

          stopLoopRecording();
        },
        { passive: false },
      );

      /* =====================================================
         POINTER CANCEL
      ===================================================== */

      loopButton.addEventListener("pointercancel", () => {
        sampler.loopPressing = false;

        sampler.loopRecordingPointerId = null;

        stopLoopRecording();
      });

      /* =====================================================
         LOST POINTER CAPTURE
      ===================================================== */

      loopButton.addEventListener("lostpointercapture", () => {
        if (sampler.loopPressing) {
          sampler.loopPressing = false;

          stopLoopRecording();
        }
      });

      /* =====================================================
         SPACE
      ===================================================== */

      document.addEventListener("keydown", (event) => {
        if (sampler.mode !== "play") {
          return;
        }

        if (event.code !== "Space") {
          return;
        }

        event.preventDefault();

        if (event.repeat || sampler.spacePressed) {
          return;
        }

        sampler.spacePressed = true;

        startLoopRecording();
      });

      document.addEventListener("keyup", (event) => {
        if (event.code !== "Space") {
          return;
        }

        event.preventDefault();

        sampler.spacePressed = false;

        if (sampler.mode === "play") {
          stopLoopRecording();
        }
      });

      /* =====================================================
         PLAY MODE
      ===================================================== */

      async function enablePlayMode() {
        if (sampler.recordingPad) {
          stopRecording();
        }

        sampler.mode = "play";

        clearSelection();

        canvas.classList.add("playMode");

        editModeButton.classList.remove("active");

        playModeButton.classList.add("active");

        addPadButton.style.display = "none";

        addImageButton.style.display = "none";

        importPadButton.style.display = "none";

        renamePadButton.style.display = "none";

        deleteButton.style.display = "none";

        document.body.classList.add("playMode");

        loopArea.style.display = "flex";

        try {
          await resumeAudio();

          setMasterVolume(sampler.masterVolume);

          if (sampler.loops.length > 0) {
            sampler.loops.forEach((loop) => {
              startLoopScheduler(loop);
            });
          }
        } catch (error) {
          console.error(error);
        }
      }

      /* =====================================================
         EDIT MODE
      ===================================================== */

      function enableEditMode() {
        /*
         * 先停止所有長按 Pad。
         */
        stopAllPadHolds();

        if (sampler.loopRecording) {
          sampler.cancelLoopRecording = true;

          sampler.loopPressing = false;

          stopLoopRecording();
        }

        stopAllLoopSources();

        sampler.mode = "edit";

        sampler.spacePressed = false;

        sampler.loopPressing = false;

        canvas.classList.remove("playMode");

        canvas.classList.remove("loopRecording");

        document.body.classList.remove("playMode");

        loopButton.classList.remove("recording");

        loopButton.textContent = "LOOP";

        loopArea.style.display = "none";

        editModeButton.classList.add("active");

        playModeButton.classList.remove("active");

        addPadButton.style.display = "block";

        addImageButton.style.display = "block";

        importPadButton.style.display = "block";

        renamePadButton.style.display = "block";

        deleteButton.style.display = "block";
      }

      /* =====================================================
         MODE BUTTONS
      ===================================================== */

      editModeButton.addEventListener("click", enableEditMode);

      playModeButton.addEventListener("click", enablePlayMode);

      /* =====================================================
         ADD PAD
      ===================================================== */

      addPadButton.addEventListener("click", () => {
        if (sampler.mode !== "edit") {
          return;
        }

        createPad(10 + Math.random() * 50, 10 + Math.random() * 50);
      });

      /* =====================================================
         WINDOW RESIZE
      ===================================================== */

      window.addEventListener("resize", () => {
        sampler.pads.forEach(updatePad);

        sampler.images.forEach(updateImage);
      });

      /* =====================================================
         PAGE VISIBILITY
      ===================================================== */

      document.addEventListener("visibilitychange", () => {
        /*
         * 離開頁面時：
         * 長按 PAD 一定要停止。
         */
        if (document.hidden) {
          stopAllPadHolds();

          if (sampler.mode === "play") {
            stopAllLoopSources();
          }
        }

        if (
          !document.hidden &&
          sampler.mode === "play" &&
          sampler.loops.length > 0
        ) {
          resumeAudio().then(() => {
            sampler.loops.forEach((loop) => {
              startLoopScheduler(loop);
            });
          });
        }
      });

      /* =====================================================
         WINDOW BLUR
      ===================================================== */

      /*
       * 平板切換 App / Safari 狀態改變時，
       * 確保長按 PAD 不會卡住。
       */
      window.addEventListener("blur", () => {
        stopAllPadHolds();
      });

      /* =====================================================
         INITIAL PADS
      ===================================================== */

      createPad(10, 10);

      createPad(32, 18);

      /* =====================================================
         INITIAL LOOP UI
      ===================================================== */

      renderLoopLayers();

      updateLoopDurationUI();

      setMasterVolume(1);
    </script>
  </body>
</html>
