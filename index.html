<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <title>Visual Sampler</title>

    <style>
      /* =====================================================
     GLOBAL
  ===================================================== */

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;

        width: 100%;
        height: 100%;

        overflow: hidden;

        font-family: Arial, sans-serif;

        background: white;
        color: black;

        overscroll-behavior: none;
      }

      body {
        -webkit-user-select: none;
        user-select: none;

        -webkit-touch-callout: none;
      }

      button,
      input {
        font-family: inherit;
      }

      /* =====================================================
     TOOLBAR
  ===================================================== */

      .toolbar {
        position: fixed;

        top: 0;
        left: 0;
        right: 0;

        height: 60px;

        display: flex;
        align-items: center;

        gap: 8px;

        padding: 10px 15px;

        background: white;

        border-bottom: 1px solid black;

        z-index: 1000;

        overflow-x: auto;
        overflow-y: hidden;

        -webkit-overflow-scrolling: touch;
      }

      button {
        flex-shrink: 0;

        border: 1px solid black;

        background: white;
        color: black;

        border-radius: 0;

        padding: 8px 14px;

        font-size: 14px;

        cursor: pointer;

        touch-action: manipulation;

        -webkit-tap-highlight-color: transparent;
      }

      button:hover {
        background: #eee;
      }

      button:active {
        background: #ddd;
      }

      .modeButton.active {
        background: black;
        color: white;
      }

      #addPad {
        margin-left: auto;
      }

      /*
     IMPORTANT

     不再動態建立 audio input。
     直接使用 HTML 裡的 #audioInput。
  */

      #imageInput,
      #audioInput {
        position: fixed;

        width: 1px;
        height: 1px;

        opacity: 0;

        pointer-events: none;
      }

      /* =====================================================
     CANVAS
  ===================================================== */

      #canvas {
        position: fixed;

        left: 0;
        right: 0;

        top: 60px;
        bottom: 0;

        width: 100%;

        overflow: hidden;

        background: white;
      }

      /* =====================================================
     IMAGE OBJECT
  ===================================================== */

      .imageItem {
        position: absolute;

        user-select: none;
        -webkit-user-select: none;

        touch-action: none;

        cursor: pointer;

        z-index: 2;
      }

      .imageItem.selected {
        outline: 2px dashed black;
        outline-offset: 2px;
      }

      .imageResizeHandle {
        position: absolute;

        width: 14px;
        height: 14px;

        right: -2px;
        bottom: -2px;

        background: black;

        cursor: nwse-resize;

        touch-action: none;

        z-index: 5;
      }

      /* =====================================================
     PAD
  ===================================================== */

      .pad {
        position: absolute;

        width: 15%;
        height: 15%;

        background: transparent;

        border: 2px solid white;

        border-radius: 0;

        display: flex;

        align-items: center;
        justify-content: center;

        user-select: none;
        -webkit-user-select: none;

        touch-action: none;

        cursor: pointer;

        z-index: 10;

        mix-blend-mode: difference;

        -webkit-tap-highlight-color: transparent;
      }

      .pad.selected {
        border: 4px solid white;
      }

      .pad.recording {
        border: 3px dashed white;
      }

      .pad.playing {
        transform: scale(0.96);
      }

      .padContent {
        text-align: center;

        pointer-events: none;

        color: white;
      }

      .padName {
        font-size: 16px;
      }

      .recordStatus {
        margin-top: 6px;

        font-size: 12px;

        opacity: 0.7;
      }

      .resizeHandle {
        position: absolute;

        width: 14px;
        height: 14px;

        right: -2px;
        bottom: -2px;

        background: white;

        cursor: nwse-resize;

        touch-action: none;

        z-index: 5;

        mix-blend-mode: difference;
      }

      /* =====================================================
     PLAY MODE
  ===================================================== */

      #canvas.playMode .resizeHandle,
      #canvas.playMode .imageResizeHandle {
        display: none;
      }

      #canvas.playMode .recordStatus {
        display: none;
      }

      /* =====================================================
     LOOP AREA
  =====================================================

     IMPORTANT FOR iPAD

     舊版本：

       position: absolute;
       bottom: 0;
       transform: translateY(100%);

     iPad Safari 在 100vh / pointer / viewport
     情況下可能造成 Loop Area 看不到。

     新版本直接 fixed。
  */

      .loopArea {
        position: fixed;

        left: 0;
        right: 0;
        bottom: 0;

        min-height: 72px;

        padding: 10px 15px calc(10px + env(safe-area-inset-bottom));

        display: flex;

        align-items: center;

        gap: 15px;

        background: white;

        border-top: 1px solid black;

        z-index: 2000;

        /*
       預設藏起來
    */

        display: none;

        /*
       iOS Safari
    */

        -webkit-transform: translateZ(0);
        transform: translateZ(0);

        /*
       避免 iPad touch scrolling 把整個 loop bar 拖走
    */

        touch-action: none;
      }

      /*
     PLAY MODE 時直接顯示。

     不使用 transform。
  */

      #canvas.playMode .loopArea {
        display: flex;
      }

      /* =====================================================
     LOOP BUTTON
  ===================================================== */

      .loopButton {
        width: 80px;
        height: 48px;

        flex-shrink: 0;

        padding: 0;

        font-size: 14px;

        border: 2px solid black;

        background: white;

        user-select: none;
        -webkit-user-select: none;

        touch-action: none;

        -webkit-tap-highlight-color: transparent;
      }

      .loopButton.recording {
        background: black;
        color: white;
      }

      .loopButton.recording::before {
        content: "● ";
      }

      /* =====================================================
     RESET LOOP
  ===================================================== */

      .resetLoopButton {
        height: 48px;

        flex-shrink: 0;

        padding: 0 12px;

        font-size: 12px;

        border: 1px solid black;

        background: white;

        display: none;

        touch-action: manipulation;
      }

      .resetLoopButton.visible {
        display: block;
      }

      .resetLoopButton:hover {
        background: #eee;
      }

      /* =====================================================
     LOOP INFO
  ===================================================== */

      .loopInfo {
        width: 100px;

        flex-shrink: 0;

        font-size: 12px;

        line-height: 1.5;
      }

      .loopDuration {
        font-size: 13px;
      }

      .loopHint {
        opacity: 0.5;
      }

      /* =====================================================
     LOOP LAYERS
  ===================================================== */

      .loopLayers {
        flex: 1;

        min-width: 0;

        display: flex;

        align-items: center;

        gap: 8px;

        overflow-x: auto;
        overflow-y: hidden;

        scrollbar-width: none;

        -webkit-overflow-scrolling: touch;

        touch-action: pan-x;
      }

      .loopLayers::-webkit-scrollbar {
        display: none;
      }

      .loopLayer {
        min-width: 105px;

        height: 48px;

        display: flex;

        align-items: center;

        gap: 7px;

        padding: 5px 7px;

        border: 1px solid black;

        background: white;

        flex-shrink: 0;
      }

      .loopLayer.muted {
        opacity: 0.35;
      }

      .loopLayerName {
        flex: 1;

        min-width: 0;

        font-size: 12px;

        white-space: nowrap;

        overflow: hidden;

        text-overflow: ellipsis;
      }

      .muteButton {
        padding: 5px 7px;

        font-size: 11px;

        flex-shrink: 0;

        touch-action: manipulation;
      }

      .muteButton.active {
        background: black;
        color: white;
      }

      /* =====================================================
     RECORDING INDICATOR
  ===================================================== */

      .loopRecordingIndicator {
        position: fixed;

        left: 50%;

        bottom: calc(85px + env(safe-area-inset-bottom));

        transform: translateX(-50%);

        padding: 7px 12px;

        background: black;
        color: white;

        font-size: 12px;

        z-index: 2100;

        display: none;

        pointer-events: none;
      }

      #canvas.loopRecording .loopRecordingIndicator {
        display: block;
      }

      /* =====================================================
     HELP
  ===================================================== */

      .help {
        position: absolute;

        left: 15px;
        bottom: 15px;

        font-size: 12px;

        opacity: 0.6;

        pointer-events: none;

        z-index: 50;
      }

      #canvas.playMode .help {
        display: none;
      }

      /* =====================================================
     iPAD / SMALL SCREEN
  ===================================================== */

      @media (max-width: 800px) {
        .toolbar {
          gap: 6px;

          padding-left: 10px;
          padding-right: 10px;
        }

        button {
          padding: 8px 10px;

          font-size: 13px;
        }

        #addPad {
          margin-left: 0;
        }

        .loopArea {
          min-height: 82px;

          padding-left: 10px;
          padding-right: 10px;

          gap: 8px;
        }

        .loopButton {
          width: 76px;
          height: 48px;
        }

        .resetLoopButton {
          padding: 0 8px;
        }

        .loopInfo {
          width: 85px;
        }

        .loopLayers {
          gap: 6px;
        }

        .loopLayer {
          min-width: 100px;
        }
      }

      /* =====================================================
     VERY SMALL SCREEN
  ===================================================== */

      @media (max-width: 500px) {
        .loopInfo {
          display: none;
        }

        .loopArea {
          gap: 6px;
        }
      }
    </style>
  </head>

  <body>
    <!-- =====================================================
     TOOLBAR
===================================================== -->

    <div class="toolbar">
      <button id="editMode" class="modeButton active">EDIT</button>

      <button id="playMode" class="modeButton">PLAY</button>

      <button id="addPad">+ PAD</button>

      <button id="importPad">IMPORT PAD</button>

      <button id="addImage">+ IMAGE</button>

      <button id="renamePad">RENAME</button>

      <button id="deleteButton">DELETE</button>

      <!-- ===================================================
       AUDIO FILE INPUT

       IMPORTANT:
       直接放在 HTML。

       iPad Safari 比動態建立 input 更穩定。
  ==================================================== -->

      <input
        type="file"
        id="audioInput"
        accept="
      .mp3,
      .m4a,
      .wav,
      .aac,
      .aiff,
      .aif,
      .mp4,
      audio/mpeg,
      audio/mp4,
      audio/wav,
      audio/x-wav,
      audio/aac,
      audio/aiff
    "
        multiple
      />

      <input type="file" id="imageInput" accept="image/*" multiple />
    </div>

    <!-- =====================================================
     CANVAS
===================================================== -->

    <div id="canvas">
      <div class="help">
        EDIT：點擊選取・拖曳移動・右下角調整大小・Delete 刪除
      </div>

      <div class="loopRecordingIndicator">● RECORDING LOOP</div>
    </div>

    <!-- =====================================================
     LOOP AREA

     注意：
     放在 body，而不是 canvas 裡。

     這對 iPad fixed positioning 比較穩定。
===================================================== -->

    <div class="loopArea">
      <button id="loopButton" class="loopButton">LOOP</button>

      <button id="resetLoopButton" class="resetLoopButton">RESET LOOP</button>

      <div class="loopInfo">
        <div class="loopDuration">LOOP: —</div>

        <div class="loopHint">Hold to record</div>
      </div>

      <div id="loopLayers" class="loopLayers"></div>
    </div>

    <script>
      /* =====================================================
   SAMPLER STATE
===================================================== */

      const sampler = {
        mode: "edit",

        /* -------------------------
     Pads
  ------------------------- */

        pads: [],

        selectedPad: null,

        /* -------------------------
     Images
  ------------------------- */

        images: [],

        selectedImage: null,

        nextPadId: 1,

        nextImageId: 1,

        /* -------------------------
     Audio
  ------------------------- */

        audioContext: null,

        mediaStream: null,

        recorder: null,

        recordingPad: null,

        chunks: [],

        recordingTimer: null,

        recordingStartTime: null,

        /* -------------------------
     Loop
  ------------------------- */

        loops: [],

        nextLoopId: 1,

        loopRecording: false,

        loopRecordingStartTime: null,

        loopRecordingPointerId: null,

        loopDuration: null,

        loopSources: [],

        loopPressing: false,

        spacePressed: false,

        cancelLoopRecording: false,

        loopEvents: [],
      };

      /* =====================================================
   DOM
===================================================== */

      const canvas = document.getElementById("canvas");

      const editModeButton = document.getElementById("editMode");

      const playModeButton = document.getElementById("playMode");

      const addPadButton = document.getElementById("addPad");

      const addImageButton = document.getElementById("addImage");

      const importPadButton = document.getElementById("importPad");

      const renamePadButton = document.getElementById("renamePad");

      const deleteButton = document.getElementById("deleteButton");

      const imageInput = document.getElementById("imageInput");

      const audioInput = document.getElementById("audioInput");

      const loopButton = document.getElementById("loopButton");

      const resetLoopButton = document.getElementById("resetLoopButton");

      const loopLayers = document.getElementById("loopLayers");

      /* =====================================================
   SETTINGS
===================================================== */

      const CLICK_TIME = 250;

      const DRAG_THRESHOLD = 5;

      const DOUBLE_TAP_TIME = 350;

      const TRIM_THRESHOLD = 0.02;

      const TRIM_PADDING = 0.015;

      const MIN_TRIM_DURATION = 0.02;

      /* =====================================================
   PERCENT HELPERS
===================================================== */

      function pxToPercentX(px) {
        return (px / canvas.clientWidth) * 100;
      }

      function pxToPercentY(px) {
        return (px / canvas.clientHeight) * 100;
      }

      /* =====================================================
   SELECTION
===================================================== */

      function clearSelection() {
        sampler.pads.forEach((pad) => {
          if (pad.element) {
            pad.element.classList.remove("selected");
          }
        });

        sampler.images.forEach((image) => {
          if (image.element) {
            image.element.classList.remove("selected");
          }
        });

        sampler.selectedPad = null;

        sampler.selectedImage = null;
      }

      function selectPad(pad) {
        clearSelection();

        sampler.selectedPad = pad;

        if (pad.element) {
          pad.element.classList.add("selected");
        }
      }

      function selectImage(image) {
        clearSelection();

        sampler.selectedImage = image;

        if (image.element) {
          image.element.classList.add("selected");
        }
      }

      /* =====================================================
   AUDIO
===================================================== */

      function initAudio() {
        if (!sampler.audioContext) {
          const AudioContextClass =
            window.AudioContext || window.webkitAudioContext;

          if (!AudioContextClass) {
            throw new Error("Web Audio API unsupported");
          }

          sampler.audioContext = new AudioContextClass();
        }
      }

      async function resumeAudio() {
        initAudio();

        if (sampler.audioContext.state === "suspended") {
          await sampler.audioContext.resume();
        }
      }

      /* =====================================================
   RECORDING MIME
===================================================== */

      function getRecordingMimeType() {
        const types = [
          "audio/mp4",

          "audio/webm;codecs=opus",

          "audio/webm",

          "audio/ogg;codecs=opus",
        ];

        for (const type of types) {
          if (
            typeof MediaRecorder !== "undefined" &&
            MediaRecorder.isTypeSupported &&
            MediaRecorder.isTypeSupported(type)
          ) {
            return type;
          }
        }

        return "";
      }

      /* =====================================================
   AUTO TRIM
===================================================== */

      function trimAudioBuffer(
        audioBuffer,
        threshold = TRIM_THRESHOLD,
        padding = TRIM_PADDING,
      ) {
        if (!audioBuffer) {
          return null;
        }

        const sampleRate = audioBuffer.sampleRate;

        const length = audioBuffer.length;

        const channels = audioBuffer.numberOfChannels;

        if (length === 0) {
          return audioBuffer;
        }

        let startSample = -1;

        /* -------------------------
     Find start
  ------------------------- */

        for (let i = 0; i < length; i++) {
          let amplitude = 0;

          for (let channel = 0; channel < channels; channel++) {
            const data = audioBuffer.getChannelData(channel);

            amplitude = Math.max(amplitude, Math.abs(data[i]));
          }

          if (amplitude >= threshold) {
            startSample = i;

            break;
          }
        }

        if (startSample === -1) {
          return audioBuffer;
        }

        /* -------------------------
     Find end
  ------------------------- */

        let endSample = -1;

        for (let i = length - 1; i >= 0; i--) {
          let amplitude = 0;

          for (let channel = 0; channel < channels; channel++) {
            const data = audioBuffer.getChannelData(channel);

            amplitude = Math.max(amplitude, Math.abs(data[i]));
          }

          if (amplitude >= threshold) {
            endSample = i;

            break;
          }
        }

        if (endSample === -1) {
          return audioBuffer;
        }

        /* -------------------------
     Padding
  ------------------------- */

        const paddingSamples = Math.floor(padding * sampleRate);

        startSample = Math.max(0, startSample - paddingSamples);

        endSample = Math.min(length - 1, endSample + paddingSamples);

        const trimmedLength = endSample - startSample + 1;

        if (trimmedLength < sampleRate * MIN_TRIM_DURATION) {
          return audioBuffer;
        }

        if (startSample === 0 && endSample === length - 1) {
          return audioBuffer;
        }

        const trimmedBuffer = sampler.audioContext.createBuffer(
          channels,
          trimmedLength,
          sampleRate,
        );

        for (let channel = 0; channel < channels; channel++) {
          const sourceData = audioBuffer.getChannelData(channel);

          const targetData = trimmedBuffer.getChannelData(channel);

          targetData.set(sourceData.slice(startSample, endSample + 1));
        }

        console.log("Audio trimmed:", {
          originalDuration: audioBuffer.duration,

          trimmedDuration: trimmedBuffer.duration,

          removedStart: startSample / sampleRate,

          removedEnd: (length - endSample - 1) / sampleRate,
        });

        return trimmedBuffer;
      }

      /* =====================================================
   CREATE PAD
===================================================== */

      function createPad(x = 10, y = 10) {
        const id = sampler.nextPadId++;

        const pad = {
          id,

          name: `PAD ${id}`,

          x,

          y,

          width: 15,

          height: 15,

          audioURL: null,

          audioBuffer: null,

          element: null,

          lastTapTime: 0,

          pendingDoubleTap: false,
        };

        sampler.pads.push(pad);

        renderPad(pad);

        selectPad(pad);

        return pad;
      }

      /* =====================================================
   IMPORT PAD
=====================================================

   IMPORTANT iPAD FIX

   使用 HTML 中已存在的 #audioInput。
*/

      importPadButton.addEventListener("click", () => {
        if (sampler.mode !== "edit") {
          return;
        }

        /*
       清除之前的 value。

       讓 iPad 可以重新選同一個 MP3。
    */

        audioInput.value = "";

        /*
       iOS Safari / iPadOS
       直接觸發真正的 file input。
    */

        audioInput.click();
      });

      /* =====================================================
   AUDIO INPUT CHANGE
===================================================== */

      audioInput.addEventListener("change", async (event) => {
        const files = Array.from(event.target.files || []);

        if (!files.length) {
          return;
        }

        console.log(
          "Import files:",
          files.map((file) => file.name),
        );

        for (const file of files) {
          await importAudioFileAsPad(file);
        }

        /*
       非常重要：

       reset input，
       讓同一個檔案可以再次選取。
    */

        audioInput.value = "";
      });

      /* =====================================================
   IMPORT AUDIO FILE
===================================================== */

      async function importAudioFileAsPad(file) {
        if (!file) {
          return;
        }

        console.log("Importing:", file.name, file.type, file.size);

        try {
          /*
       建立 Pad
    */

          const pad = createPad(
            10 + Math.random() * 50,

            10 + Math.random() * 50,
          );

          updatePadStatus(pad, "LOADING");

          /*
       Object URL
    */

          pad.audioURL = URL.createObjectURL(file);

          /*
       AudioContext
    */

          initAudio();

          /*
       File → ArrayBuffer
    */

          const arrayBuffer = await file.arrayBuffer();

          /*
       ArrayBuffer → AudioBuffer
    */

          const decodedBuffer =
            await sampler.audioContext.decodeAudioData(arrayBuffer);

          /*
       Auto Trim
    */

          pad.audioBuffer = trimAudioBuffer(decodedBuffer);

          /*
       READY
    */

          updatePadStatus(pad, "READY");

          selectPad(pad);

          console.log(
            "Imported successfully:",
            file.name,
            pad.audioBuffer.duration,
          );
        } catch (error) {
          console.error("Import audio error:", error);

          /*
       移除失敗 Pad
    */

          const failedPad = sampler.selectedPad;

          if (failedPad && !failedPad.audioBuffer) {
            if (failedPad.audioURL) {
              URL.revokeObjectURL(failedPad.audioURL);
            }

            if (failedPad.element) {
              failedPad.element.remove();
            }

            sampler.pads = sampler.pads.filter((p) => p !== failedPad);

            sampler.selectedPad = null;
          }

          alert(
            "無法匯入這個音檔。\n\n" +
              "請確認這是 MP3、M4A、WAV 或其他瀏覽器支援的音訊檔案。",
          );
        }
      }

      /* =====================================================
   RENDER PAD
===================================================== */

      function renderPad(pad) {
        const element = document.createElement("div");

        element.className = "pad";

        const content = document.createElement("div");

        content.className = "padContent";

        content.innerHTML = `

    <div class="padName">
      ${pad.name}
    </div>

    <div class="recordStatus">
      NO SOUND
    </div>

  `;

        const resizeHandle = document.createElement("div");

        resizeHandle.className = "resizeHandle";

        element.appendChild(content);

        element.appendChild(resizeHandle);

        canvas.appendChild(element);

        pad.element = element;

        updatePad(pad);

        setupPadInteraction(pad, element, resizeHandle);
      }

      /* =====================================================
   UPDATE PAD
===================================================== */

      function updatePad(pad) {
        if (!pad.element) {
          return;
        }

        pad.element.style.left = pad.x + "%";

        pad.element.style.top = pad.y + "%";

        pad.element.style.width = pad.width + "%";

        pad.element.style.height = pad.height + "%";
      }

      /* =====================================================
   RENAME
===================================================== */

      function renameSelectedPad() {
        const pad = sampler.selectedPad;

        if (!pad) {
          alert("請先選取一個 PAD。");

          return;
        }

        const newName = window.prompt("輸入 PAD 名稱：", pad.name);

        if (newName === null) {
          return;
        }

        const trimmed = newName.trim();

        if (!trimmed) {
          return;
        }

        pad.name = trimmed;

        const nameElement = pad.element.querySelector(".padName");

        if (nameElement) {
          nameElement.textContent = pad.name;
        }
      }

      renamePadButton.addEventListener("click", renameSelectedPad);

      /* =====================================================
   PAD INTERACTION
===================================================== */

      function setupPadInteraction(pad, element, resizeHandle) {
        let startX = 0;

        let startY = 0;

        let startPadX = 0;

        let startPadY = 0;

        let startWidth = 0;

        let startHeight = 0;

        let pointerDownTime = 0;

        let moved = false;

        let action = null;

        element.addEventListener("pointerdown", (event) => {
          if (sampler.mode !== "edit") {
            return;
          }

          event.preventDefault();

          try {
            element.setPointerCapture(event.pointerId);
          } catch (error) {}

          startX = event.clientX;

          startY = event.clientY;

          startPadX = pad.x;

          startPadY = pad.y;

          startWidth = pad.width;

          startHeight = pad.height;

          pointerDownTime = Date.now();

          moved = false;

          if (event.target === resizeHandle) {
            action = "resize";

            selectPad(pad);

            return;
          }

          action = "none";

          if (sampler.recordingPad === pad) {
            selectPad(pad);

            return;
          }

          const now = Date.now();

          const timeSinceLastTap = now - pad.lastTapTime;

          if (pad.lastTapTime > 0 && timeSinceLastTap < DOUBLE_TAP_TIME) {
            pad.lastTapTime = 0;

            pad.pendingDoubleTap = true;

            startRecording(pad);
          } else {
            pad.lastTapTime = now;

            pad.pendingDoubleTap = false;

            selectPad(pad);
          }
        });

        element.addEventListener("pointermove", (event) => {
          if (sampler.mode !== "edit") {
            return;
          }

          if (action === null) {
            return;
          }

          if (sampler.recordingPad === pad) {
            return;
          }

          const dx = event.clientX - startX;

          const dy = event.clientY - startY;

          const distance = Math.sqrt(dx * dx + dy * dy);

          if (action === "resize") {
            moved = true;

            pad.width = Math.max(3, startWidth + pxToPercentX(dx));

            pad.height = Math.max(3, startHeight + pxToPercentY(dy));

            updatePad(pad);

            return;
          }

          if (distance > DRAG_THRESHOLD) {
            moved = true;

            action = "drag";

            pad.lastTapTime = 0;

            pad.x = startPadX + pxToPercentX(dx);

            pad.y = startPadY + pxToPercentY(dy);

            updatePad(pad);
          }
        });

        element.addEventListener("pointerup", () => {
          if (sampler.mode !== "edit") {
            return;
          }

          if (moved) {
            action = null;

            return;
          }

          if (sampler.recordingPad === pad && !pad.pendingDoubleTap) {
            stopRecording();

            action = null;

            return;
          }

          if (pad.pendingDoubleTap) {
            pad.pendingDoubleTap = false;

            action = null;

            return;
          }

          const duration = Date.now() - pointerDownTime;

          if (duration >= CLICK_TIME) {
            pad.lastTapTime = 0;

            action = null;

            return;
          }

          action = null;
        });

        element.addEventListener("pointercancel", () => {
          action = null;

          pad.pendingDoubleTap = false;
        });
      }

      /* =====================================================
   IMAGE
===================================================== */

      addImageButton.addEventListener("click", () => {
        imageInput.value = "";

        imageInput.click();
      });

      imageInput.addEventListener("change", (event) => {
        const files = Array.from(event.target.files || []);

        files.forEach((file) => {
          createImage(file);
        });

        imageInput.value = "";
      });

      function createImage(file) {
        const id = sampler.nextImageId++;

        const image = {
          id,

          x: 10 + Math.random() * 30,

          y: 10 + Math.random() * 30,

          width: 30,

          height: 30,

          url: URL.createObjectURL(file),

          element: null,
        };

        sampler.images.push(image);

        renderImage(image);

        selectImage(image);
      }

      function renderImage(image) {
        const wrapper = document.createElement("div");

        wrapper.className = "imageItem";

        wrapper.style.left = image.x + "%";

        wrapper.style.top = image.y + "%";

        wrapper.style.width = image.width + "%";

        wrapper.style.height = image.height + "%";

        const img = document.createElement("img");

        img.src = image.url;

        img.draggable = false;

        img.style.width = "100%";

        img.style.height = "100%";

        img.style.objectFit = "fill";

        img.style.pointerEvents = "none";

        const resizeHandle = document.createElement("div");

        resizeHandle.className = "imageResizeHandle";

        wrapper.appendChild(img);

        wrapper.appendChild(resizeHandle);

        canvas.appendChild(wrapper);

        image.element = wrapper;

        setupImageInteraction(image, wrapper, resizeHandle);
      }

      function updateImage(image) {
        if (!image.element) {
          return;
        }

        image.element.style.left = image.x + "%";

        image.element.style.top = image.y + "%";

        image.element.style.width = image.width + "%";

        image.element.style.height = image.height + "%";
      }

      /* =====================================================
   IMAGE INTERACTION
===================================================== */

      function setupImageInteraction(image, element, resizeHandle) {
        let startX;

        let startY;

        let startImageX;

        let startImageY;

        let startWidth;

        let startHeight;

        let action = null;

        element.addEventListener("pointerdown", (event) => {
          if (sampler.mode !== "edit") {
            return;
          }

          event.preventDefault();

          try {
            element.setPointerCapture(event.pointerId);
          } catch (error) {}

          selectImage(image);

          startX = event.clientX;

          startY = event.clientY;

          startImageX = image.x;

          startImageY = image.y;

          startWidth = image.width;

          startHeight = image.height;

          if (event.target === resizeHandle) {
            action = "resize";
          } else {
            action = "drag";
          }
        });

        element.addEventListener("pointermove", (event) => {
          if (sampler.mode !== "edit") {
            return;
          }

          if (!action) {
            return;
          }

          const dx = event.clientX - startX;

          const dy = event.clientY - startY;

          if (action === "drag") {
            image.x = startImageX + pxToPercentX(dx);

            image.y = startImageY + pxToPercentY(dy);
          }

          if (action === "resize") {
            image.width = Math.max(3, startWidth + pxToPercentX(dx));

            image.height = Math.max(3, startHeight + pxToPercentY(dy));
          }

          updateImage(image);
        });

        element.addEventListener("pointerup", () => {
          action = null;
        });
      }

      /* =====================================================
   DELETE
===================================================== */

      function deleteSelected() {
        if (sampler.selectedPad) {
          const pad = sampler.selectedPad;

          if (sampler.recordingPad === pad) {
            stopRecording();
          }

          if (pad.audioURL) {
            URL.revokeObjectURL(pad.audioURL);
          }

          if (pad.element) {
            pad.element.remove();
          }

          sampler.pads = sampler.pads.filter((p) => p !== pad);

          sampler.selectedPad = null;

          return;
        }

        if (sampler.selectedImage) {
          const image = sampler.selectedImage;

          if (image.url) {
            URL.revokeObjectURL(image.url);
          }

          if (image.element) {
            image.element.remove();
          }

          sampler.images = sampler.images.filter((img) => img !== image);

          sampler.selectedImage = null;
        }
      }

      deleteButton.addEventListener("click", deleteSelected);

      /* =====================================================
   DELETE KEY
===================================================== */

      document.addEventListener("keydown", (event) => {
        if (sampler.mode !== "edit") {
          return;
        }

        if (event.key !== "Delete" && event.key !== "Backspace") {
          return;
        }

        const tag = document.activeElement?.tagName;

        if (tag === "INPUT" || tag === "TEXTAREA") {
          return;
        }

        event.preventDefault();

        deleteSelected();
      });

      /* =====================================================
   PAD RECORDING
===================================================== */

      async function startRecording(pad) {
        if (sampler.recordingPad) {
          return;
        }

        try {
          initAudio();

          if (!sampler.mediaStream) {
            sampler.mediaStream = await navigator.mediaDevices.getUserMedia({
              audio: true,
            });
          }

          await resumeAudio();

          if (typeof MediaRecorder === "undefined") {
            throw new Error("MediaRecorder unsupported");
          }

          if (sampler.recordingPad) {
            return;
          }

          const mimeType = getRecordingMimeType();

          const options = mimeType ? { mimeType } : undefined;

          sampler.recordingPad = pad;

          sampler.chunks = [];

          sampler.recorder = new MediaRecorder(sampler.mediaStream, options);

          sampler.recorder.ondataavailable = (event) => {
            if (event.data.size > 0) {
              sampler.chunks.push(event.data);
            }
          };

          sampler.recorder.onstop = async () => {
            try {
              const recorder = sampler.recorder;

              const actualType = recorder?.mimeType || mimeType || "audio/mp4";

              const blob = new Blob(sampler.chunks, {
                type: actualType,
              });

              if (pad.audioURL) {
                URL.revokeObjectURL(pad.audioURL);
              }

              pad.audioURL = URL.createObjectURL(blob);

              const arrayBuffer = await blob.arrayBuffer();

              const decodedBuffer =
                await sampler.audioContext.decodeAudioData(arrayBuffer);

              pad.audioBuffer = trimAudioBuffer(decodedBuffer);

              updatePadStatus(pad, "READY");
            } catch (error) {
              console.error("Audio decode error:", error);

              updatePadStatus(pad, "ERROR");
            }

            sampler.recordingPad = null;

            sampler.recorder = null;

            sampler.chunks = [];
          };

          sampler.recorder.start();

          sampler.recordingStartTime = Date.now();

          clearInterval(sampler.recordingTimer);

          sampler.recordingTimer = setInterval(updateRecordingTimer, 1000);

          pad.element.classList.add("recording");

          updateRecordingText(pad, "● REC 00:00");
        } catch (error) {
          console.error("Recording error:", error);

          sampler.recordingPad = null;

          sampler.recorder = null;

          clearInterval(sampler.recordingTimer);

          sampler.recordingTimer = null;

          if (pad.element) {
            pad.element.classList.remove("recording");
          }

          alert(
            "無法開始錄音。\n\n" + "請確認網站使用 HTTPS，並允許麥克風權限。",
          );
        }
      }

      function updateRecordingTimer() {
        if (!sampler.recordingPad) {
          return;
        }

        const elapsed = Math.floor(
          (Date.now() - sampler.recordingStartTime) / 1000,
        );

        const minutes = String(Math.floor(elapsed / 60)).padStart(2, "0");

        const seconds = String(elapsed % 60).padStart(2, "0");

        updateRecordingText(
          sampler.recordingPad,
          `● REC ${minutes}:${seconds}`,
        );
      }

      function stopRecording() {
        if (!sampler.recorder) {
          return;
        }

        if (sampler.recorder.state !== "inactive") {
          sampler.recorder.stop();
        }

        clearInterval(sampler.recordingTimer);

        sampler.recordingTimer = null;

        if (sampler.recordingPad) {
          sampler.recordingPad.element.classList.remove("recording");
        }
      }

      function updatePadStatus(pad, status) {
        const element = pad.element?.querySelector(".recordStatus");

        if (element) {
          element.textContent = status;
        }
      }

      function updateRecordingText(pad, text) {
        const element = pad.element?.querySelector(".recordStatus");

        if (element) {
          element.textContent = text;
        }
      }

      /* =====================================================
   PLAY PAD
===================================================== */

      function playPad(pad, options = {}) {
        if (!pad.audioBuffer) {
          return null;
        }

        initAudio();

        if (sampler.audioContext.state === "suspended") {
          sampler.audioContext.resume();
        }

        const source = sampler.audioContext.createBufferSource();

        source.buffer = pad.audioBuffer;

        source.connect(sampler.audioContext.destination);

        const startTime =
          options.startTime !== undefined
            ? options.startTime
            : sampler.audioContext.currentTime;

        source.start(startTime);

        if (pad.element) {
          pad.element.classList.add("playing");
        }

        source.onended = () => {
          if (pad.element) {
            pad.element.classList.remove("playing");
          }
        };

        return source;
      }

      /* =====================================================
   LOOP EVENT RECORDING
===================================================== */

      async function startLoopRecording() {
        if (sampler.loopRecording) {
          return;
        }

        if (sampler.mode !== "play") {
          return;
        }

        try {
          await resumeAudio();
        } catch (error) {
          console.error(error);

          return;
        }

        sampler.loopRecording = true;

        sampler.cancelLoopRecording = false;

        sampler.loopEvents = [];

        sampler.loopRecordingStartTime = sampler.audioContext.currentTime;

        loopButton.classList.add("recording");

        loopButton.textContent = "RECORDING";

        canvas.classList.add("loopRecording");
      }

      /* =====================================================
   RECORD PAD EVENT
===================================================== */

      function recordPadEvent(pad) {
        if (!sampler.loopRecording) {
          return;
        }

        if (sampler.loopRecordingStartTime === null) {
          return;
        }

        const now = sampler.audioContext.currentTime;

        const time = now - sampler.loopRecordingStartTime;

        sampler.loopEvents.push({
          pad: pad,

          time: Math.max(0, time),
        });
      }

      /* =====================================================
   STOP LOOP RECORDING
===================================================== */

      function stopLoopRecording() {
        if (!sampler.loopRecording) {
          return;
        }

        sampler.loopRecording = false;

        loopButton.classList.remove("recording");

        loopButton.textContent = "LOOP";

        canvas.classList.remove("loopRecording");

        if (sampler.cancelLoopRecording) {
          sampler.cancelLoopRecording = false;

          sampler.loopEvents = [];

          return;
        }

        finishLoopRecording();
      }

      /* =====================================================
   FINISH LOOP
===================================================== */

      function finishLoopRecording() {
        const events = [...sampler.loopEvents];

        sampler.loopEvents = [];

        const recordingEndTime = sampler.audioContext.currentTime;

        let duration = recordingEndTime - sampler.loopRecordingStartTime;

        duration = Math.max(0.05, duration);

        if (sampler.loopDuration === null) {
          sampler.loopDuration = duration;

          updateLoopDurationUI();
        }

        duration = sampler.loopDuration;

        if (!events.length) {
          console.warn("Loop contains no Pad events.");

          return;
        }

        const validEvents = events.filter((event) => event.time < duration);

        if (!validEvents.length) {
          console.warn("Loop contains no valid Pad events.");

          return;
        }

        const loop = {
          id: sampler.nextLoopId++,

          duration: duration,

          events: validEvents,

          muted: false,

          scheduledSources: [],

          gain: null,
        };

        sampler.loops.push(loop);

        renderLoopLayers();

        restartAllLoops();
      }

      /* =====================================================
   STOP LOOP SOURCES
===================================================== */

      function stopAllLoopSources() {
        sampler.loopSources.forEach((source) => {
          try {
            source.onended = null;

            source.stop();
          } catch (error) {}

          try {
            source.disconnect();
          } catch (error) {}
        });

        sampler.loopSources = [];

        sampler.loops.forEach((loop) => {
          loop.scheduledSources = [];

          loop.gain = null;
        });
      }

      /* =====================================================
   START ALL LOOP SOURCES
===================================================== */

      function restartAllLoops() {
        if (!sampler.loops.length) {
          return;
        }

        initAudio();

        if (sampler.audioContext.state === "suspended") {
          sampler.audioContext.resume();
        }

        stopAllLoopSources();

        const startTime = sampler.audioContext.currentTime + 0.05;

        sampler.loops.forEach((loop) => {
          if (!loop.events.length) {
            return;
          }

          const gain = sampler.audioContext.createGain();

          gain.gain.setValueAtTime(loop.muted ? 0 : 1, startTime);

          gain.connect(sampler.audioContext.destination);

          loop.gain = gain;

          scheduleLoopCycle(loop, startTime);
        });
      }

      /* =====================================================
   LOOP SCHEDULER
===================================================== */

      function scheduleLoopCycle(loop, cycleStartTime) {
        if (!sampler.loops.includes(loop)) {
          return;
        }

        if (!loop.events.length) {
          return;
        }

        loop.events.forEach((event) => {
          if (!event.pad?.audioBuffer) {
            return;
          }

          const source = sampler.audioContext.createBufferSource();

          source.buffer = event.pad.audioBuffer;

          source.connect(loop.gain);

          const startTime = cycleStartTime + event.time;

          source.start(startTime);

          sampler.loopSources.push(source);

          loop.scheduledSources.push(source);

          source.onended = () => {
            const index = sampler.loopSources.indexOf(source);

            if (index !== -1) {
              sampler.loopSources.splice(index, 1);
            }

            const scheduledIndex = loop.scheduledSources.indexOf(source);

            if (scheduledIndex !== -1) {
              loop.scheduledSources.splice(scheduledIndex, 1);
            }
          };
        });

        const nextCycle = cycleStartTime + loop.duration;

        const delay = Math.max(
          0,
          (nextCycle - sampler.audioContext.currentTime - 0.1) * 1000,
        );

        setTimeout(() => {
          if (!sampler.loops.includes(loop)) {
            return;
          }

          if (sampler.mode !== "play") {
            return;
          }

          scheduleLoopCycle(loop, nextCycle);
        }, delay);
      }

      /* =====================================================
   LOOP LAYERS
===================================================== */

      function renderLoopLayers() {
        loopLayers.innerHTML = "";

        sampler.loops.forEach((loop) => {
          const layer = document.createElement("div");

          layer.className = "loopLayer";

          if (loop.muted) {
            layer.classList.add("muted");
          }

          const name = document.createElement("div");

          name.className = "loopLayerName";

          name.textContent = `LOOP ${loop.id}`;

          const muteButton = document.createElement("button");

          muteButton.className = "muteButton";

          muteButton.textContent = loop.muted ? "MUTED" : "MUTE";

          if (loop.muted) {
            muteButton.classList.add("active");
          }

          muteButton.addEventListener("click", (event) => {
            event.stopPropagation();

            toggleLoopMute(loop);
          });

          layer.appendChild(name);

          layer.appendChild(muteButton);

          loopLayers.appendChild(layer);
        });

        if (sampler.loops.length > 0) {
          resetLoopButton.classList.add("visible");
        } else {
          resetLoopButton.classList.remove("visible");
        }
      }

      /* =====================================================
   MUTE
===================================================== */

      function toggleLoopMute(loop) {
        loop.muted = !loop.muted;

        if (loop.gain) {
          const now = sampler.audioContext.currentTime;

          loop.gain.gain.cancelScheduledValues(now);

          loop.gain.gain.setValueAtTime(loop.muted ? 0 : 1, now);
        }

        renderLoopLayers();
      }

      /* =====================================================
   LOOP DURATION UI
===================================================== */

      function updateLoopDurationUI() {
        const element = document.querySelector(".loopDuration");

        if (!sampler.loopDuration) {
          element.textContent = "LOOP: —";

          return;
        }

        element.textContent = `LOOP: ${sampler.loopDuration.toFixed(2)}s`;
      }

      /* =====================================================
   RESET LOOP
===================================================== */

      function resetLoops() {
        stopAllLoopSources();

        sampler.loops = [];

        sampler.nextLoopId = 1;

        sampler.loopDuration = null;

        sampler.loopRecording = false;

        sampler.loopRecordingStartTime = null;

        sampler.loopRecordingPointerId = null;

        sampler.loopPressing = false;

        sampler.spacePressed = false;

        sampler.loopEvents = [];

        sampler.cancelLoopRecording = false;

        loopButton.classList.remove("recording");

        loopButton.textContent = "LOOP";

        canvas.classList.remove("loopRecording");

        updateLoopDurationUI();

        renderLoopLayers();
      }

      resetLoopButton.addEventListener("click", (event) => {
        event.preventDefault();

        event.stopPropagation();

        resetLoops();
      });

      /* =====================================================
   LOOP BUTTON — POINTER DOWN
===================================================== */

      loopButton.addEventListener("pointerdown", async (event) => {
        if (sampler.mode !== "play") {
          return;
        }

        event.preventDefault();

        try {
          loopButton.setPointerCapture(event.pointerId);
        } catch (error) {}

        sampler.loopPressing = true;

        sampler.loopRecordingPointerId = event.pointerId;

        await startLoopRecording();
      });

      /* =====================================================
   LOOP BUTTON — POINTER UP
===================================================== */

      loopButton.addEventListener("pointerup", (event) => {
        if (sampler.loopRecordingPointerId !== event.pointerId) {
          return;
        }

        event.preventDefault();

        sampler.loopPressing = false;

        sampler.loopRecordingPointerId = null;

        stopLoopRecording();
      });

      /* =====================================================
   POINTER CANCEL
===================================================== */

      loopButton.addEventListener("pointercancel", () => {
        sampler.loopPressing = false;

        sampler.loopRecordingPointerId = null;

        stopLoopRecording();
      });

      /* =====================================================
   LOST POINTER CAPTURE
===================================================== */

      loopButton.addEventListener("lostpointercapture", () => {
        if (sampler.loopPressing) {
          sampler.loopPressing = false;

          stopLoopRecording();
        }
      });

      /* =====================================================
   SPACE
===================================================== */

      document.addEventListener("keydown", (event) => {
        if (sampler.mode !== "play") {
          return;
        }

        if (event.code !== "Space") {
          return;
        }

        event.preventDefault();

        if (event.repeat || sampler.spacePressed) {
          return;
        }

        sampler.spacePressed = true;

        startLoopRecording();
      });

      document.addEventListener("keyup", (event) => {
        if (event.code !== "Space") {
          return;
        }

        event.preventDefault();

        sampler.spacePressed = false;

        if (sampler.mode === "play") {
          stopLoopRecording();
        }
      });

      /* =====================================================
   PLAY MODE PAD
===================================================== */

      canvas.addEventListener("pointerdown", (event) => {
        if (sampler.mode !== "play") {
          return;
        }

        /*
       Loop bar 現在是在 body，
       不在 canvas 裡。

       所以這個判斷仍然保留，
       但實際上不會攔截 Loop。
    */

        if (event.target.closest(".loopArea")) {
          return;
        }

        const padElement = event.target.closest(".pad");

        if (!padElement) {
          return;
        }

        const pad = sampler.pads.find((p) => p.element === padElement);

        if (pad) {
          playPad(pad);

          recordPadEvent(pad);
        }
      });

      /* =====================================================
   PLAY MODE
===================================================== */

      function enablePlayMode() {
        if (sampler.recordingPad) {
          stopRecording();
        }

        sampler.mode = "play";

        clearSelection();

        canvas.classList.add("playMode");

        editModeButton.classList.remove("active");

        playModeButton.classList.add("active");

        addPadButton.style.display = "none";

        addImageButton.style.display = "none";

        importPadButton.style.display = "none";

        renamePadButton.style.display = "none";

        deleteButton.style.display = "none";

        /*
     Loop Area 現在由 CSS：

       #canvas.playMode .loopArea

     控制顯示。

     因為 loopArea 在 body，
     所以不能再靠 #canvas.playMode。

     這裡直接加 class 到 body。
  */

        document.body.classList.add("playMode");

        /*
     直接強制顯示。

     這是 iPad Safari 的保險。
  */

        document.querySelector(".loopArea").style.display = "flex";

        if (sampler.loops.length > 0) {
          resumeAudio().then(() => {
            restartAllLoops();
          });
        }
      }

      /* =====================================================
   EDIT MODE
===================================================== */

      function enableEditMode() {
        if (sampler.loopRecording) {
          sampler.cancelLoopRecording = true;

          sampler.loopPressing = false;

          stopLoopRecording();
        }

        stopAllLoopSources();

        sampler.mode = "edit";

        sampler.spacePressed = false;

        sampler.loopPressing = false;

        canvas.classList.remove("playMode");

        canvas.classList.remove("loopRecording");

        document.body.classList.remove("playMode");

        loopButton.classList.remove("recording");

        loopButton.textContent = "LOOP";

        /*
     Hide Loop Area
  */

        document.querySelector(".loopArea").style.display = "none";

        editModeButton.classList.add("active");

        playModeButton.classList.remove("active");

        addPadButton.style.display = "block";

        addImageButton.style.display = "block";

        importPadButton.style.display = "block";

        renamePadButton.style.display = "block";

        deleteButton.style.display = "block";
      }

      /* =====================================================
   MODE BUTTONS
===================================================== */

      editModeButton.addEventListener("click", enableEditMode);

      playModeButton.addEventListener("click", enablePlayMode);

      /* =====================================================
   ADD PAD
===================================================== */

      addPadButton.addEventListener("click", () => {
        createPad(
          10 + Math.random() * 50,

          10 + Math.random() * 50,
        );
      });

      /* =====================================================
   WINDOW RESIZE
===================================================== */
