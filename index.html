<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <title>Visual Sampler</title>

    <style>
      /* =====================================================
         GLOBAL
      ===================================================== */

      * {
        box-sizing: border-box;

        -webkit-user-select: none;
        user-select: none;

        -webkit-touch-callout: none;

        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        margin: 0;
        padding: 0;

        width: 100%;
        height: 100%;

        overflow: hidden;

        font-family: Arial, sans-serif;

        background: white;
        color: black;

        overscroll-behavior: none;

        touch-action: none;

        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }

      body {
        -webkit-user-select: none;
        user-select: none;

        -webkit-touch-callout: none;

        touch-action: none;
      }

      body,
      div,
      span,
      button,
      label,
      input,
      img {
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }

      button,
      input {
        font-family: inherit;
      }

      button {
        touch-action: none;
      }

      /* =====================================================
         TOOLBAR
      ===================================================== */

      .toolbar {
        position: fixed;

        top: 0;
        left: 0;
        right: 0;

        height: 60px;

        display: flex;
        align-items: center;

        gap: 8px;

        padding: 10px 15px;

        background: white;

        border-bottom: 1px solid black;

        z-index: 1000;

        overflow-x: auto;
        overflow-y: hidden;

        -webkit-overflow-scrolling: touch;

        touch-action: pan-x;
      }

      button {
        flex-shrink: 0;

        border: 1px solid black;

        background: white;
        color: black;

        border-radius: 0;

        padding: 8px 14px;

        font-size: 14px;

        cursor: pointer;

        -webkit-tap-highlight-color: transparent;
      }

      button:hover {
        background: #eee;
      }

      button:active {
        background: #ddd;
      }

      .modeButton.active {
        background: black;
        color: white;
      }

      #addPad {
        margin-left: auto;
      }

      #imageInput,
      #audioInput {
        position: fixed;

        width: 1px;
        height: 1px;

        opacity: 0;

        pointer-events: none;
      }

      /* =====================================================
         CANVAS
      ===================================================== */

      #canvas {
        position: fixed;

        left: 0;
        right: 0;

        top: 60px;
        bottom: 0;

        width: 100%;

        overflow: hidden;

        background: white;

        touch-action: none;

        -webkit-user-select: none;
        user-select: none;
      }

      /* =====================================================
         IMAGE OBJECT
      ===================================================== */

      .imageItem {
        position: absolute;

        user-select: none;
        -webkit-user-select: none;

        touch-action: none;

        cursor: pointer;

        z-index: 2;

        -webkit-touch-callout: none;
      }

      .imageItem.selected {
        outline: 2px dashed black;
        outline-offset: 2px;
      }

      /*
       * =====================================================
       * PAD LOCAL IMAGE INVERT OVERLAY
       * =====================================================
       *
       * 不再直接對整張圖片使用：
       *
       *     filter: invert(1)
       *
       * 而是建立一個只等於：
       *
       *     IMAGE ∩ PAD
       *
       * 的 overlay。
       *
       * 所以 PAD 多大，就只 inverse 那個範圍。
       */

      .imageInvertOverlay {
        position: absolute;

        pointer-events: none;

        z-index: 4;

        overflow: hidden;

        filter: invert(1);
        -webkit-filter: invert(1);

        touch-action: none;

        user-select: none;
        -webkit-user-select: none;

        -webkit-touch-callout: none;
      }

      .imageInvertOverlay img {
        position: absolute;

        left: 0;
        top: 0;

        pointer-events: none;

        user-select: none;
        -webkit-user-select: none;

        -webkit-touch-callout: none;

        object-fit: fill;
      }

      .imageResizeHandle {
        position: absolute;

        width: 14px;
        height: 14px;

        right: -2px;
        bottom: -2px;

        background: black;

        cursor: nwse-resize;

        touch-action: none;

        z-index: 5;
      }

      /* =====================================================
         PAD
      ===================================================== */

      .pad {
        position: absolute;

        width: 15%;
        height: 15%;

        background: transparent;

        border: 2px solid white;

        border-radius: 0;

        display: flex;

        align-items: center;
        justify-content: center;

        user-select: none;
        -webkit-user-select: none;

        touch-action: none;

        cursor: pointer;

        z-index: 10;

        mix-blend-mode: difference;

        -webkit-tap-highlight-color: transparent;

        -webkit-touch-callout: none;
      }

      .pad.selected {
        border: 4px solid white;
      }

      .pad.recording {
        border: 3px dashed white;
      }

      .pad.playing {
        transform: scale(0.96);
      }

      .pad.holding {
        transform: scale(0.96);
      }

      .padEffectStatus {
        position: absolute;
        left: 8px;
        right: 8px;
        top: 6px;
        text-align: center;
        font-size: 10px;
        color: white;
        opacity: 0.75;
        pointer-events: none;
        mix-blend-mode: difference;
      }

      #canvas.playMode .padEffectStatus {
        display: block;
      }

      .padContent {
        width: 100%;
        height: 100%;

        display: flex;
        flex-direction: column;

        align-items: center;
        justify-content: center;

        text-align: center;

        pointer-events: none;

        color: white;

        padding: 8px;
      }

      .padName {
        font-size: 16px;

        max-width: 100%;

        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .recordStatus {
        margin-top: 6px;

        font-size: 12px;

        opacity: 0.7;
      }

      /* =====================================================
         PAD VOLUME CONTROL
      ===================================================== */

      .padControls {
        position: absolute;

        left: 8px;
        right: 8px;
        bottom: 7px;

        display: flex;
        align-items: center;

        gap: 6px;

        z-index: 20;

        pointer-events: auto;

        touch-action: none;
      }

      .padVolumeLabel {
        flex-shrink: 0;

        font-size: 10px;

        color: white;

        opacity: 0.8;

        mix-blend-mode: difference;
      }

      .padVolume {
        flex: 1;

        min-width: 0;

        height: 16px;

        margin: 0;

        accent-color: black;

        cursor: pointer;

        touch-action: auto;

        pointer-events: auto;
      }

      .padVolumeValue {
        width: 34px;

        flex-shrink: 0;

        font-size: 10px;

        color: white;

        text-align: right;

        mix-blend-mode: difference;
      }

      #canvas.playMode .padControls {
        display: none;
      }

      /* =====================================================
         PAD RESIZE
      ===================================================== */

      .resizeHandle {
        position: absolute;

        width: 14px;
        height: 14px;

        right: -2px;
        bottom: -2px;

        background: white;

        cursor: nwse-resize;

        touch-action: none;

        z-index: 30;

        mix-blend-mode: difference;
      }

      /* =====================================================
         PLAY MODE
      ===================================================== */

      #canvas.playMode .resizeHandle,
      #canvas.playMode .imageResizeHandle {
        display: none;
      }

      #canvas.playMode .recordStatus {
        display: none;
      }

      /* =====================================================
         LOOP AREA
      ===================================================== */

      .loopArea {
        position: fixed;

        left: 0;
        right: 0;
        bottom: 0;

        min-height: 72px;

        padding: 10px 15px calc(10px + env(safe-area-inset-bottom));

        display: none;

        align-items: center;

        gap: 15px;

        background: white;

        border-top: 1px solid black;

        z-index: 2000;

        -webkit-transform: translateZ(0);
        transform: translateZ(0);

        touch-action: none;
      }

      body.playMode .loopArea {
        display: flex;
      }

      /* =====================================================
         MASTER VOLUME
      ===================================================== */

      .masterVolume {
        width: 150px;

        flex-shrink: 0;

        display: flex;
        flex-direction: column;

        justify-content: center;

        gap: 4px;
      }

      .masterHeader {
        display: flex;
        align-items: center;
        justify-content: space-between;

        font-size: 11px;
      }

      .masterLabel {
        font-size: 12px;
      }

      .masterValue {
        font-size: 11px;

        opacity: 0.65;
      }

      #masterVolumeSlider {
        width: 100%;

        height: 18px;

        margin: 0;

        accent-color: black;

        cursor: pointer;

        touch-action: auto;
      }

      /* =====================================================
         LOOP BUTTON
      ===================================================== */

      .loopButton {
        width: 80px;
        height: 48px;

        flex-shrink: 0;

        padding: 0;

        font-size: 14px;

        border: 2px solid black;

        background: white;

        user-select: none;
        -webkit-user-select: none;

        touch-action: none;

        -webkit-tap-highlight-color: transparent;
      }

      .loopButton.recording {
        background: black;
        color: white;
      }

      .loopButton.recording::before {
        content: "● ";
      }

      /* =====================================================
         RESET LOOP
      ===================================================== */

      .resetLoopButton {
        height: 48px;

        flex-shrink: 0;

        padding: 0 12px;

        font-size: 12px;

        border: 1px solid black;

        background: white;

        display: none;

        touch-action: none;
      }

      .resetLoopButton.visible {
        display: block;
      }

      .resetLoopButton:hover {
        background: #eee;
      }

      /* =====================================================
         LOOP INFO
      ===================================================== */

      .loopInfo {
        width: 100px;

        flex-shrink: 0;

        font-size: 12px;

        line-height: 1.5;
      }

      .loopDuration {
        font-size: 13px;
      }

      .loopHint {
        opacity: 0.5;
      }

      /* =====================================================
         LOOP LAYERS
      ===================================================== */

      .loopLayers {
        flex: 1;

        min-width: 0;

        display: flex;

        align-items: center;

        gap: 8px;

        overflow-x: auto;
        overflow-y: hidden;

        scrollbar-width: none;

        -webkit-overflow-scrolling: touch;

        touch-action: pan-x;
      }

      .loopLayers::-webkit-scrollbar {
        display: none;
      }

      .loopLayer {
        min-width: 105px;

        height: 48px;

        display: flex;

        align-items: center;

        gap: 7px;

        padding: 5px 7px;

        border: 1px solid black;

        background: white;

        flex-shrink: 0;
      }

      .loopLayer.muted {
        opacity: 0.35;
      }

      .loopLayerName {
        flex: 1;

        min-width: 0;

        font-size: 12px;

        white-space: nowrap;

        overflow: hidden;

        text-overflow: ellipsis;
      }

      .muteButton {
        padding: 5px 7px;

        font-size: 11px;

        flex-shrink: 0;

        touch-action: none;
      }

      .muteButton.active {
        background: black;
        color: white;
      }

      /* =====================================================
         RECORDING INDICATOR
      ===================================================== */

      .loopRecordingIndicator {
        position: fixed;

        left: 50%;

        bottom: calc(85px + env(safe-area-inset-bottom));

        transform: translateX(-50%);

        padding: 7px 12px;

        background: black;
        color: white;

        font-size: 12px;

        z-index: 2100;

        display: none;

        pointer-events: none;
      }

      #canvas.loopRecording .loopRecordingIndicator {
        display: block;
      }

      /* =====================================================
         HELP
      ===================================================== */

      .help {
        position: absolute;

        left: 15px;
        bottom: 15px;

        font-size: 12px;

        opacity: 0.6;

        pointer-events: none;

        z-index: 50;
      }

      #canvas.playMode .help {
        display: none;
      }

      /* =====================================================
         SMALL SCREEN
      ===================================================== */

      @media (max-width: 800px) {
        .toolbar {
          gap: 6px;

          padding-left: 10px;
          padding-right: 10px;
        }

        button {
          padding: 8px 10px;

          font-size: 13px;
        }

        #addPad {
          margin-left: 0;
        }

        .loopArea {
          min-height: 82px;

          padding-left: 10px;
          padding-right: 10px;

          gap: 8px;
        }

        .masterVolume {
          width: 120px;
        }

        .loopButton {
          width: 76px;
          height: 48px;
        }

        .resetLoopButton {
          padding: 0 8px;
        }

        .loopInfo {
          width: 85px;
        }

        .loopLayers {
          gap: 6px;
        }

        .loopLayer {
          min-width: 100px;
        }
      }

      @media (max-width: 500px) {
        .loopInfo {
          display: none;
        }

        .masterVolume {
          width: 105px;
        }

        .loopArea {
          gap: 6px;
        }

        .masterLabel {
          font-size: 11px;
        }
      }
    </style>
  </head>

  <body>
    <!-- =====================================================
         TOOLBAR
    ===================================================== -->

    <div class="toolbar">
      <button id="editMode" class="modeButton active">EDIT</button>

      <button id="playMode" class="modeButton">PLAY</button>

      <button id="addPad">+ PAD</button>

      <button id="importPad">IMPORT PAD</button>

      <button id="addImage">+ IMAGE</button>

      <button id="renamePad">RENAME</button>

      <button id="deleteButton">DELETE</button>

      <input
        type="file"
        id="audioInput"
        accept="
          .mp3,
          .m4a,
          .wav,
          .aac,
          .aiff,
          .aif,
          .mp4,
          audio/mpeg,
          audio/mp4,
          audio/wav,
          audio/x-wav,
          audio/aac,
          audio/aiff
        "
        multiple
      />

      <input type="file" id="imageInput" accept="image/*" multiple />
    </div>

    <!-- =====================================================
         CANVAS
    ===================================================== -->

    <div id="canvas">
      <div class="help">
        EDIT：單點預覽・雙擊錄音・拖曳移動・右下角調整大小・PLAY：長按 PAD，左右
        Reverb/Distortion，上下 Frequency
      </div>

      <div class="loopRecordingIndicator">● RECORDING LOOP</div>
    </div>

    <!-- =====================================================
         LOOP AREA
    ===================================================== -->

    <div class="loopArea">
      <div class="masterVolume">
        <div class="masterHeader">
          <span class="masterLabel">MASTER</span>
          <span id="masterVolumeValue" class="masterValue"> 100% </span>
        </div>

        <input
          type="range"
          id="masterVolumeSlider"
          min="0"
          max="1"
          step="0.01"
          value="1"
        />
      </div>

      <button id="loopButton" class="loopButton">LOOP</button>

      <button id="resetLoopButton" class="resetLoopButton">RESET LOOP</button>

      <div class="loopInfo">
        <div class="loopDuration">LOOP: —</div>

        <div class="loopHint">Hold to record</div>
      </div>

      <div id="loopLayers" class="loopLayers"></div>
    </div>

    <script>
      /* =====================================================
         SAMPLER STATE
      ===================================================== */

      const sampler = {
        mode: "edit",

        pads: [],

        selectedPad: null,

        images: [],

        selectedImage: null,

        nextPadId: 1,

        nextImageId: 1,

        audioContext: null,

        masterGain: null,

        masterVolume: 1,

        mediaStream: null,

        recorder: null,

        recordingPad: null,

        chunks: [],

        recordingTimer: null,

        recordingStartTime: null,

        /* -------------------------
           LOOP
        ------------------------- */

        loops: [],

        nextLoopId: 1,

        loopRecording: false,

        loopRecordingStartTime: null,

        loopRecordingPointerId: null,

        loopDuration: null,

        loopSources: [],

        loopPressing: false,

        spacePressed: false,

        cancelLoopRecording: false,

        loopEvents: [],

        loopSchedulerTimers: new Map(),

        loopSchedulerGeneration: new Map(),
      };

      /* =====================================================
         DOM
      ===================================================== */

      const canvas = document.getElementById("canvas");

      const editModeButton = document.getElementById("editMode");

      const playModeButton = document.getElementById("playMode");

      const addPadButton = document.getElementById("addPad");

      const addImageButton = document.getElementById("addImage");

      const importPadButton = document.getElementById("importPad");

      const renamePadButton = document.getElementById("renamePad");

      const deleteButton = document.getElementById("deleteButton");

      const imageInput = document.getElementById("imageInput");

      const audioInput = document.getElementById("audioInput");

      const loopButton = document.getElementById("loopButton");

      const resetLoopButton = document.getElementById("resetLoopButton");

      const loopLayers = document.getElementById("loopLayers");

      const loopArea = document.querySelector(".loopArea");

      const masterVolumeSlider = document.getElementById("masterVolumeSlider");

      const masterVolumeValue = document.getElementById("masterVolumeValue");

      /* =====================================================
         SETTINGS
      ===================================================== */

      const CLICK_TIME = 250;

      const DRAG_THRESHOLD = 5;

      const DOUBLE_TAP_TIME = 350;

      const TRIM_THRESHOLD = 0.02;

      const TRIM_PADDING = 0.015;

      const MIN_TRIM_DURATION = 0.02;

      /* =====================================================
         TABLET / MOBILE GESTURE LOCK
      ===================================================== */

      document.addEventListener(
        "selectstart",
        (event) => {
          event.preventDefault();
        },
        { passive: false },
      );

      document.addEventListener(
        "contextmenu",
        (event) => {
          event.preventDefault();
        },
        { passive: false },
      );

      document.addEventListener(
        "gesturestart",
        (event) => {
          event.preventDefault();
        },
        { passive: false },
      );

      document.addEventListener(
        "gesturechange",
        (event) => {
          event.preventDefault();
        },
        { passive: false },
      );

      document.addEventListener(
        "gestureend",
        (event) => {
          event.preventDefault();
        },
        { passive: false },
      );

      document.addEventListener(
        "dblclick",
        (event) => {
          event.preventDefault();
        },
        { passive: false },
      );

      document.addEventListener(
        "touchstart",
        (event) => {
          if (event.touches.length > 1) {
            event.preventDefault();
          }
        },
        { passive: false },
      );

      document.addEventListener(
        "touchmove",
        (event) => {
          if (event.touches.length > 1) {
            event.preventDefault();
          }
        },
        { passive: false },
      );

      /* =====================================================
         PERCENT HELPERS
      ===================================================== */

      function pxToPercentX(px) {
        return (px / canvas.clientWidth) * 100;
      }

      function pxToPercentY(px) {
        return (px / canvas.clientHeight) * 100;
      }

      /* =====================================================
         SELECTION
      ===================================================== */

      function clearSelection() {
        sampler.pads.forEach((pad) => {
          if (pad.element) {
            pad.element.classList.remove("selected");
          }
        });

        sampler.images.forEach((image) => {
          if (image.element) {
            image.element.classList.remove("selected");
          }
        });

        sampler.selectedPad = null;

        sampler.selectedImage = null;
      }

      function selectPad(pad) {
        clearSelection();

        sampler.selectedPad = pad;

        if (pad.element) {
          pad.element.classList.add("selected");
        }
      }

      function selectImage(image) {
        clearSelection();

        sampler.selectedImage = image;

        if (image.element) {
          image.element.classList.add("selected");
        }
      }

      /* =====================================================
         AUDIO
      ===================================================== */

      function initAudio() {
        if (!sampler.audioContext) {
          const AudioContextClass =
            window.AudioContext || window.webkitAudioContext;

          if (!AudioContextClass) {
            throw new Error("Web Audio API unsupported");
          }

          sampler.audioContext = new AudioContextClass();
        }

        if (!sampler.masterGain) {
          sampler.masterGain = sampler.audioContext.createGain();

          sampler.masterGain.gain.value = sampler.masterVolume;

          sampler.masterGain.connect(sampler.audioContext.destination);
        }
      }

      async function resumeAudio() {
        initAudio();

        if (sampler.audioContext.state === "suspended") {
          await sampler.audioContext.resume();
        }
      }

      /* =====================================================
         MASTER VOLUME
      ===================================================== */

      function setMasterVolume(value) {
        const volume = Math.max(0, Math.min(1, Number(value)));

        sampler.masterVolume = volume;

        masterVolumeSlider.value = volume;

        masterVolumeValue.textContent = Math.round(volume * 100) + "%";

        if (sampler.masterGain && sampler.audioContext) {
          const now = sampler.audioContext.currentTime;

          sampler.masterGain.gain.cancelScheduledValues(now);

          sampler.masterGain.gain.setTargetAtTime(volume, now, 0.01);
        }
      }

      masterVolumeSlider.addEventListener("input", (event) => {
        event.stopPropagation();

        setMasterVolume(event.target.value);
      });

      masterVolumeSlider.addEventListener("pointerdown", (event) => {
        event.stopPropagation();
      });

      /* =====================================================
         RECORDING MIME
      ===================================================== */

      function getRecordingMimeType() {
        const types = [
          "audio/mp4",
          "audio/webm;codecs=opus",
          "audio/webm",
          "audio/ogg;codecs=opus",
        ];

        for (const type of types) {
          if (
            typeof MediaRecorder !== "undefined" &&
            MediaRecorder.isTypeSupported &&
            MediaRecorder.isTypeSupported(type)
          ) {
            return type;
          }
        }

        return "";
      }

      /* =====================================================
         AUTO TRIM
      ===================================================== */

      function trimAudioBuffer(
        audioBuffer,
        threshold = TRIM_THRESHOLD,
        padding = TRIM_PADDING,
      ) {
        if (!audioBuffer) {
          return null;
        }

        const sampleRate = audioBuffer.sampleRate;

        const length = audioBuffer.length;

        const channels = audioBuffer.numberOfChannels;

        if (length === 0) {
          return audioBuffer;
        }

        let startSample = -1;

        for (let i = 0; i < length; i++) {
          let amplitude = 0;

          for (let channel = 0; channel < channels; channel++) {
            const data = audioBuffer.getChannelData(channel);

            amplitude = Math.max(amplitude, Math.abs(data[i]));
          }

          if (amplitude >= threshold) {
            startSample = i;

            break;
          }
        }

        if (startSample === -1) {
          return audioBuffer;
        }

        let endSample = -1;

        for (let i = length - 1; i >= 0; i--) {
          let amplitude = 0;

          for (let channel = 0; channel < channels; channel++) {
            const data = audioBuffer.getChannelData(channel);

            amplitude = Math.max(amplitude, Math.abs(data[i]));
          }

          if (amplitude >= threshold) {
            endSample = i;

            break;
          }
        }

        if (endSample === -1) {
          return audioBuffer;
        }

        const paddingSamples = Math.floor(padding * sampleRate);

        startSample = Math.max(0, startSample - paddingSamples);

        endSample = Math.min(length - 1, endSample + paddingSamples);

        const trimmedLength = endSample - startSample + 1;

        if (trimmedLength < sampleRate * MIN_TRIM_DURATION) {
          return audioBuffer;
        }

        if (startSample === 0 && endSample === length - 1) {
          return audioBuffer;
        }

        const trimmedBuffer = sampler.audioContext.createBuffer(
          channels,
          trimmedLength,
          sampleRate,
        );

        for (let channel = 0; channel < channels; channel++) {
          const sourceData = audioBuffer.getChannelData(channel);

          const targetData = trimmedBuffer.getChannelData(channel);

          targetData.set(sourceData.slice(startSample, endSample + 1));
        }

        console.log("Audio trimmed:", {
          originalDuration: audioBuffer.duration,

          trimmedDuration: trimmedBuffer.duration,
        });

        return trimmedBuffer;
      }

      /* =====================================================
         CREATE PAD
      ===================================================== */

      function createPad(x = 10, y = 10) {
        const id = sampler.nextPadId++;

        const pad = {
          id,

          name: `PAD ${id}`,

          x,

          y,

          width: 15,

          height: 15,

          audioURL: null,

          audioBuffer: null,

          volume: 1,

          element: null,

          lastTapTime: 0,

          pendingDoubleTap: false,

          holdSource: null,

          holdGain: null,

          holding: false,

          holdPointerId: null,

          holdStartY: 0,

          holdInterval: 600,

          holdLastTriggerTime: 0,

          holdRAF: null,

          holdNextTriggerIn: 600,

          /*
           * 目前這個 PAD 正在讓哪些圖片
           * 建立 inverse overlay。
           */
          invertedImages: new Set(),

          holdTimer: null,

          holdGeneration: 0,

          // 是否已離開中央乾聲區；第一次進入效果區時會立即換掉原本的乾聲 source。
          holdEffectZoneActive: false,
        };

        sampler.pads.push(pad);

        renderPad(pad);

        selectPad(pad);

        return pad;
      }

      /* =====================================================
         IMPORT PAD
      ===================================================== */

      importPadButton.addEventListener("click", () => {
        if (sampler.mode !== "edit") {
          return;
        }

        audioInput.value = "";

        audioInput.click();
      });

      /* =====================================================
         AUDIO INPUT
      ===================================================== */

      audioInput.addEventListener("change", async (event) => {
        const files = Array.from(event.target.files || []);

        if (!files.length) {
          return;
        }

        for (const file of files) {
          await importAudioFileAsPad(file);
        }

        audioInput.value = "";
      });

      /* =====================================================
         IMPORT AUDIO FILE
      ===================================================== */

      async function importAudioFileAsPad(file) {
        if (!file) {
          return;
        }

        let pad = null;

        try {
          pad = createPad(10 + Math.random() * 50, 10 + Math.random() * 50);

          updatePadStatus(pad, "LOADING");

          pad.audioURL = URL.createObjectURL(file);

          initAudio();

          const arrayBuffer = await file.arrayBuffer();

          const decodedBuffer =
            await sampler.audioContext.decodeAudioData(arrayBuffer);

          pad.audioBuffer = trimAudioBuffer(decodedBuffer);

          updatePadStatus(pad, "READY");

          selectPad(pad);
        } catch (error) {
          console.error("Import audio error:", error);

          if (pad) {
            if (pad.audioURL) {
              URL.revokeObjectURL(pad.audioURL);
            }

            if (pad.element) {
              pad.element.remove();
            }

            sampler.pads = sampler.pads.filter((p) => p !== pad);

            if (sampler.selectedPad === pad) {
              sampler.selectedPad = null;
            }
          }

          alert(
            "無法匯入這個音檔。\n\n" +
              "請確認這是 MP3、M4A、WAV 或其他瀏覽器支援的音訊檔案。",
          );
        }
      }

      /* =====================================================
         RENDER PAD
      ===================================================== */

      function renderPad(pad) {
        const element = document.createElement("div");

        element.className = "pad";

        const content = document.createElement("div");

        content.className = "padContent";

        const name = document.createElement("div");

        name.className = "padName";

        name.textContent = pad.name;

        const status = document.createElement("div");

        status.className = "recordStatus";

        status.textContent = "NO SOUND";

        content.appendChild(name);

        content.appendChild(status);

        /* -------------------------
           PAD volume
        ------------------------- */

        const controls = document.createElement("div");

        controls.className = "padControls";

        const label = document.createElement("span");

        label.className = "padVolumeLabel";

        label.textContent = "VOL";

        const slider = document.createElement("input");

        slider.type = "range";

        slider.className = "padVolume";

        slider.min = "0";

        slider.max = "1";

        slider.step = "0.01";

        slider.value = pad.volume;

        const value = document.createElement("span");

        value.className = "padVolumeValue";

        value.textContent = Math.round(pad.volume * 100) + "%";

        controls.appendChild(label);

        controls.appendChild(slider);

        controls.appendChild(value);

        controls.addEventListener("pointerdown", (event) => {
          event.stopPropagation();
        });

        controls.addEventListener("pointermove", (event) => {
          event.stopPropagation();
        });

        controls.addEventListener("pointerup", (event) => {
          event.stopPropagation();
        });

        controls.addEventListener("click", (event) => {
          event.stopPropagation();
        });

        slider.addEventListener("input", (event) => {
          event.stopPropagation();

          setPadVolume(pad, event.target.value);
        });

        element.appendChild(content);

        element.appendChild(controls);

        const resizeHandle = document.createElement("div");

        resizeHandle.className = "resizeHandle";

        element.appendChild(resizeHandle);

        canvas.appendChild(element);

        pad.element = element;

        updatePad(pad);

        setupPadInteraction(pad, element, resizeHandle);
      }

      /* =====================================================
         PAD VOLUME
      ===================================================== */

      function setPadVolume(pad, value) {
        const volume = Math.max(0, Math.min(1, Number(value)));

        pad.volume = volume;

        if (!pad.element) {
          return;
        }

        const slider = pad.element.querySelector(".padVolume");

        const valueElement = pad.element.querySelector(".padVolumeValue");

        if (slider) {
          slider.value = volume;
        }

        if (valueElement) {
          valueElement.textContent = Math.round(volume * 100) + "%";
        }

        if (pad.holdGain) {
          pad.holdGain.gain.setTargetAtTime(
            volume,
            sampler.audioContext.currentTime,
            0.01,
          );
        }
      }

      /* =====================================================
         UPDATE PAD
      ===================================================== */

      function updatePad(pad) {
        if (!pad.element) {
          return;
        }

        pad.element.style.left = pad.x + "%";

        pad.element.style.top = pad.y + "%";

        pad.element.style.width = pad.width + "%";

        pad.element.style.height = pad.height + "%";

        /*
         * 如果 PLAY MODE 有 PAD 正在作用，
         * 尺寸改變後重新計算 inverse。
         */
        if (sampler.mode === "play" && pad.holding) {
          refreshAllPadImageInverts();
        }
      }

      /* =====================================================
         RENAME
      ===================================================== */

      function renameSelectedPad() {
        const pad = sampler.selectedPad;

        if (!pad) {
          alert("請先選取一個 PAD。");

          return;
        }

        const newName = window.prompt("輸入 PAD 名稱：", pad.name);

        if (newName === null) {
          return;
        }

        const trimmed = newName.trim();

        if (!trimmed) {
          return;
        }

        pad.name = trimmed;

        const nameElement = pad.element.querySelector(".padName");

        if (nameElement) {
          nameElement.textContent = pad.name;
        }
      }

      renamePadButton.addEventListener("click", renameSelectedPad);

      /* =====================================================
         PLAY MODE — PAD IMAGE INVERT
      ===================================================== */

      /*
       * 判斷兩個 DOM rectangle 是否有實際重疊。
       */
      function rectanglesOverlap(a, b) {
        return (
          a.left < b.right &&
          a.right > b.left &&
          a.top < b.bottom &&
          a.bottom > b.top
        );
      }

      /*
       * 找出 PAD 實際碰到的圖片。
       */
      function getImagesUnderPad(pad) {
        if (!pad || !pad.element) {
          return [];
        }

        const padRect = pad.element.getBoundingClientRect();

        return sampler.images.filter((image) => {
          if (!image.element) {
            return false;
          }

          const imageRect = image.element.getBoundingClientRect();

          return rectanglesOverlap(padRect, imageRect);
        });
      }

      /*
       * 移除某張圖片上，
       * 某一個 PAD 所建立的 inverse overlay。
       */
      function removeImageInvertOverlay(image, pad) {
        if (!image || !image.invertOverlays) {
          return;
        }

        const overlay = image.invertOverlays.get(pad);

        if (overlay) {
          overlay.remove();
        }

        image.invertOverlays.delete(pad);
      }

      /*
       * =====================================================
       * CREATE IMAGE INVERT OVERLAY
       * =====================================================
       *
       * 核心：
       *
       *     IMAGE ∩ PAD
       *
       * 只在實際交集區域建立 overlay。
       */
      function createImageInvertOverlay(image, pad) {
        if (!image || !image.element || !pad || !pad.element) {
          return null;
        }

        removeImageInvertOverlay(image, pad);

        const imageRect = image.element.getBoundingClientRect();

        const padRect = pad.element.getBoundingClientRect();

        /*
         * 計算圖片和 PAD 的實際交集。
         */

        const intersectionLeft = Math.max(imageRect.left, padRect.left);

        const intersectionTop = Math.max(imageRect.top, padRect.top);

        const intersectionRight = Math.min(imageRect.right, padRect.right);

        const intersectionBottom = Math.min(imageRect.bottom, padRect.bottom);

        const intersectionWidth = intersectionRight - intersectionLeft;

        const intersectionHeight = intersectionBottom - intersectionTop;

        /*
         * 沒有交集。
         */
        if (intersectionWidth <= 0 || intersectionHeight <= 0) {
          return null;
        }

        /*
         * overlay 相對於圖片左上角的位置。
         */
        const localLeft = intersectionLeft - imageRect.left;

        const localTop = intersectionTop - imageRect.top;

        /*
         * 建立 inverse overlay。
         */
        const overlay = document.createElement("div");

        overlay.className = "imageInvertOverlay";

        overlay.style.left = localLeft + "px";

        overlay.style.top = localTop + "px";

        overlay.style.width = intersectionWidth + "px";

        overlay.style.height = intersectionHeight + "px";

        /*
         * overlay 裡面放同一張圖片。
         */
        const overlayImage = document.createElement("img");

        overlayImage.src = image.url;

        overlayImage.draggable = false;

        /*
         * 必須使用圖片實際 pixel 尺寸。
         */
        overlayImage.style.width = imageRect.width + "px";

        overlayImage.style.height = imageRect.height + "px";

        /*
         * 把圖片內容往左／上移，
         * 讓 overlay 中顯示的部分
         * 和原圖完全對齊。
         */
        overlayImage.style.left = -localLeft + "px";

        overlayImage.style.top = -localTop + "px";

        overlay.appendChild(overlayImage);

        /*
         * 放入圖片 wrapper。
         */
        image.element.appendChild(overlay);

        /*
         * 建立 Map：
         *
         * PAD → overlay
         */
        if (!image.invertOverlays) {
          image.invertOverlays = new Map();
        }

        image.invertOverlays.set(pad, overlay);

        return overlay;
      }

      /*
       * =====================================================
       * APPLY PAD IMAGE INVERT
       * =====================================================
       */
      function applyPadImageInvert(pad) {
        if (!pad || sampler.mode !== "play") {
          return;
        }

        /*
         * 先清除舊的。
         */
        clearPadImageInvert(pad);

        const images = getImagesUnderPad(pad);

        /*
         * 記住這個 PAD 目前作用在哪些圖片。
         */
        pad.invertedImages = new Set(images);

        images.forEach((image) => {
          createImageInvertOverlay(image, pad);
        });
      }

      /*
       * =====================================================
       * CLEAR PAD IMAGE INVERT
       * =====================================================
       */
      function clearPadImageInvert(pad) {
        if (!pad) {
          return;
        }

        if (pad.invertedImages) {
          pad.invertedImages.forEach((image) => {
            removeImageInvertOverlay(image, pad);
          });

          pad.invertedImages.clear();
        }

        /*
         * 保險清除。
         */
        sampler.images.forEach((image) => {
          removeImageInvertOverlay(image, pad);
        });
      }

      /*
       * =====================================================
       * REFRESH ALL PAD INVERT OVERLAYS
       * =====================================================
       *
       * PAD / IMAGE 的 pixel rectangle 改變時，
       * 重新計算 inverse 範圍。
       */
      function refreshAllPadImageInverts() {
        if (sampler.mode !== "play") {
          return;
        }

        sampler.pads.forEach((pad) => {
          if (!pad.holding) {
            return;
          }

          /*
           * 先移除目前 overlay。
           */
          const oldImages = pad.invertedImages
            ? Array.from(pad.invertedImages)
            : [];

          oldImages.forEach((image) => {
            removeImageInvertOverlay(image, pad);
          });

          /*
           * 重新找圖片。
           */
          const images = getImagesUnderPad(pad);

          pad.invertedImages = new Set(images);

          images.forEach((image) => {
            createImageInvertOverlay(image, pad);
          });
        });
      }

      /* =====================================================
         PLAY MODE — HOLD PLAY
      ===================================================== */

      const HOLD_BASE_INTERVAL = 600;

      const HOLD_MIN_INTERVAL = 70;

      const HOLD_MAX_INTERVAL = 1400;

      const HOLD_INTERVAL_PER_PIXEL = 4;

      function getHoldIntervalFromY(pad, currentY) {
        const dy = currentY - pad.holdStartY;

        const interval = HOLD_BASE_INTERVAL + dy * HOLD_INTERVAL_PER_PIXEL;

        return Math.max(
          HOLD_MIN_INTERVAL,
          Math.min(HOLD_MAX_INTERVAL, interval),
        );
      }

      function updatePadHoldSpeed(pad, currentY) {
        if (!pad || !pad.holding) {
          return;
        }

        const newInterval = getHoldIntervalFromY(pad, currentY);

        pad.holdInterval = newInterval;

        updatePadHoldSpeedUI(pad);
      }

      function stopCurrentPadHoldSource(pad) {
        if (!pad) return;

        const source = pad.holdSource;

        if (!source) return;

        pad.holdSource = null;

        try {
          source.onended = null;
        } catch (error) {}

        try {
          source.stop();
        } catch (error) {}

        try {
          source.disconnect();
        } catch (error) {}

        if (pad.holdGain) {
          try {
            pad.holdGain.disconnect();
          } catch (error) {}
        }

        pad.holdGain = null;
        pad.holdFilter = null;
        pad.holdReverbDry = null;
        pad.holdReverbWet = null;
        pad.holdConvolver = null;
        pad.holdDistortion = null;
      }

      function runPadHoldScheduler(pad) {
        if (!pad || !pad.holding) {
          return;
        }

        if (!pad.audioBuffer) {
          return;
        }

        if (sampler.mode !== "play") {
          return;
        }

        const now = performance.now();

        if (now - pad.holdLastTriggerTime >= pad.holdInterval) {
          pad.holdLastTriggerTime = now;

          // 每次重新觸發都讓自己的聲音完整播放，
          // 不停止前一個 source；不同次觸發可以自然重疊。
          recordPadEvent(pad);

          playPad(pad, {
            isHoldSource: true,
            playbackRate: pad.holdFrequency ?? 1,
            reverb: pad.holdReverb ?? 0,
            distortion: pad.holdDistortion ?? 0,
          });
        }

        pad.holdRAF = requestAnimationFrame(() => {
          runPadHoldScheduler(pad);
        });
      }

      function scheduleNextPadHold(pad) {
        if (!pad || !pad.holding) {
          return;
        }

        if (!pad.audioBuffer) {
          return;
        }

        if (pad.holdRAF !== null) {
          cancelAnimationFrame(pad.holdRAF);

          pad.holdRAF = null;
        }

        pad.holdLastTriggerTime = performance.now();

        pad.holdRAF = requestAnimationFrame(() => {
          runPadHoldScheduler(pad);
        });
      }

      async function startPadHold(pad, pointerId, startX, startY) {
        if (sampler.mode !== "play") {
          return;
        }

        if (pad.holding) {
          return;
        }

        if (!pad.audioBuffer) {
          return;
        }

        pad.holdPointerId = pointerId;

        pad.holdStartY = startY;
        pad.holdStartX = startX;

        pad.holdFrequency = 1;
        pad.holdReverb = 0;
        pad.holdDistortionAmount = 0;
        pad.holdDistortion = 0;

        pad.holdInterval = HOLD_BASE_INTERVAL;

        pad.holdLastTriggerTime = 0;

        pad.holdGeneration++;
        pad.holdEffectZoneActive = false;

        const generation = pad.holdGeneration;

        try {
          await resumeAudio();
        } catch (error) {
          console.error("Cannot resume audio:", error);

          pad.holdPointerId = null;

          return;
        }

        if (sampler.mode !== "play") {
          pad.holdPointerId = null;

          return;
        }

        if (pad.holdGeneration !== generation) {
          pad.holdPointerId = null;

          return;
        }

        if (pad.holdPointerId !== pointerId) {
          return;
        }

        pad.holding = true;

        /*
         * 第一下立即播放。
         */
        recordPadEvent(pad);

        playPad(pad, {
          isHoldSource: true,
          playbackRate: pad.holdFrequency,
          reverb: pad.holdReverb,
          distortion: pad.holdDistortionAmount,
        });

        if (pad.element) {
          pad.element.classList.add("holding");
        }

        updatePadEffectUI(pad);

        scheduleNextPadHold(pad);

        /*
         * resumeAudio() 是 async，
         * 為避免開始播放後 overlay 因為 layout
         * 尚未完成而位置不準，再算一次。
         */
        refreshAllPadImageInverts();
      }

      /* =====================================================
         RELEASE PAD
      ===================================================== */

      function stopPadHold(pad, pointerId = null) {
        if (!pad) {
          return;
        }

        if (
          pointerId !== null &&
          pad.holdPointerId !== null &&
          pad.holdPointerId !== pointerId
        ) {
          return;
        }

        pad.holding = false;

        pad.holdPointerId = null;

        pad.holdGeneration++;

        if (pad.holdRAF !== null) {
          cancelAnimationFrame(pad.holdRAF);

          pad.holdRAF = null;
        }

        if (pad.holdTimer !== null) {
          clearTimeout(pad.holdTimer);

          pad.holdTimer = null;
        }

        // 放開 PAD 不截斷正在播放的聲音。
        // 每一次觸發都讓音檔完整播放完畢。
        pad.holdEffectZoneActive = false;

        /*
         * 放開 PAD：
         * 清除這個 PAD 的所有 inverse。
         */
        clearPadImageInvert(pad);

        if (pad.element) {
          pad.element.classList.remove("holding");

          if (!pad.holding) {
            pad.element.classList.remove("playing");
          }
        }
      }

      /* =====================================================
         STOP ALL PAD HOLDS
      ===================================================== */

      function stopAllPadHolds() {
        sampler.pads.forEach((pad) => {
          stopPadHold(pad);
        });
      }

      /* =====================================================
         PAD INTERACTION
      ===================================================== */

      function setupPadInteraction(pad, element, resizeHandle) {
        let startX = 0;

        let startY = 0;

        let startPadX = 0;

        let startPadY = 0;

        let startWidth = 0;

        let startHeight = 0;

        let pointerDownTime = 0;

        let moved = false;

        let action = null;

        element.addEventListener(
          "pointerdown",
          async (event) => {
            /*
             * PLAY MODE
             */
            if (sampler.mode === "play") {
              if (event.target.closest(".padControls")) {
                return;
              }

              event.preventDefault();

              try {
                element.setPointerCapture(event.pointerId);
              } catch (error) {}

              /*
               * 按下瞬間：
               *
               * PAD 多大，
               * 就只 inverse PAD 範圍。
               */
              applyPadImageInvert(pad);

              await startPadHold(
                pad,
                event.pointerId,
                event.clientX,
                event.clientY,
              );

              return;
            }

            /*
             * EDIT MODE
             */
            if (sampler.mode !== "edit") {
              return;
            }

            if (event.target.closest(".padControls")) {
              return;
            }

            event.preventDefault();

            try {
              element.setPointerCapture(event.pointerId);
            } catch (error) {}

            startX = event.clientX;

            startY = event.clientY;

            startPadX = pad.x;

            startPadY = pad.y;

            startWidth = pad.width;

            startHeight = pad.height;

            pointerDownTime = Date.now();

            moved = false;

            if (event.target === resizeHandle) {
              action = "resize";

              selectPad(pad);

              return;
            }

            action = "none";

            if (sampler.recordingPad === pad) {
              selectPad(pad);

              return;
            }

            const now = Date.now();

            const timeSinceLastTap = now - pad.lastTapTime;

            if (pad.lastTapTime > 0 && timeSinceLastTap < DOUBLE_TAP_TIME) {
              pad.lastTapTime = 0;

              pad.pendingDoubleTap = true;

              startRecording(pad);
            } else {
              pad.lastTapTime = now;

              pad.pendingDoubleTap = false;

              selectPad(pad);

              playPad(pad);
            }
          },
          { passive: false },
        );

        element.addEventListener(
          "pointermove",
          (event) => {
            /*
             * PLAY MODE：
             *
             * X / Y 同時控制效果。
             * 中央隱形正方形為乾聲基準區。
             */
            if (sampler.mode === "play") {
              event.preventDefault();

              if (pad.holding && pad.holdPointerId === event.pointerId) {
                updatePadEffectState(pad, event.clientX, event.clientY);
              }

              return;
            }

            if (sampler.mode !== "edit") {
              return;
            }

            if (action === null) {
              return;
            }

            if (sampler.recordingPad === pad) {
              return;
            }

            const dx = event.clientX - startX;

            const dy = event.clientY - startY;

            const distance = Math.sqrt(dx * dx + dy * dy);

            if (action === "resize") {
              moved = true;

              pad.width = Math.max(3, startWidth + pxToPercentX(dx));

              pad.height = Math.max(3, startHeight + pxToPercentY(dy));

              updatePad(pad);

              return;
            }

            if (distance > DRAG_THRESHOLD) {
              moved = true;

              action = "drag";

              pad.lastTapTime = 0;

              pad.x = startPadX + pxToPercentX(dx);

              pad.y = startPadY + pxToPercentY(dy);

              updatePad(pad);
            }
          },
          { passive: false },
        );

        element.addEventListener(
          "pointerup",
          (event) => {
            if (sampler.mode === "play") {
              event.preventDefault();

              stopPadHold(pad, event.pointerId);

              try {
                element.releasePointerCapture(event.pointerId);
              } catch (error) {}

              return;
            }

            if (sampler.mode !== "edit") {
              return;
            }

            if (moved) {
              action = null;

              return;
            }

            if (sampler.recordingPad === pad && !pad.pendingDoubleTap) {
              stopRecording();

              action = null;

              return;
            }

            if (pad.pendingDoubleTap) {
              pad.pendingDoubleTap = false;

              action = null;

              return;
            }

            const duration = Date.now() - pointerDownTime;

            if (duration >= CLICK_TIME) {
              pad.lastTapTime = 0;

              action = null;

              return;
            }

            action = null;
          },
          { passive: false },
        );

        element.addEventListener(
          "pointercancel",
          (event) => {
            if (sampler.mode === "play") {
              event.preventDefault();

              stopPadHold(pad, event.pointerId);

              return;
            }

            action = null;

            pad.pendingDoubleTap = false;
          },
          { passive: false },
        );

        element.addEventListener("lostpointercapture", () => {
          if (sampler.mode === "play") {
            stopPadHold(pad);

            return;
          }

          action = null;

          pad.pendingDoubleTap = false;
        });
      }

      /* =====================================================
         IMAGE
      ===================================================== */

      addImageButton.addEventListener("click", () => {
        if (sampler.mode !== "edit") {
          return;
        }

        imageInput.value = "";

        imageInput.click();
      });

      imageInput.addEventListener("change", (event) => {
        const files = Array.from(event.target.files || []);

        files.forEach((file) => {
          createImage(file);
        });

        imageInput.value = "";
      });

      function createImage(file) {
        const id = sampler.nextImageId++;

        const image = {
          id,

          x: 10 + Math.random() * 30,

          y: 10 + Math.random() * 30,

          width: 30,

          height: 30,

          url: URL.createObjectURL(file),

          element: null,

          /*
           * Map：
           *
           * PAD → inverse overlay
           *
           * 允許多個 PAD 同時作用。
           */
          invertOverlays: new Map(),
        };

        sampler.images.push(image);

        renderImage(image);

        selectImage(image);
      }

      /* =====================================================
         RENDER IMAGE
      ===================================================== */

      function renderImage(image) {
        const wrapper = document.createElement("div");

        wrapper.className = "imageItem";

        wrapper.style.left = image.x + "%";

        wrapper.style.top = image.y + "%";

        wrapper.style.width = image.width + "%";

        wrapper.style.height = image.height + "%";

        const img = document.createElement("img");

        img.src = image.url;

        img.draggable = false;

        img.style.width = "100%";

        img.style.height = "100%";

        img.style.objectFit = "fill";

        img.style.pointerEvents = "none";

        /*
         * Resize handle。
         */
        const resizeHandle = document.createElement("div");

        resizeHandle.className = "imageResizeHandle";

        wrapper.appendChild(img);

        wrapper.appendChild(resizeHandle);

        canvas.appendChild(wrapper);

        image.element = wrapper;

        if (!image.invertOverlays) {
          image.invertOverlays = new Map();
        }

        setupImageInteraction(image, wrapper, resizeHandle);
      }

      function updateImage(image) {
        if (!image.element) {
          return;
        }

        image.element.style.left = image.x + "%";

        image.element.style.top = image.y + "%";

        image.element.style.width = image.width + "%";

        image.element.style.height = image.height + "%";

        /*
         * 如果目前 PLAY MODE 有 inverse，
         * 尺寸變化後重新計算。
         */
        if (
          sampler.mode === "play" &&
          image.invertOverlays &&
          image.invertOverlays.size > 0
        ) {
          refreshAllPadImageInverts();
        }
      }

      /* =====================================================
         IMAGE INTERACTION
      ===================================================== */

      function setupImageInteraction(image, element, resizeHandle) {
        let startX;

        let startY;

        let startImageX;

        let startImageY;

        let startWidth;

        let startHeight;

        let action = null;

        element.addEventListener(
          "pointerdown",
          (event) => {
            if (sampler.mode !== "edit") {
              return;
            }

            event.preventDefault();

            try {
              element.setPointerCapture(event.pointerId);
            } catch (error) {}

            selectImage(image);

            startX = event.clientX;

            startY = event.clientY;

            startImageX = image.x;

            startImageY = image.y;

            startWidth = image.width;

            startHeight = image.height;

            if (event.target === resizeHandle) {
              action = "resize";
            } else {
              action = "drag";
            }
          },
          { passive: false },
        );

        element.addEventListener(
          "pointermove",
          (event) => {
            if (sampler.mode !== "edit") {
              return;
            }

            if (!action) {
              return;
            }

            event.preventDefault();

            const dx = event.clientX - startX;

            const dy = event.clientY - startY;

            if (action === "drag") {
              image.x = startImageX + pxToPercentX(dx);

              image.y = startImageY + pxToPercentY(dy);
            }

            if (action === "resize") {
              image.width = Math.max(3, startWidth + pxToPercentX(dx));

              image.height = Math.max(3, startHeight + pxToPercentY(dy));
            }

            updateImage(image);
          },
          { passive: false },
        );

        element.addEventListener("pointerup", () => {
          action = null;
        });

        element.addEventListener("pointercancel", () => {
          action = null;
        });

        element.addEventListener("lostpointercapture", () => {
          action = null;
        });
      }

      /* =====================================================
         DELETE
      ===================================================== */

      function deleteSelected() {
        if (sampler.selectedPad) {
          const pad = sampler.selectedPad;

          stopPadHold(pad);

          if (sampler.recordingPad === pad) {
            stopRecording();
          }

          /*
           * 清除這個 PAD 的 inverse。
           */
          clearPadImageInvert(pad);

          if (pad.audioURL) {
            URL.revokeObjectURL(pad.audioURL);
          }

          if (pad.element) {
            pad.element.remove();
          }

          sampler.pads = sampler.pads.filter((p) => p !== pad);

          sampler.selectedPad = null;

          return;
        }

        if (sampler.selectedImage) {
          const image = sampler.selectedImage;

          /*
           * 移除這張圖片上的
           * 所有 inverse overlay。
           */
          if (image.invertOverlays) {
            image.invertOverlays.forEach((overlay) => {
              if (overlay) {
                overlay.remove();
              }
            });

            image.invertOverlays.clear();
          }

          /*
           * 從所有 PAD 的
           * invertedImages 移除。
           */
          sampler.pads.forEach((pad) => {
            if (pad.invertedImages) {
              pad.invertedImages.delete(image);
            }
          });

          if (image.url) {
            URL.revokeObjectURL(image.url);
          }

          if (image.element) {
            image.element.remove();
          }

          sampler.images = sampler.images.filter((img) => img !== image);

          sampler.selectedImage = null;
        }
      }

      deleteButton.addEventListener("click", deleteSelected);

      /* =====================================================
         DELETE KEY
      ===================================================== */

      document.addEventListener("keydown", (event) => {
        if (sampler.mode !== "edit") {
          return;
        }

        if (event.key !== "Delete" && event.key !== "Backspace") {
          return;
        }

        const tag = document.activeElement?.tagName;

        if (tag === "INPUT" || tag === "TEXTAREA") {
          return;
        }

        event.preventDefault();

        deleteSelected();
      });

      /* =====================================================
         PAD RECORDING
      ===================================================== */

      async function startRecording(pad) {
        if (sampler.recordingPad) {
          return;
        }

        try {
          initAudio();

          if (!sampler.mediaStream) {
            sampler.mediaStream = await navigator.mediaDevices.getUserMedia({
              audio: true,
            });
          }

          await resumeAudio();

          if (typeof MediaRecorder === "undefined") {
            throw new Error("MediaRecorder unsupported");
          }

          if (sampler.recordingPad) {
            return;
          }

          const mimeType = getRecordingMimeType();

          const options = mimeType ? { mimeType } : undefined;

          sampler.recordingPad = pad;

          sampler.chunks = [];

          sampler.recorder = new MediaRecorder(sampler.mediaStream, options);

          sampler.recorder.ondataavailable = (event) => {
            if (event.data.size > 0) {
              sampler.chunks.push(event.data);
            }
          };

          sampler.recorder.onstop = async () => {
            try {
              const recorder = sampler.recorder;

              const actualType = recorder?.mimeType || mimeType || "audio/mp4";

              const blob = new Blob(sampler.chunks, {
                type: actualType,
              });

              if (pad.audioURL) {
                URL.revokeObjectURL(pad.audioURL);
              }

              pad.audioURL = URL.createObjectURL(blob);

              const arrayBuffer = await blob.arrayBuffer();

              const decodedBuffer =
                await sampler.audioContext.decodeAudioData(arrayBuffer);

              pad.audioBuffer = trimAudioBuffer(decodedBuffer);

              updatePadStatus(pad, "READY");
            } catch (error) {
              console.error("Audio decode error:", error);

              updatePadStatus(pad, "ERROR");
            }

            sampler.recordingPad = null;

            sampler.recorder = null;

            sampler.chunks = [];
          };

          sampler.recorder.start();

          sampler.recordingStartTime = Date.now();

          clearInterval(sampler.recordingTimer);

          sampler.recordingTimer = setInterval(updateRecordingTimer, 1000);

          pad.element.classList.add("recording");

          updateRecordingText(pad, "● REC 00:00");
        } catch (error) {
          console.error("Recording error:", error);

          sampler.recordingPad = null;

          sampler.recorder = null;

          clearInterval(sampler.recordingTimer);

          sampler.recordingTimer = null;

          if (pad.element) {
            pad.element.classList.remove("recording");
          }

          alert(
            "無法開始錄音。\n\n" + "請確認網站使用 HTTPS，並允許麥克風權限。",
          );
        }
      }

      function updateRecordingTimer() {
        if (!sampler.recordingPad) {
          return;
        }

        const elapsed = Math.floor(
          (Date.now() - sampler.recordingStartTime) / 1000,
        );

        const minutes = String(Math.floor(elapsed / 60)).padStart(2, "0");

        const seconds = String(elapsed % 60).padStart(2, "0");

        updateRecordingText(
          sampler.recordingPad,
          `● REC ${minutes}:${seconds}`,
        );
      }

      function stopRecording() {
        if (!sampler.recorder) {
          return;
        }

        if (sampler.recorder.state !== "inactive") {
          sampler.recorder.stop();
        }

        clearInterval(sampler.recordingTimer);

        sampler.recordingTimer = null;

        if (sampler.recordingPad) {
          sampler.recordingPad.element.classList.remove("recording");
        }
      }

      function updatePadStatus(pad, status) {
        const element = pad.element?.querySelector(".recordStatus");

        if (element) {
          element.textContent = status;
        }
      }

      function updatePadHoldSpeedUI(pad) {
        const element = pad.element?.querySelector(".recordStatus");

        if (!element) {
          return;
        }

        if (!pad.holding) {
          return;
        }

        element.textContent = `RETRIGGER ${Math.round(pad.holdInterval)}ms`;
      }

      function updateRecordingText(pad, text) {
        const element = pad.element?.querySelector(".recordStatus");

        if (element) {
          element.textContent = text;
        }
      }

      /* =====================================================
         PLAY MODE — AUDIO EFFECTS

         操作方式：
         - 中央隱形正方形：完全乾聲 / 原始頻率
         - 正方形左側：Reverb 越往左越重
         - 正方形右側：Distortion 越往右越重
         - 正方形上側：頻率越往上越高
         - 正方形下側：頻率越往下越低
         - 中央正方形不會畫出來，只作為控制基準區
      ===================================================== */

      // 隱形中央控制正方形的半邊大小（px）
      // 越大，越容易維持乾聲／原始頻率。
      const EFFECT_NEUTRAL_HALF = 75;

      // 從中央基準區到效果最大值所需要移動的距離。
      // 調大會讓效果變化更慢、更細。
      const EFFECT_X_RANGE = 420;
      const EFFECT_Y_RANGE = 340;

      // 頻率變化範圍。刻意縮小，避免一點點移動就變很多。
      const MIN_PLAYBACK_RATE = 0.72;
      const MAX_PLAYBACK_RATE = 1.38;

      function makeReverbImpulse(duration = 2.8, decay = 2.2) {
        const ctx = sampler.audioContext;
        const length = Math.max(1, Math.floor(ctx.sampleRate * duration));
        const impulse = ctx.createBuffer(2, length, ctx.sampleRate);

        for (let channel = 0; channel < impulse.numberOfChannels; channel++) {
          const data = impulse.getChannelData(channel);
          for (let i = 0; i < length; i++) {
            const t = i / length;
            data[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, decay);
          }
        }
        return impulse;
      }

      function makeDistortionCurve(amount = 0) {
        const samples = 44100;
        const curve = new Float32Array(samples);

        if (amount <= 0.0001) {
          for (let i = 0; i < samples; i++) {
            curve[i] = (i * 2) / samples - 1;
          }
          return curve;
        }

        // 比上一版更容易聽出來，但仍然保持由左到右漸進。
        const k = 1 + amount * 80;
        for (let i = 0; i < samples; i++) {
          const x = (i * 2) / samples - 1;
          curve[i] = ((1 + k) * x) / (1 + k * Math.abs(x));
        }
        return curve;
      }

      function clamp01(value) {
        return Math.max(0, Math.min(1, Number(value) || 0));
      }

      function getPadEffectState(pad, currentX, currentY) {
        const dx = currentX - pad.holdStartX;
        const dy = currentY - pad.holdStartY;

        /*
         * 中央隱形正方形：
         * |dx| <= EFFECT_NEUTRAL_HALF 且 |dy| <= EFFECT_NEUTRAL_HALF
         * 時完全不加效果，frequency = 1。
         */
        const horizontalDistance = Math.max(
          0,
          Math.abs(dx) - EFFECT_NEUTRAL_HALF,
        );
        const verticalDistance = Math.max(
          0,
          Math.abs(dy) - EFFECT_NEUTRAL_HALF,
        );

        // 左邊只增加 Reverb，右邊只增加 Distortion。
        const reverb =
          dx < -EFFECT_NEUTRAL_HALF
            ? clamp01(horizontalDistance / EFFECT_X_RANGE)
            : 0;

        const distortion =
          dx > EFFECT_NEUTRAL_HALF
            ? clamp01(horizontalDistance / EFFECT_X_RANGE)
            : 0;

        // 上方提高頻率，下方降低頻率。
        let playbackRate = 1;

        if (dy < -EFFECT_NEUTRAL_HALF) {
          const amount = clamp01(verticalDistance / EFFECT_Y_RANGE);
          playbackRate = 1 + amount * (MAX_PLAYBACK_RATE - 1);
        } else if (dy > EFFECT_NEUTRAL_HALF) {
          const amount = clamp01(verticalDistance / EFFECT_Y_RANGE);
          playbackRate = 1 - amount * (1 - MIN_PLAYBACK_RATE);
        }

        return {
          reverb,
          distortion,
          playbackRate,
        };
      }

      function updatePadEffectState(pad, currentX, currentY) {
        if (!pad || !pad.holding) return;

        const state = getPadEffectState(pad, currentX, currentY);

        pad.holdReverb = state.reverb;
        pad.holdDistortion = state.distortion;
        pad.holdDistortionAmount = state.distortion;
        pad.holdFrequency = state.playbackRate;

        updatePadEffectUI(pad);

        const ctx = sampler.audioContext;
        if (!ctx) return;
        const now = ctx.currentTime;

        /*
         * 不重新建立 source。
         *
         * 這是這版最重要的修正：
         * - 第一次按下產生的聲音就是「目前這一個 source」
         * - 拖曳時直接改它的 playbackRate / distortion / reverb
         * - 因此不會出現「原本乾聲 + 新效果聲」兩個聲音疊在一起
         * - 同時也不需要 stop()，所以音檔會完整播放完
         */

        const smoothing = 0.08;

        if (pad.holdReverbDry) {
          pad.holdReverbDry.gain.cancelScheduledValues(now);
          pad.holdReverbDry.gain.setTargetAtTime(
            Math.max(0.08, 1 - state.reverb * 0.72),
            now,
            smoothing,
          );
        }

        if (pad.holdReverbWet) {
          pad.holdReverbWet.gain.cancelScheduledValues(now);
          pad.holdReverbWet.gain.setTargetAtTime(
            state.reverb * 1.05,
            now,
            smoothing,
          );
        }

        if (pad.holdDistortion) {
          pad.holdDistortion.curve = makeDistortionCurve(state.distortion);
        }

        if (pad.holdSource) {
          try {
            pad.holdSource.playbackRate.cancelScheduledValues(now);
            pad.holdSource.playbackRate.setTargetAtTime(
              state.playbackRate,
              now,
              smoothing,
            );
          } catch (error) {}
        }
      }

      function updatePadEffectUI(pad) {
        const element = pad.element?.querySelector(".padEffectStatus");
        if (!element || !pad.holding) return;

        const reverb = Math.round(pad.holdReverb * 100);
        const distortion = Math.round(
          (pad.holdDistortion ?? pad.holdDistortionAmount ?? 0) * 100,
        );
        const freq = pad.holdFrequency.toFixed(2);

        if (pad.holdReverb > 0.02) {
          element.textContent = `REVERB ${reverb}%  •  FREQ ${freq}×`;
        } else if (pad.holdDistortion > 0.02) {
          element.textContent = `DIST ${distortion}%  •  FREQ ${freq}×`;
        } else {
          element.textContent = `FREQ ${freq}×`;
        }
      }

      function connectPadAudioChain(source, pad, destination, options = {}) {
        const ctx = sampler.audioContext;

        const playbackRate =
          options.playbackRate !== undefined ? options.playbackRate : 1;

        const reverb =
          options.reverb !== undefined ? clamp01(options.reverb) : 0;

        const distortion =
          options.distortion !== undefined ? clamp01(options.distortion) : 0;

        const padGain = ctx.createGain();
        padGain.gain.value = pad.volume;

        const filter = ctx.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.value = 20000;
        filter.Q.value = 0.2;

        const distortionNode = ctx.createWaveShaper();
        distortionNode.oversample = "4x";
        distortionNode.curve = makeDistortionCurve(distortion);

        const dryGain = ctx.createGain();
        const wetGain = ctx.createGain();
        dryGain.gain.value = Math.max(0.08, 1 - reverb * 0.72);
        wetGain.gain.value = reverb * 1.05;

        const convolver = ctx.createConvolver();
        convolver.buffer = makeReverbImpulse();

        source.playbackRate.value = playbackRate;

        source.connect(filter);
        filter.connect(distortionNode);

        distortionNode.connect(dryGain);
        dryGain.connect(padGain);

        distortionNode.connect(convolver);
        convolver.connect(wetGain);
        wetGain.connect(padGain);

        padGain.connect(destination);

        return {
          padGain,
          filter,
          distortionNode,
          dryGain,
          wetGain,
          convolver,
        };
      }

      function disconnectPadAudioChain(chain) {
        if (!chain) return;
        Object.values(chain).forEach((node) => {
          try {
            node.disconnect();
          } catch (error) {}
        });
      }

      /* =====================================================
         PLAY PAD — NORMAL PREVIEW
      ===================================================== */

      function playPad(pad, options = {}) {
        if (!pad.audioBuffer) {
          return null;
        }

        initAudio();

        if (sampler.audioContext.state === "suspended") {
          sampler.audioContext.resume();
        }

        const source = sampler.audioContext.createBufferSource();

        source.buffer = pad.audioBuffer;

        const chain = connectPadAudioChain(
          source,
          pad,
          options.destination || sampler.masterGain,
          {
            playbackRate:
              options.playbackRate !== undefined
                ? options.playbackRate
                : options.frequency !== undefined
                  ? options.frequency
                  : 1,
            reverb: options.reverb !== undefined ? options.reverb : 0,
            distortion:
              options.distortion !== undefined ? options.distortion : 0,
          },
        );

        const startTime =
          options.startTime !== undefined
            ? options.startTime
            : sampler.audioContext.currentTime;

        source.start(startTime);

        if (pad.element) {
          pad.element.classList.add("playing");
        }

        if (options.isHoldSource) {
          pad.holdSource = source;
          pad.holdGain = chain.padGain;
          pad.holdFilter = chain.filter;
          pad.holdReverbDry = chain.dryGain;
          pad.holdReverbWet = chain.wetGain;
          pad.holdConvolver = chain.convolver;
          pad.holdDistortion = chain.distortionNode;
        }

        source.onended = () => {
          if (pad.element) {
            if (!pad.holding) {
              pad.element.classList.remove("playing");
            }
          }

          if (pad.holdSource === source) {
            pad.holdSource = null;
            pad.holdGain = null;
            pad.holdFilter = null;
            pad.holdReverbDry = null;
            pad.holdReverbWet = null;
            pad.holdConvolver = null;
            pad.holdDistortion = null;
          }

          try {
            source.disconnect();
          } catch (error) {}

          disconnectPadAudioChain(chain);
        };

        return source;
      }

      /* =====================================================
         LOOP EVENT RECORDING
      ===================================================== */

      async function startLoopRecording() {
        if (sampler.loopRecording) {
          return;
        }

        if (sampler.mode !== "play") {
          return;
        }

        try {
          await resumeAudio();
        } catch (error) {
          console.error(error);

          return;
        }

        sampler.loopRecording = true;

        sampler.cancelLoopRecording = false;

        sampler.loopEvents = [];

        sampler.loopRecordingStartTime = sampler.audioContext.currentTime;

        loopButton.classList.add("recording");

        loopButton.textContent = "RECORDING";

        canvas.classList.add("loopRecording");
      }

      /* =====================================================
         RECORD PAD EVENT
      ===================================================== */

      function recordPadEvent(pad) {
        if (!sampler.loopRecording) {
          return;
        }

        if (sampler.loopRecordingStartTime === null) {
          return;
        }

        const now = sampler.audioContext.currentTime;

        const time = now - sampler.loopRecordingStartTime;

        sampler.loopEvents.push({
          pad: pad,
          time: Math.max(0, time),
          playbackRate: pad.holdFrequency ?? 1,
          reverb: pad.holdReverb ?? 0,
          distortion: pad.holdDistortion ?? pad.holdDistortionAmount ?? 0,
        });
      }

      /* =====================================================
         STOP LOOP RECORDING
      ===================================================== */

      function stopLoopRecording() {
        if (!sampler.loopRecording) {
          return;
        }

        sampler.loopRecording = false;

        loopButton.classList.remove("recording");

        loopButton.textContent = "LOOP";

        canvas.classList.remove("loopRecording");

        if (sampler.cancelLoopRecording) {
          sampler.cancelLoopRecording = false;

          sampler.loopEvents = [];

          sampler.loopRecordingStartTime = null;

          return;
        }

        finishLoopRecording();
      }

      /* =====================================================
         FINISH LOOP
      ===================================================== */

      function finishLoopRecording() {
        const events = sampler.loopEvents.map((event) => ({
          pad: event.pad,
          time: event.time,
          playbackRate: event.playbackRate ?? 1,
          reverb: event.reverb ?? 0,
          distortion: event.distortion ?? 0,
        }));

        const recordingStart = sampler.loopRecordingStartTime;

        const recordingEndTime = sampler.audioContext.currentTime;

        sampler.loopEvents = [];

        sampler.loopRecordingStartTime = null;

        if (recordingStart === null) {
          return;
        }

        let duration = recordingEndTime - recordingStart;

        duration = Math.max(0.05, duration);

        if (sampler.loopDuration === null) {
